function Panel({title,onClose,children}){
  useEffect(()=>{
    const h=e=>{if(e.key==="Escape")onClose();};
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[onClose]);
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000000CC",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"18px 18px 0 0",width:"100%",maxWidth:700,maxHeight:"90vh",overflowY:"auto",padding:"16px 16px calc(24px + env(safe-area-inset-bottom))"}}>
        <div style={{width:38,height:4,borderRadius:3,background:C.card3,margin:"0 auto 16px"}}/>
        <div style={{display:"flex",alignItems:"center",marginBottom:16}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,flex:1}}>{title}</div>
          <Btn onClick={onClose} variant="ghost" small>Chiudi</Btn>
        </div>
        {children}
      </div>
    </div>
  );
}

const Sub=({children})=>(
  <div style={{fontSize:10,color:C.muted,fontWeight:800,letterSpacing:1,margin:"20px 0 8px"}}>{children}</div>
);
const Line=({children})=>(
  <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"11px 13px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>{children}</div>
);

/* ═══════════════════════════════════════════════════════
   CHI SEI — collega l'account a un giocatore della rosa
═══════════════════════════════════════════════════════ */
function IdentitySheet({players,mine,onPick,onNew,onClose,closable}){
  const [sel,setSel]=useState(mine||"");
  const [nome,setNome]=useState("");
  const [busy,setBusy]=useState(false), [err,setErr]=useState("");
  const conferma=async()=>{
    setBusy(true);setErr("");
    try{
      if(sel==="__new__"){
        if(!nome.trim())throw new Error("Scrivi il tuo nome");
        await onNew(nome.trim());
      }else{
        if(!sel)throw new Error("Scegli chi sei");
        await onPick(sel);
      }
    }catch(e){setErr(errText(e));setBusy(false);return;}
    setBusy(false);
  };
  return(
    <Panel title="CHI SEI?" onClose={closable?onClose:()=>{}}>
      <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>
        Collega il tuo account a un giocatore della rosa: servirà per la selezione squadre e per gestire la tua foto.
      </div>
      {players.map(p=>(
        <button key={p.id} onClick={()=>setSel(p.id)} style={{width:"100%",textAlign:"left",background:sel===p.id?C.accent+"15":C.card2,border:`1px solid ${sel===p.id?C.accent:C.border}`,borderRadius:10,padding:"10px 13px",marginBottom:6,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <Avatar player={p} size={32}/>
          <span style={{color:C.text,fontWeight:700,fontSize:14,flex:1}}>{p.name}</span>
          {sel===p.id&&<span style={{color:C.accent,fontSize:16}}>✓</span>}
        </button>
      ))}
      <button onClick={()=>setSel("__new__")} style={{width:"100%",textAlign:"left",background:sel==="__new__"?C.accent+"15":C.card2,border:`1px dashed ${sel==="__new__"?C.accent:C.border}`,borderRadius:10,padding:"10px 13px",marginBottom:6,cursor:"pointer",color:C.text,fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif"}}>Non ci sono · aggiungimi</button>
      {sel==="__new__"&&<div style={{marginTop:10}}><Input label="IL TUO NOME" value={nome} onChange={setNome} placeholder="Come ti chiami?" autoFocus/></div>}
      <Err>{err}</Err>
      <Btn onClick={conferma} disabled={busy} full style={{marginTop:10,padding:"13px 0"}}>{busy?"…":"Conferma"}</Btn>
    </Panel>
  );
}

/* ═══════════════════════════════════════════════════════
   ACCOUNT E GRUPPO
═══════════════════════════════════════════════════════ */
function AccountPanel(props){
  const {sb,cfg,group,members,me,isAdmin,players,email,onClose,onLogout,onLeave,
         setRole,removeMember,renameGroup,openIdentity,migrate,say}=props;
  const [nome,setNome]=useState(group.name||"");
  const [mig,setMig]=useState(null);          // schermata migrazione
  const [busy,setBusy]=useState(false);
  const codice=packInvite(group.invite_code,cfg);
  const link=inviteLink(group.invite_code,cfg);
  const nameOf=pid=>{const p=players.find(x=>x.id===pid);return p?p.name:null;};

  const condividi=async()=>{
    const testo=`Entra in "${group.name}" su CialtronApp:\n${link}`;
    try{
      if(navigator.share){await navigator.share({title:"CialtronApp",text:testo});return;}
      await navigator.clipboard.writeText(testo);say("Invito copiato");
    }catch(e){
      try{await navigator.clipboard.writeText(codice);say("Codice copiato");}catch(e2){say("Copia a mano: "+group.invite_code);}
    }
  };

  if(mig)return <MigratePanel {...props} onClose={()=>setMig(null)} migrate={migrate}/>;

  return(
    <Panel title="ACCOUNT E GRUPPO" onClose={onClose}>
      <Sub>IL TUO ACCOUNT</Sub>
      <Line>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,color:C.text,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis"}}>{email}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>
            {me&&me.player_id?<>Sei <strong style={{color:C.accent}}>{nameOf(me.player_id)||"—"}</strong> nella rosa</>:"Non hai ancora detto chi sei"}
            {isAdmin&&<> · admin</>}
          </div>
        </div>
        <Btn onClick={openIdentity} variant="ghost" small>Cambia</Btn>
      </Line>
      <Btn onClick={onLogout} variant="ghost" full style={{marginTop:6}}>Esci dall'account</Btn>

      <Sub>INVITA I GIOCATORI</Sub>
      <div style={{fontSize:12,color:C.muted,marginBottom:10,lineHeight:1.6}}>
        Mandagli questo: si installano l'app, si fanno il loro account ed entrano nel gruppo senza configurare niente.
      </div>
      <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:8,textAlign:"center"}}>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:30,letterSpacing:6,color:C.accent}}>{group.invite_code}</div>
        <div style={{fontSize:10,color:C.muted,letterSpacing:1}}>CODICE DEL GRUPPO</div>
      </div>
      <Btn onClick={condividi} full>Condividi l'invito</Btn>

      <Sub>CHI C'È NEL GRUPPO ({members.length})</Sub>
      {members.map(m=>{
        const owner=m.user_id===group.owner;
        return(
          <Line key={m.user_id}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,color:C.text,fontWeight:700}}>{nameOf(m.player_id)||m.member_name||"(senza nome)"}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                {owner?"proprietario":m.role==="admin"?"admin":"giocatore"}
                {m.user_id===(me&&me.user_id)&&" · tu"}
                {!m.player_id&&" · non ha ancora detto chi è"}
              </div>
            </div>
            {isAdmin&&!owner&&(
              <>
                <Btn onClick={()=>setRole(m.user_id,m.role==="admin"?"player":"admin")} variant="ghost" small>
                  {m.role==="admin"?"↓ giocatore":"↑ admin"}
                </Btn>
                {m.user_id!==(me&&me.user_id)&&<Btn onClick={()=>removeMember(m.user_id)} variant="danger" small>✕</Btn>}
              </>
            )}
          </Line>
        );
      })}

      {isAdmin&&(
        <>
          <Sub>IL GRUPPO</Sub>
          <Input label="NOME DEL GRUPPO" value={nome} onChange={setNome}/>
          <Btn onClick={async()=>{setBusy(true);await renameGroup(nome.trim());setBusy(false);}} disabled={busy||!nome.trim()||nome.trim()===group.name} variant="dark" full>Salva il nome</Btn>
          <Btn onClick={()=>setMig(true)} variant="ghost" full style={{marginTop:8}}>Importa dal vecchio database Firebase</Btn>
        </>
      )}

      <Sub>ALTRO</Sub>
      <Btn onClick={onLeave} variant="danger" full>Esci da questo gruppo</Btn>
      <div style={{textAlign:"center",fontSize:10,color:"#3A3A3A",marginTop:20,letterSpacing:1}}>v{APP_VERSION}</div>
    </Panel>
  );
}

/* ═══════════════════════════════════════════════════════
   MIGRAZIONE — porta dentro rosa, partite e foto da Firebase
═══════════════════════════════════════════════════════ */
function MigratePanel({onClose,migrate,players}){
  const [url,setUrl]=useState(()=>localStorage.getItem("cia-db-url")||"");
  const [scan,setScan]=useState(null), [busy,setBusy]=useState(false), [err,setErr]=useState(""), [done,setDone]=useState(null);

  const guarda=async()=>{
    setBusy(true);setErr("");setScan(null);
    const u=url.trim().replace(/\/+$/,"");
    const [pl,mt,ph]=await Promise.all([fbFetch(u,"players"),fbFetch(u,"matches"),fbFetch(u,"photos")]);
    setBusy(false);
    if(!pl.ok){setErr("Non riesco a leggere quel database. Controlla l'indirizzo e che le regole permettano la lettura.");return;}
    const P=(Array.isArray(pl.data)?pl.data:[]).filter(Boolean);
    const M=(Array.isArray(mt.data)?mt.data:[]).filter(Boolean);
    const F=ph.data||{};
    const conFoto=P.filter(p=>F[p.id]||p.photo).length;
    if(!P.length&&!M.length){setErr("Quel database è vuoto: non c'è niente da importare.");return;}
    setScan({url:u,players:P,matches:M,photos:F,conFoto});
  };

  const vai=async()=>{
    setBusy(true);setErr("");
    try{ const r=await migrate(scan); setDone(r); }
    catch(e){ setErr(errText(e)); }
    setBusy(false);
  };

  if(done)return(
    <Panel title="IMPORTATO" onClose={onClose}>
      <div style={{textAlign:"center",padding:"20px 0"}}>
        <div style={{fontSize:44,marginBottom:12}}>✅</div>
        <div style={{fontSize:14,color:C.text,lineHeight:1.7}}>
          <strong style={{color:C.accent}}>{done.players}</strong> giocatori, <strong style={{color:C.accent}}>{done.matches}</strong> partite
          {done.photos>0&&<> e <strong style={{color:C.accent}}>{done.photos}</strong> foto</> } sono nel gruppo.
        </div>
      </div>
      <Btn onClick={onClose} full>Chiudi</Btn>
    </Panel>
  );

  return(
    <Panel title="IMPORTA DA FIREBASE" onClose={onClose}>
      <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>
        Legge rosa, partite e foto dal database che l'app usava prima e li porta dentro questo gruppo. Il vecchio database non viene toccato.
      </div>
      <Input label="INDIRIZZO DEL VECCHIO DATABASE" value={url} onChange={v=>{setUrl(v);setScan(null);setErr("");}} placeholder="https://xxx-default-rtdb.firebaseio.com"/>
      <Err>{err}</Err>
      {!scan
        ?<Btn onClick={guarda} disabled={busy||!url.trim()} full>{busy?"Leggo…":"Guarda cosa c'è dentro"}</Btn>
        :<>
          <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:14,marginBottom:12}}>
            <div style={{fontSize:13,color:C.text,lineHeight:1.8}}>
              Trovati <strong style={{color:C.accent}}>{scan.players.length}</strong> giocatori,
              {" "}<strong style={{color:C.accent}}>{scan.matches.length}</strong> partite,
              {" "}<strong style={{color:C.accent}}>{scan.conFoto}</strong> foto.
            </div>
            {players.length>0&&<div style={{fontSize:12,color:C.red,marginTop:8,lineHeight:1.5}}>Attenzione: la rosa di questo gruppo verrà sostituita da quella importata.</div>}
          </div>
          <Btn onClick={vai} disabled={busy} full>{busy?"Importo…":"Importa"}</Btn>
        </>
      }
      <Btn onClick={onClose} variant="ghost" full style={{marginTop:8}}>Annulla</Btn>
    </Panel>
  );
}

/* ═══════════════════════════════════════════════════════
   CLASSIFICA
═══════════════════════════════════════════════════════ */
/* Sotto i 460px le colonne fisse non lascerebbero spazio al nome:
   sul telefono le statistiche vanno su una riga sotto il nome. */
function useNarrow(bp=460){
  const [n,setN]=useState(()=>typeof window!=="undefined"&&window.innerWidth<bp);
  useEffect(()=>{
    const h=()=>setN(window.innerWidth<bp);
    window.addEventListener("resize",h); window.addEventListener("orientationchange",h);
    return()=>{window.removeEventListener("resize",h);window.removeEventListener("orientationchange",h);};
  },[bp]);
  return n;
}

const SHORT={presences:"P",wins:"V",goals:"GOL",mvps:"MVP"};

function StandingsSection({standings,isAdmin,updatePlayers}){
  const [editId,setEditId]=useState(null), [ev,setEv]=useState({}), [busy,setBusy]=useState(false);
  const narrow=useNarrow();
  const startEdit=p=>{setEditId(p.id);setEv({presences:p.stats.presences,wins:p.stats.wins,goals:p.stats.goals,mvps:p.stats.mvps});};
  const toAuto=p=>setEv({presences:p.stats.auto.presences,wins:p.stats.auto.wins,goals:p.stats.auto.goals,mvps:p.stats.auto.mvps});

  /* salva solo lo scarto rispetto al calcolo: i campi lasciati com'erano
     continuano ad aggiornarsi da soli con le partite successive */
  const saveEdit=async row=>{
    setBusy(true);
    const base=baseFromTotals(ev,row.stats.auto);
    await updatePlayers(list=>list.map(p=>p.id===row.id?{...p,base,overrides:null}:p));
    setBusy(false);setEditId(null);
  };

  const MEDALS=["🥇","🥈","🥉"];
  const cols="30px 1fr 38px 38px 38px 38px 54px"+(isAdmin?" 32px":"");
  const manual=standings.some(p=>FIELDS.some(f=>p.stats.base[f]!==0));
  const mark=f=><span title="valore corretto a mano" style={{fontSize:9,color:C.accent,verticalAlign:"super",marginLeft:1}}>✎</span>;
  const numInput=f=><input key={f} type="number" min="0" value={ev[f]} onChange={e=>setEv(v=>({...v,[f]:e.target.value}))}
    style={{width:"100%",background:C.card3,border:`1px solid ${C.accent}`,color:C.text,borderRadius:6,padding:"6px 3px",fontSize:13,textAlign:"center",fontFamily:"'DM Sans',sans-serif"}}/>;

  return(
    <div>
      <Banner title="CLASSIFICA" sub="3 punti per vittoria · media = punti ÷ presenze"/>
      {standings.length===0?<Empty emoji="🏆" text="Nessun giocatore. Aggiungili dalla sezione Rosa (admin)!"/>:(
        <>
          {!narrow&&(
            <div style={{display:"grid",gridTemplateColumns:cols,gap:4,padding:"0 10px 8px"}}>
              {["#","Giocatore","P","V","GOL","MVP","MEDIA",...(isAdmin?[""]:[])].map((h,i)=>(
                <div key={i} style={{fontSize:9,color:C.muted,fontWeight:700,letterSpacing:.8,textAlign:i===1?"left":"center"}}>{h}</div>
              ))}
            </div>
          )}
          {standings.map((p,i)=>{
            const isFirst=i===0, isLast=i===standings.length-1&&standings.length>1, isEd=editId===p.id, s=p.stats;
            const frame={background:isFirst?`${C.accent}0D`:isLast?`${C.red}0A`:C.card,border:`1px solid ${isFirst?C.accent+"35":isLast?C.red+"30":C.border}`,borderRadius:12,marginBottom:6,overflow:"hidden"};
            const pos=<div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:i<3?C.accent:C.muted,textAlign:"center",width:narrow?22:undefined,flexShrink:0}}>{MEDALS[i]||i+1}</div>;
            const avg=<div style={{textAlign:"center",flexShrink:0}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:isFirst?C.accent:C.text,lineHeight:1}}>{s.avg.toFixed(2)}</div>
                <div style={{fontSize:9,color:C.muted}}>media</div>
              </div>;
            const editBtn=isAdmin&&(isEd
              ?<Btn onClick={()=>saveEdit(p)} disabled={busy} small style={{padding:"5px 8px"}}>✓</Btn>
              :<button onClick={()=>startEdit(p)} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,color:C.muted,padding:4,flexShrink:0}}>✏️</button>);
            const tags=<div style={{display:"flex",gap:4,marginTop:2}}>{isFirst&&<Tag>CAP</Tag>}{isLast&&<Tag color={C.red}>PICK</Tag>}</div>;
            const name=<div style={{fontWeight:700,fontSize:14,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>;

            return(
              <div key={p.id} style={frame}>
                {narrow?(
                  /* ─── telefono: nome in alto, statistiche sotto ─── */
                  <div style={{display:"flex",alignItems:"center",gap:9,padding:"11px 10px"}}>
                    {pos}
                    <Avatar player={p} size={34}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0}}>
                        <div style={{minWidth:0,flex:1}}>{name}</div>
                        {(isFirst||isLast)&&tags}
                      </div>
                      <div style={{fontSize:11,color:C.muted,marginTop:3,display:"flex",gap:9}}>
                        {FIELDS.map(f=><span key={f}>{SHORT[f]} <strong style={{color:C.text}}>{s[f]}</strong>{s.base[f]!==0&&mark(f)}</span>)}
                      </div>
                    </div>
                    {avg}{editBtn}
                  </div>
                ):(
                  /* ─── schermo largo: tabella ─── */
                  <div style={{display:"grid",gridTemplateColumns:cols,gap:4,padding:"11px 10px",alignItems:"center"}}>
                    {pos}
                    <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                      <Avatar player={p} size={34}/>
                      <div style={{minWidth:0}}>{name}{tags}</div>
                    </div>
                    {isEd?FIELDS.map(f=>numInput(f)):FIELDS.map(f=>(
                      <div key={f} style={{textAlign:"center",fontWeight:700,fontSize:14,color:C.text}}>{s[f]}{s.base[f]!==0&&mark(f)}</div>
                    ))}
                    {avg}{editBtn}
                  </div>
                )}

                {isEd&&(
                  <div style={{borderTop:`1px solid ${C.border}`,padding:"10px"}}>
                    {narrow&&(
                      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
                        {FIELDS.map(f=>(
                          <div key={f}>
                            <div style={{fontSize:9,color:C.muted,fontWeight:700,letterSpacing:.8,textAlign:"center",marginBottom:4}}>{SHORT[f]}</div>
                            {numInput(f)}
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <div style={{fontSize:11,color:C.muted,flex:1,minWidth:150}}>Dalle partite: {s.auto.presences}·{s.auto.wins}·{s.auto.goals}·{s.auto.mvps}. Quello che cambi resta come correzione fissa, il resto continua ad aggiornarsi.</div>
                      <Btn onClick={()=>toAuto(p)} variant="ghost" small>↺ Ricalcola</Btn>
                      <Btn onClick={()=>setEditId(null)} variant="ghost" small>Annulla</Btn>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {manual&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:12}}>✎ = valore con una correzione manuale sopra il calcolo delle partite</div>}
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   PARTITE — flusso in 3 step
═══════════════════════════════════════════════════════ */
const STEPS=[{k:"teams",n:1,t:"SQUADRE",s:"Chi ha giocato e con chi"},
             {k:"winner",n:2,t:"VINCITORE",s:"Chi ha vinto la partita"},
             {k:"extra",n:3,t:"MVP E GOL",s:"Il migliore e i marcatori"}];

function StepBar({phase}){
  const cur=STEPS.find(s=>s.k===phase)||STEPS[0];
  return(
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        {STEPS.map(s=><div key={s.k} style={{flex:1,height:4,borderRadius:2,background:s.n<=cur.n?C.accent:C.card3,transition:"background .2s"}}/>)}
      </div>
      <div style={{display:"flex",alignItems:"baseline",gap:8}}>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:2,color:C.accent}}>STEP {cur.n}/3 — {cur.t}</span>
        <span style={{fontSize:11,color:C.muted}}>{cur.s}</span>
      </div>
    </div>
  );
}

function MatchSection({players,matches,isAdmin,saveMatches}){
  const [phase,setPhase]=useState("list"), [white,setWhite]=useState([]), [black,setBlack]=useState([]);
  const [winner,setWinner]=useState(""), [mvp,setMvp]=useState(""), [goals,setGoals]=useState({});
  const [busy,setBusy]=useState(false), [delId,setDelId]=useState(null);
  const getP=id=>players.find(p=>p.id===id);
  const assign=(id,team)=>{
    if(team==="white"){setWhite(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setBlack(p=>p.filter(x=>x!==id));}
    else{setBlack(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setWhite(p=>p.filter(x=>x!==id));}
  };
  const reset=()=>{setPhase("list");setWhite([]);setBlack([]);setWinner("");setMvp("");setGoals({});};
  const submit=async()=>{
    if(!winner||busy)return;
    setBusy(true);
    const g={};Object.entries(goals).forEach(([id,v])=>{if(+v>0)g[id]=+v;});
    const newMatch={id:uid(),date:new Date().toISOString(),white,black,winner,mvp:mvp||null,goals:g};
    await saveMatches([...(matches||[]),newMatch]);
    setBusy(false);reset();
  };
  const deleteMatch=async id=>{
    await saveMatches((matches||[]).filter(m=>m.id!==id));
    setDelId(null);
  };
  const all=[...white,...black];
  const back=to=><button onClick={()=>setPhase(to)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",marginBottom:14,fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>← Indietro</button>;

  const TeamCard=({t,ids,onClick,selected})=>(
    <div onClick={onClick} style={{flex:1,background:selected?C.accent+"12":C.card2,border:`2px solid ${selected?C.accent:C.border}`,borderRadius:12,padding:14,cursor:onClick?"pointer":"default",transition:"all .15s"}}>
      <div style={{fontWeight:800,fontSize:14,color:selected?C.accent:C.text,marginBottom:10}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"} {selected?"🏆":""}</div>
      {ids.length===0&&<div style={{fontSize:12,color:C.muted}}>Nessuno</div>}
      {ids.map(id=>{const p=getP(id);return p?<div key={id} style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}><Avatar player={p} size={24}/><span style={{fontSize:13,color:C.text}}>{p.name}</span></div>:null;})}
    </div>
  );

  return(
    <div>
      <Banner title="PARTITE" sub={isAdmin?"Registra i match per aggiornare la classifica":"Storico partite"}/>

      {phase==="list"&&(
        <>
          {isAdmin&&<Btn onClick={()=>setPhase("teams")} disabled={(players||[]).length<2} full style={{padding:"13px 0",fontSize:15,borderRadius:10,marginBottom:18}}>＋ Nuova partita</Btn>}
          {!matches||matches.length===0?<Empty emoji="⚽" text="Nessuna partita ancora."/>:
            [...(matches||[])].reverse().map(m=>(
              <div key={m.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {["white","black"].map(t=><span key={t} style={{padding:"3px 12px",borderRadius:6,fontSize:12,fontWeight:700,background:m.winner===t?C.accent+"22":C.card2,color:m.winner===t?C.accent:C.muted,border:`1px solid ${m.winner===t?C.accent+"50":C.border}`}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"} {m.winner===t?"🏆":""}</span>)}
                  </div>
                  {isAdmin&&<button onClick={()=>setDelId(m.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>✕</button>}
                </div>
                <div style={{display:"flex",gap:16}}>
                  {["white","black"].map(t=><div key={t} style={{flex:1}}><div style={{fontSize:10,color:C.muted,marginBottom:4}}>{t==="white"?"BIANCHI":"NERI"}</div>{(m[t]||[]).map(id=><div key={id} style={{fontSize:12,color:C.text,marginBottom:2}}>{getP(id)?.name||id}{m.goals?.[id]?<span style={{color:C.muted}}> · {m.goals[id]}⚽</span>:null}</div>)}</div>)}
                  {m.mvp&&<div><div style={{fontSize:10,color:C.muted,marginBottom:4}}>MVP</div><div style={{fontSize:12,color:C.accent}}>⭐ {getP(m.mvp)?.name}</div></div>}
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:8}}>{new Date(m.date).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"})}</div>
              </div>
            ))
          }
          {delId&&(
            <Modal onClose={()=>setDelId(null)}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:10}}>ELIMINARE LA PARTITA?</div>
              <div style={{fontSize:13,color:C.muted,marginBottom:18}}>Le statistiche dei giocatori coinvolti tornano indietro da sole: sono calcolate dalle partite.</div>
              <div style={{display:"flex",gap:8}}>
                <Btn onClick={()=>setDelId(null)} variant="ghost" style={{flex:1}}>Annulla</Btn>
                <Btn onClick={()=>deleteMatch(delId)} variant="danger" style={{flex:1}}>Elimina</Btn>
              </div>
            </Modal>
          )}
        </>
      )}

      {phase==="teams"&&(
        <>
          <StepBar phase={phase}/>
          <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Assegna ogni giocatore a una squadra · <strong style={{color:C.text}}>{white.length}</strong> vs <strong style={{color:C.text}}>{black.length}</strong></div>
          {(players||[]).map(p=>{
            const iW=white.includes(p.id),iB=black.includes(p.id);
            return(
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${iW||iB?C.accent+"35":C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                <Avatar player={p} size={36}/><span style={{flex:1,fontWeight:600,fontSize:14,color:C.text}}>{p.name}</span>
                <div style={{display:"flex",gap:6}}>
                  {["white","black"].map(t=>{const active=t==="white"?iW:iB;return<button key={t} onClick={()=>assign(p.id,t)} style={{padding:"6px 14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif",border:`2px solid ${active?C.accent:C.border}`,background:active?(t==="white"?"#ffffff18":"#33333344"):C.card2,color:active?C.accent:C.muted,transition:"all .15s"}}>{t==="white"?"⬜":"⬛"}</button>;})}
                </div>
              </div>
            );
          })}
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <Btn onClick={reset} variant="ghost" style={{flex:1}}>Annulla</Btn>
            <Btn onClick={()=>setPhase("winner")} disabled={!white.length||!black.length} style={{flex:2}}>Avanti →</Btn>
          </div>
        </>
      )}

      {phase==="winner"&&(
        <>
          <StepBar phase={phase}/>
          {back("teams")}
          <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Tocca la squadra che ha vinto</div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            {["white","black"].map(t=><TeamCard key={t} t={t} ids={t==="white"?white:black} selected={winner===t} onClick={()=>setWinner(t)}/>)}
          </div>
          <Btn onClick={()=>setPhase("extra")} disabled={!winner} full style={{padding:"14px 0",fontSize:15,borderRadius:10}}>Avanti →</Btn>
        </>
      )}

      {phase==="extra"&&(
        <>
          <StepBar phase={phase}/>
          {back("winner")}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:12}}>
            <div style={{fontWeight:700,marginBottom:10,color:C.text,fontSize:14}}>⭐ MVP (opzionale)</div>
            <select value={mvp} onChange={e=>setMvp(e.target.value)} style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:"9px 12px",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>
              <option value="">— Nessun MVP —</option>
              {all.map(id=>{const p=getP(id);return p?<option key={id} value={id}>{p.name}</option>:null;})}
            </select>
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{fontWeight:700,marginBottom:12,color:C.text,fontSize:14}}>⚽ Gol segnati (opzionale)</div>
            {all.map(id=>{const p=getP(id);return p?(
              <div key={id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <Avatar player={p} size={28}/>
                <span style={{flex:1,fontSize:13,color:C.text}}>{p.name}</span>
                <span style={{fontSize:11,color:C.muted}}>{white.includes(id)?"⬜":"⬛"}</span>
                <input type="number" min="0" max="20" placeholder="0" value={goals[id]||""} onChange={e=>setGoals(g=>({...g,[id]:e.target.value}))} style={{width:52,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:6,padding:"6px 8px",fontSize:14,textAlign:"center",fontFamily:"'DM Sans',sans-serif"}}/>
              </div>):null;})}
          </div>
          <Btn onClick={submit} disabled={!winner||busy} full style={{padding:"14px 0",fontSize:15,borderRadius:10}}>{busy?"Salvo…":"Salva partita ✓"}</Btn>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   SELEZIONE SQUADRE — in tempo reale, ognuno al suo turno
═══════════════════════════════════════════════════════ */
function TeamsSection({standings,teamSel,setSel,myPlayerId,isAdmin}){
  const hasCap=standings.length>=2;
  const captain=hasCap?standings[0]:null;
  const picker=hasCap?standings[standings.length-1]:null;
  const others=hasCap?standings.filter(p=>p.id!==captain.id&&p.id!==picker.id):[];

  const phase=teamSel?.phase||"idle";
  const assign=teamSel?.assign||{};
  const captainSide=teamSel?.captainSide||null;

  /* Con gli account si sa chi sta guardando: tocca al picker formare le squadre
     e al capitano scegliere il lato. L'admin può sempre sbloccare la situazione
     (qualcuno ha il telefono scarico, non è ancora entrato…). */
  const ioPicker=!!picker&&(myPlayerId===picker.id||isAdmin);
  const ioCapitano=!!captain&&(myPlayerId===captain.id||isAdmin);
  const canSend=standings.length<=2||others.every(p=>assign[p.id]==="white"||assign[p.id]==="black");

  const toggleAssign=(id,side)=>setSel({assign:{...assign,[id]:assign[id]===side?null:side}});
  const startPicking=()=>setSel({phase:"picking",assign:{},captainSide:null,finalWhite:null,finalBlack:null});
  const sendProposal=()=>setSel({phase:"captain"});
  const captainPick=side=>{
    const wBase=side==="white"?[captain]:[picker];
    const bBase=side==="black"?[captain]:[picker];
    setSel({phase:"done",captainSide:side,
      finalWhite:[...wBase,...others.filter(p=>assign[p.id]==="white")].map(p=>p.id),
      finalBlack:[...bBase,...others.filter(p=>assign[p.id]==="black")].map(p=>p.id)});
  };
  const reset=()=>setSel({phase:"idle",assign:{},captainSide:null,finalWhite:null,finalBlack:null});
  const getById=id=>standings.find(p=>p.id===id);

  const Attesa=({chi,cosa,colore})=>(
    <div style={{background:colore+"12",border:`1px solid ${colore}30`,borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
      <Avatar player={chi} size={32}/>
      <div style={{fontSize:13,color:C.text,lineHeight:1.5}}>
        <strong style={{color:colore}}>{chi.name}</strong> {cosa}
        <div style={{fontSize:11,color:C.muted}}>Lo vedi aggiornarsi qui, in diretta</div>
      </div>
    </div>
  );

  return(
    <div>
      <Banner title="SELEZIONE SQUADRE" sub="Aggiornamento in tempo reale per tutti"/>
      {!hasCap?<Empty emoji="🛡️" text="Servono almeno 2 giocatori in classifica."/>:

      phase==="idle"?(
        <>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
            {[{player:captain,role:"🏆 CAPITANO",desc:"Sceglie la squadra",color:C.accent},
              {player:picker,role:"🛡️ PICKER",desc:"Decide le squadre",color:C.red}].map(({player,role,desc,color})=>(
              <div key={player.id} style={{background:color+"0D",border:`1px solid ${color}25`,borderRadius:14,padding:16,textAlign:"center"}}>
                <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:10}}>{role}</div>
                <Avatar player={player} size={56}/>
                <div style={{fontWeight:800,color,marginTop:10,fontSize:15}}>{player.name}{myPlayerId===player.id?" (tu)":""}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:4}}>{desc}</div>
                <div style={{fontSize:11,color:C.muted}}>Media: {player.stats?.avg?.toFixed(2)||"0.00"}</div>
              </div>
            ))}
          </div>
          {ioPicker
            ?<Btn onClick={startPicking} full style={{padding:"14px 0",fontSize:15,borderRadius:10}}>Forma le squadre →</Btn>
            :<div style={{textAlign:"center",fontSize:13,color:C.muted,lineHeight:1.6,padding:"6px 10px"}}>
               Tocca a <strong style={{color:C.red}}>{picker.name}</strong> far partire la selezione.<br/>
               <span style={{fontSize:11}}>Quando lo fa, lo vedi comparire qui da solo.</span>
             </div>}
        </>
      ):

      phase==="picking"?(
        <>
          {!ioPicker&&<Attesa chi={picker} cosa="sta formando le squadre…" colore={C.red}/>}
          {ioPicker&&<div style={{fontSize:12,color:C.muted,marginBottom:14}}>Assegna gli altri giocatori. Capitano e picker si dividono dopo, quando il capitano sceglie il lato.</div>}
          {[captain,picker].map((fixed,fi)=>(
            <div key={fixed.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,opacity:.5}}>
              <Avatar player={fixed} size={34}/><span style={{flex:1,fontWeight:600,fontSize:14,color:C.text}}>{fixed.name}</span>
              <Tag color={fi===0?C.accent:C.red}>{fi===0?"CAPITANO":"PICKER"}</Tag>
            </div>
          ))}
          {others.length>0&&<div style={{height:1,background:C.border,margin:"14px 0 12px"}}/>}
          {others.map(p=>{
            const side=assign[p.id];
            return(
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                <Avatar player={p} size={34}/><span style={{flex:1,fontWeight:600,fontSize:14,color:C.text}}>{p.name}</span>
                <div style={{display:"flex",gap:6}}>
                  {["white","black"].map(t=>(
                    <button key={t} disabled={!ioPicker} onClick={()=>ioPicker&&toggleAssign(p.id,t)}
                      style={{padding:"6px 14px",borderRadius:6,cursor:ioPicker?"pointer":"default",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif",border:`2px solid ${side===t?C.accent:C.border}`,background:side===t?(t==="white"?"#ffffff18":"#33333344"):C.card2,color:side===t?C.accent:C.muted,opacity:ioPicker||side===t?1:.45,transition:"all .15s"}}>
                      {t==="white"?"⬜":"⬛"}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
          {ioPicker&&(
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <Btn onClick={reset} variant="ghost" style={{flex:1}}>Annulla</Btn>
              <Btn onClick={sendProposal} disabled={!canSend} style={{flex:2}}>Invia a {captain.name} →</Btn>
            </div>
          )}
        </>
      ):

      phase==="captain"?(
        <>
          {ioCapitano
            ?<div style={{background:C.accent+"15",border:`1px solid ${C.accent}30`,borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:13,color:C.text,lineHeight:1.5}}>
               <strong style={{color:C.accent}}>Tocca a te</strong>: scegli con quale squadra giocare.
               <div style={{fontSize:11,color:C.muted}}>Proposta di {picker.name}</div>
             </div>
            :<Attesa chi={captain} cosa="sta scegliendo la squadra…" colore={C.accent}/>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {["white","black"].map(t=>{
              const teamOthers=others.filter(p=>assign[p.id]===t);
              return(
                <div key={t} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
                  <div style={{fontWeight:800,marginBottom:10,fontSize:14,color:C.text}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"}</div>
                  {teamOthers.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Avatar player={p} size={22}/><span style={{fontSize:12,color:C.text}}>{p.name}</span></div>)}
                  <div style={{borderTop:`1px solid ${C.border}`,marginTop:8,paddingTop:8}}>
                    <div style={{fontSize:11,color:C.accent,fontStyle:"italic"}}>+ {captain.name}</div>
                    <div style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>— {picker.name} dall'altra parte</div>
                  </div>
                </div>
              );
            })}
          </div>
          {ioCapitano&&(
            <div style={{display:"flex",gap:8}}>
              {["white","black"].map(t=>(
                <button key={t} onClick={()=>captainPick(t)} style={{flex:1,padding:"14px 0",border:`2px solid ${C.border}`,background:C.card2,borderRadius:10,cursor:"pointer",color:C.text,fontWeight:800,fontSize:15,fontFamily:"'DM Sans',sans-serif"}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"}</button>
              ))}
            </div>
          )}
        </>
      ):

      phase==="done"?(
        <>
          <div style={{textAlign:"center",marginBottom:22}}>
            <div style={{fontSize:40,marginBottom:8}}>🎉</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:C.accent,letterSpacing:3}}>SQUADRE PRONTE!</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[{side:"white",ids:teamSel.finalWhite||[],label:"⬜ BIANCHI"},{side:"black",ids:teamSel.finalBlack||[],label:"⬛ NERI"}].map(({side,ids,label})=>(
              <div key={side} style={{background:captainSide===side?C.accent+"12":C.card2,border:`2px solid ${captainSide===side?C.accent:C.border}`,borderRadius:14,padding:14}}>
                <div style={{fontWeight:800,marginBottom:12,fontSize:14,color:captainSide===side?C.accent:C.text}}>{label}</div>
                {ids.map(id=>{const p=getById(id);return p?(
                  <div key={id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <Avatar player={p} size={30}/>
                    <span style={{fontSize:13,color:myPlayerId===id?C.accent:C.text,fontWeight:p.id===captain.id||myPlayerId===id?800:400}}>{p.name}{p.id===captain.id?" ★":""}</span>
                  </div>):null;})}
              </div>
            ))}
          </div>
          {(ioPicker||ioCapitano)&&<Btn onClick={reset} variant="ghost" full>Nuova selezione</Btn>}
        </>
      ):null}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROSA (solo admin può modificare) + IMPORT EXCEL
═══════════════════════════════════════════════════════ */
function PlayersSection({players,matches,isAdmin,myPlayerId,updatePlayers,setPhoto,removePlayer}){
  /* ognuno cura la propria scheda: foto e nome del giocatore che ha dichiarato
     di essere; il resto della rosa resta agli admin */
  const canEdit=p=>isAdmin||p.id===myPlayerId;
  const [showAdd,setShowAdd]=useState(false), [newName,setNewName]=useState(""), [newPhoto,setNewPhoto]=useState(null);
  const [editId,setEditId]=useState(null), [editName,setEditName]=useState("");
  const [busy,setBusy]=useState(false), [delP,setDelP]=useState(null);
  const [imp,setImp]=useState(null), [impErr,setImpErr]=useState("");
  const newPhotoRef=useRef(null), xlsRef=useRef(null);

  const submitAdd=async()=>{
    if(!newName.trim()||busy)return;
    setBusy(true);
    const id=uid();
    await updatePlayers(list=>[...list,{id,name:newName.trim(),base:null,photoRev:null}]);
    if(newPhoto) await setPhoto(id,newPhoto);
    setNewName("");setNewPhoto(null);setShowAdd(false);setBusy(false);
  };
  const rename=async(id,name)=>{
    if(!name.trim())return setEditId(null);
    await updatePlayers(list=>list.map(p=>p.id===id?{...p,name:name.trim()}:p));
    setEditId(null);
  };

  /* ─── import Excel: Nome · Presenze · Vittorie · Gol · MVP ─── */
  const readFile=async file=>{
    setImpErr("");
    if(typeof XLSX==="undefined"){setImpErr("Libreria Excel non caricata: controlla la connessione e ricarica.");return;}
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const parsed=[]; let skipped=0;
      for(const row of rows){
        const f=readRow(row);
        const name=String(f.name??"").trim();
        if(!name){skipped++;continue;}
        if(parsed.some(r=>norm(r.name)===norm(name))){skipped++;continue;}
        parsed.push({name,
          presences:Math.max(0,Math.round(+f.presences||0)),
          wins:Math.max(0,Math.round(+f.wins||0)),
          goals:Math.max(0,Math.round(+f.goals||0)),
          mvps:Math.max(0,Math.round(+f.mvps||0)),
          exists:(players||[]).some(p=>norm(p.name)===norm(name))});
      }
      if(!parsed.length){setImpErr("Nessuna riga valida. Serve una colonna 'Nome' (poi Presenze, Vittorie, Gol, MVP).");return;}
      setImp({rows:parsed,skipped,sheet:wb.SheetNames[0]});
    }catch(e){setImpErr("File non leggibile: "+e.message);}
  };
  const applyImport=async()=>{
    setBusy(true);
    await updatePlayers(list=>{
      const out=list.map(p=>({...p}));
      for(const r of imp.rows){
        const totals={presences:r.presences,wins:r.wins,goals:r.goals,mvps:r.mvps};
        const i=out.findIndex(p=>norm(p.name)===norm(r.name));
        if(i>=0){ out[i].base=baseFromTotals(totals,computeStats(out[i],matches).auto); out[i].overrides=null; }
        else out.push({id:uid(),name:r.name,base:baseFromTotals(totals,ZERO),photoRev:null});
      }
      return out;
    });
    setBusy(false);setImp(null);
  };

  return(
    <div>
      <Banner title="ROSA" sub={isAdmin?"Gestisci l'anagrafica dei giocatori":myPlayerId?"La tua scheda la modifichi tu":"Anagrafica giocatori"}/>
      {isAdmin&&(
        <>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <Btn onClick={()=>setShowAdd(s=>!s)} style={{flex:2,padding:"12px 0",borderRadius:10}}>{showAdd?"✕ Annulla":"＋ Aggiungi giocatore"}</Btn>
            <Btn onClick={()=>xlsRef.current?.click()} variant="dark" style={{flex:1,padding:"12px 0",borderRadius:10}}>📊 Excel</Btn>
          </div>
          <input type="file" accept=".xlsx,.xls,.csv" ref={xlsRef} style={{display:"none"}}
            onChange={e=>{const f=e.target.files[0];e.target.value="";if(f)readFile(f);}}/>
          {impErr&&<div style={{background:C.red+"15",border:`1px solid ${C.red}40`,borderRadius:10,padding:12,marginBottom:12,fontSize:13,color:C.red}}>{impErr}</div>}
          {showAdd&&(
            <div style={{background:C.card,border:`1px solid ${C.accent}35`,borderRadius:14,padding:18,marginBottom:16}}>
              <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:14}}>
                <div onClick={()=>newPhotoRef.current?.click()} style={{width:64,height:64,borderRadius:"50%",background:C.card2,border:`2px dashed ${C.accent}`,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
                  {newPhoto?<img src={newPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:24}}>📷</span>}
                </div>
                <input type="file" accept="image/*" ref={newPhotoRef} style={{display:"none"}} onChange={async e=>{const f=e.target.files[0];if(f){const b=await resizePhoto(f);setNewPhoto(b);}}}/>
                <input placeholder="Nome giocatore…" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submitAdd()} style={{flex:1,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:"10px 14px",fontSize:14,fontFamily:"'DM Sans',sans-serif"}}/>
              </div>
              <Btn onClick={submitAdd} disabled={busy} full style={{padding:"10px 0"}}>{busy?"Aggiungo…":"Aggiungi"}</Btn>
            </div>
          )}
        </>
      )}

      {!players||players.length===0?<Empty emoji="👥" text={isAdmin?"Nessun giocatore. Aggiungine uno!":"Nessun giocatore ancora."}/>:
        (players||[]).map(p=>{
          const s=computeStats(p,matches), isEd=editId===p.id;
          return(
            <div key={p.id} style={{background:C.card,border:`1px solid ${p.id===myPlayerId?C.accent+"40":C.border}`,borderRadius:14,padding:16,marginBottom:10}}>
              <div style={{display:"flex",gap:14,alignItems:"center"}}>
                <div style={{position:"relative",flexShrink:0}}>
                  {canEdit(p)?(
                    <>
                      <label htmlFor={`ph-${p.id}`} style={{cursor:"pointer",display:"block"}}>
                        <Avatar player={p} size={58}/>
                        <div style={{position:"absolute",bottom:-2,right:-2,background:C.accent,borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>📷</div>
                      </label>
                      <input id={`ph-${p.id}`} type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{const f=e.target.files[0];e.target.value="";if(f)await setPhoto(p.id,f);}}/>
                    </>
                  ):<Avatar player={p} size={58}/>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  {canEdit(p)&&isEd
                    ?<input value={editName} onChange={e=>setEditName(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&rename(p.id,editName)} style={{width:"100%",background:C.card2,border:`1px solid ${C.accent}`,color:C.text,borderRadius:6,padding:"7px 10px",fontSize:15,fontFamily:"'DM Sans',sans-serif",fontWeight:700}}/>
                    :<div style={{fontWeight:800,fontSize:16,color:C.text}}>{p.name}{p.id===myPlayerId&&<span style={{fontSize:10,color:C.accent,fontWeight:800,marginLeft:6,letterSpacing:1}}>SEI TU</span>}</div>
                  }
                  <div style={{fontSize:12,color:C.muted,marginTop:3}}>Media: <span style={{color:C.accent,fontWeight:700}}>{s.avg.toFixed(2)}</span> · {s.presences} presenze</div>
                </div>
                {canEdit(p)&&(
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    {isEd?<Btn onClick={()=>rename(p.id,editName)} small>✓</Btn>
                      :<button onClick={()=>{setEditId(p.id);setEditName(p.name);}} style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>}
                    {isAdmin&&<button onClick={()=>setDelP(p)} style={{background:"none",border:`1px solid ${C.red}30`,color:C.red,borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:14}}>🗑️</button>}
                  </div>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",marginTop:16,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
                {[{l:"PRESENZE",v:s.presences,f:"presences"},{l:"VINTE",v:s.wins,f:"wins"},{l:"GOL",v:s.goals,f:"goals"},{l:"MVP",v:s.mvps,f:"mvps"},{l:"MEDIA",v:s.avg.toFixed(2),f:null}].map((st,i)=>(
                  <div key={i} style={{textAlign:"center",borderRight:i<4?`1px solid ${C.border}`:"none"}}>
                    <div style={{fontWeight:800,fontSize:20,color:i===4?C.accent:C.text}}>{st.v}{st.f&&s.base[st.f]!==0&&<span style={{fontSize:9,color:C.accent,verticalAlign:"super"}}>✎</span>}</div>
                    <div style={{fontSize:9,color:C.muted,letterSpacing:.6,marginTop:2}}>{st.l}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })
      }

      {delP&&(
        <Modal onClose={()=>setDelP(null)}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:10}}>ELIMINARE {delP.name.toUpperCase()}?</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:18}}>Sparisce dalla rosa e dalla classifica. Le partite già registrate restano, ma non mostreranno più il suo nome.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setDelP(null)} variant="ghost" style={{flex:1}}>Annulla</Btn>
            <Btn onClick={async()=>{setBusy(true);await removePlayer(delP.id);setBusy(false);setDelP(null);}} variant="danger" style={{flex:1}}>Elimina</Btn>
          </div>
        </Modal>
      )}

      {imp&&(
        <Modal onClose={()=>setImp(null)}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:4}}>IMPORT EXCEL</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:14}}>
            Foglio "{imp.sheet}" · <strong style={{color:C.accent}}>{imp.rows.filter(r=>!r.exists).length}</strong> nuovi,
            {" "}<strong style={{color:C.text}}>{imp.rows.filter(r=>r.exists).length}</strong> da aggiornare
            {imp.skipped>0&&<> · {imp.skipped} righe ignorate</>}
          </div>
          <div style={{maxHeight:230,overflowY:"auto",marginBottom:14,border:`1px solid ${C.border}`,borderRadius:8}}>
            {imp.rows.map((r,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderBottom:i<imp.rows.length-1?`1px solid ${C.border}`:"none"}}>
                <span style={{flex:1,fontSize:13,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
                <span style={{fontSize:11,color:C.muted}}>{r.presences}·{r.wins}·{r.goals}·{r.mvps}</span>
                {!r.exists&&<Tag>NUOVO</Tag>}
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:C.muted,marginBottom:14}}>I numeri importati diventano la base di partenza: le partite registrate nell'app si sommano a questi valori.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setImp(null)} variant="ghost" style={{flex:1}}>Annulla</Btn>
            <Btn onClick={applyImport} disabled={busy} style={{flex:1}}>{busy?"Importo…":"Importa"}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════ */
const NAV=[
  {id:"standings",icon:"🏆",label:"CLASSIFICA"},
  {id:"match",icon:"⚽",label:"PARTITE"},
  {id:"teams",icon:"🛡️",label:"SQUADRE"},
  {id:"players",icon:"👥",label:"ROSA"},
];
const nowIso=()=>new Date().toISOString();

/* Se l'app è stata aperta da un link d'invito, il codice sta nel cancelletto. */
function inviteFromUrl(){
  const m=(location.hash||"").match(/[#&]join=([^&]+)/);
  if(!m)return null;
  try{return decodeURIComponent(m[1]);}catch(e){return m[1];}
}

function CialtronApp(){
  const [cfg,setCfg]=useState(loadCfg);
  const [sb,setSb]=useState(()=>makeClient(loadCfg()));
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(true);
  const [groups,setGroups]=useState([]);
  const [groupId,setGroupId]=useState(()=>localStorage.getItem(GROUP_KEY)||null);
  const [group,setGroup]=useState(null);
  const [members,setMembers]=useState([]);
  const [teamSel,setTeamSel]=useState(null);
  const [photoCache,setPhotoCache]=useState({});
  const [tab,setTab]=useState("standings");
  const [panel,setPanel]=useState(null);
  const [toast,setToast]=useState("");
  const [live,setLive]=useState(false);
  const [invite,setInvite]=useState(inviteFromUrl);
  const update=useUpdateCheck();

  const uid=session?session.user.id:null;
  const email=session?session.user.email:"";
  const groupRef=useRef(null); groupRef.current=group;
  const selRef=useRef(null);   selRef.current=teamSel;
  const say=useCallback(m=>{setToast(m);setTimeout(()=>setToast(t=>t===m?"":t),2600);},[]);

  useEffect(()=>{const s=document.getElementById("splash");if(s)s.style.display="none";},[]);

  /* ─── sessione ─── */
  useEffect(()=>{
    if(!sb){setBooting(false);return;}
    let dead=false;
    sb.auth.getSession().then(({data})=>{
      if(dead)return;
      setSession(data.session||null);setBooting(false);
    }).catch(()=>setBooting(false));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>{setSession(s||null);setBooting(false);});
    return()=>{dead=true;try{sub.subscription.unsubscribe();}catch(e){}};
  },[sb]);

  /* ─── i miei gruppi (+ invito in sospeso) ─── */
  const loadGroups=useCallback(async()=>{
    if(!sb||!uid)return[];
    const{data,error}=await sb.from('groups').select('*').order('created_at');
    if(error){say(errText(error));return[];}
    setGroups(data||[]);
    return data||[];
  },[sb,uid,say]);

  useEffect(()=>{
    if(!sb||!uid)return;
    let dead=false;
    (async()=>{
      let list=await loadGroups();
      if(dead)return;
      if(invite){
        const{code}=unpackInvite(invite);
        const{data,error}=await sb.rpc('join_group',{p_code:code});
        if(dead)return;
        setInvite(null);
        try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
        if(error)say(/codice non valido/i.test(error.message)?"Codice invito non valido":errText(error));
        else{list=await loadGroups();setGroupId(data);say("Sei dentro il gruppo");return;}
      }
      const saved=localStorage.getItem(GROUP_KEY);
      if(saved&&list.some(g=>g.id===saved))setGroupId(saved);
      else if(list.length===1)setGroupId(list[0].id);
      else if(saved)setGroupId(null);
    })();
    return()=>{dead=true;};
  },[sb,uid,invite,loadGroups,say]);

  useEffect(()=>{
    if(groupId)localStorage.setItem(GROUP_KEY,groupId);else localStorage.removeItem(GROUP_KEY);
  },[groupId]);

  /* ─── il gruppo scelto ─── */
  const loadGroup=useCallback(async()=>{
    if(!sb||!groupId)return;
    const[g,m,s]=await Promise.all([
      sb.from('groups').select('*').eq('id',groupId).maybeSingle(),
      sb.from('group_members').select('*').eq('group_id',groupId),
      sb.from('selections').select('*').eq('group_id',groupId).maybeSingle(),
    ]);
    if(g.error||!g.data){setGroup(null);setGroupId(null);return;}
    setGroup(g.data);
    setMembers(m.data||[]);
    if(s.data)setTeamSel(s.data.state||{phase:"idle",assign:{}});
    else{
      const{data:ins}=await sb.from('selections').insert({group_id:groupId}).select().maybeSingle();
      setTeamSel((ins&&ins.state)||{phase:"idle",assign:{}});
    }
  },[sb,groupId]);

  useEffect(()=>{
    if(!sb||!groupId||!uid)return;
    setPhotoCache(readPhotoCache(groupId));
    loadGroup();
    const ch=sb.channel('grp-'+groupId)
      .on('postgres_changes',{event:'*',schema:'public',table:'groups',filter:'id=eq.'+groupId},
          p=>{if(p.new&&p.new.id)setGroup(g=>Object.assign({},g,p.new));})
      .on('postgres_changes',{event:'*',schema:'public',table:'selections',filter:'group_id=eq.'+groupId},
          p=>{if(p.new&&p.new.state)setTeamSel(p.new.state);})
      .on('postgres_changes',{event:'*',schema:'public',table:'group_members',filter:'group_id=eq.'+groupId},
          ()=>{sb.from('group_members').select('*').eq('group_id',groupId).then(({data})=>setMembers(data||[]));})
      .subscribe(st=>setLive(st==="SUBSCRIBED"));
    /* Rete di sicurezza: se il tempo reale non è attivo sul progetto, o cade,
       si continua comunque a vedere le novità — solo un po' più tardi. */
    const poll=setInterval(loadGroup,20000);
    const onVis=()=>{if(document.visibilityState==="visible")loadGroup();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(poll);document.removeEventListener("visibilitychange",onVis);try{sb.removeChannel(ch);}catch(e){}};
  },[sb,groupId,uid,loadGroup]);

  /* ─── dati derivati ─── */
  const data=(group&&group.data)||{};
  const players=useMemo(()=>Array.isArray(data.players)?data.players.filter(Boolean):[],[data.players]);
  const matches=useMemo(()=>Array.isArray(data.matches)?data.matches.filter(Boolean):[],[data.matches]);
  const playersRef=useRef([]); playersRef.current=players;
  const me=useMemo(()=>members.find(m=>m.user_id===uid)||null,[members,uid]);
  const isAdmin=!!(me&&me.role==="admin")||!!(group&&group.owner===uid);
  const myPlayerId=(me&&me.player_id)||null;
  const playersView=useMemo(()=>players.map(p=>({...p,photo:photoCache[p.id]||null})),[players,photoCache]);
  const standings=useMemo(()=>
    playersView.map(p=>({...p,stats:computeStats(p,matches)}))
      .sort((a,b)=>b.stats.avg-a.stats.avg||b.stats.points-a.stats.points),
    [playersView,matches]);

  /* ─── scritture ─── */
  const writeData=useCallback(async patch=>{
    const cur=(groupRef.current&&groupRef.current.data)||{};
    const next=Object.assign({players:[],matches:[]},cur,patch);
    setGroup(g=>Object.assign({},g,{data:next}));
    const{error}=await sb.from('groups').update({data:next,updated_at:nowIso(),updated_by:uid}).eq('id',groupId);
    if(error){say(errText(error));loadGroup();return false;}
    return true;
  },[sb,groupId,uid,say,loadGroup]);

  const updatePlayers=useCallback(fn=>writeData({players:fn(playersRef.current.map(p=>({...p})))}),[writeData]);
  const saveMatches=useCallback(next=>writeData({matches:next}),[writeData]);

  const setSel=useCallback(async patch=>{
    const next=Object.assign({},selRef.current||{phase:"idle",assign:{}},patch);
    setTeamSel(next);
    const{error}=await sb.from('selections').upsert({group_id:groupId,state:next,updated_at:nowIso(),updated_by:uid});
    if(error)say(errText(error));
  },[sb,groupId,uid,say]);

  /* ─── foto: tabella a parte, scaricate solo quando cambia il rev ─── */
  const syncPhotos=useCallback(async()=>{
    if(!sb||!groupId)return;
    const{data:revs}=await sb.from('photos').select('player_id,rev').eq('group_id',groupId);
    for(const r of revs||[]){
      if(localStorage.getItem(PH_REV(groupId,r.player_id))===String(r.rev))continue;
      const{data:one}=await sb.from('photos').select('photo').eq('group_id',groupId).eq('player_id',r.player_id).maybeSingle();
      const b64=(one&&one.photo)||null;
      writePhotoCache(groupId,r.player_id,b64,r.rev);
      setPhotoCache(c=>Object.assign({},c,{[r.player_id]:b64||undefined}));
    }
  },[sb,groupId]);

  useEffect(()=>{
    if(!sb||!groupId)return;
    syncPhotos();
    const t=setInterval(syncPhotos,30000);
    return()=>clearInterval(t);
  },[sb,groupId,syncPhotos,players.length]);

  const setPhoto=useCallback(async(playerId,src)=>{
    const b64=!src?null:(typeof src==="string"?src:await resizePhoto(src));
    if(src&&!b64){say("Foto non caricata");return false;}
    const rev=Date.now();
    const{error}=await sb.from('photos').upsert({group_id:groupId,player_id:playerId,photo:b64,rev,updated_at:nowIso()});
    if(error){say(errText(error));return false;}
    writePhotoCache(groupId,playerId,b64,rev);
    setPhotoCache(c=>Object.assign({},c,{[playerId]:b64||undefined}));
    return true;
  },[sb,groupId,say]);

  const removePlayer=useCallback(async id=>{
    try{await sb.from('photos').delete().eq('group_id',groupId).eq('player_id',id);}catch(e){}
    dropPhotoCache(groupId,id);
    setPhotoCache(c=>{const n=Object.assign({},c);delete n[id];return n;});
    return updatePlayers(list=>list.filter(p=>p.id!==id));
  },[sb,groupId,updatePlayers]);

  /* ─── account e gruppo ─── */
  const claimPlayer=async pid=>{
    const p=playersRef.current.find(x=>x.id===pid);
    const{error}=await sb.from('group_members').update({player_id:pid,member_name:p?p.name:null}).eq('group_id',groupId).eq('user_id',uid);
    if(error)throw error;
    setMembers(ms=>ms.map(m=>m.user_id===uid?Object.assign({},m,{player_id:pid,member_name:p?p.name:null}):m));
    setPanel(null);say("Bentrovato"+(p?", "+p.name:""));
  };
  const claimNew=async name=>{
    const{error}=await sb.rpc('claim_new_player',{p_group:groupId,p_name:name});
    if(error)throw new Error(/esiste già/i.test(error.message)?"C'è già un giocatore con questo nome: scegli quello dalla lista":errText(error));
    await loadGroup();setPanel(null);say("Bentrovato, "+name);
  };
  const setRole=async(userId,role)=>{
    const{error}=await sb.from('group_members').update({role}).eq('group_id',groupId).eq('user_id',userId);
    if(error){say(errText(error));return;}
    setMembers(ms=>ms.map(m=>m.user_id===userId?Object.assign({},m,{role}):m));
    say(role==="admin"?"Ora è admin":"Ora è un giocatore");
  };
  const removeMember=async userId=>{
    const{error}=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',userId);
    if(error){say(errText(error));return;}
    setMembers(ms=>ms.filter(m=>m.user_id!==userId));say("Rimosso dal gruppo");
  };
  const renameGroup=async name=>{
    const{error}=await sb.from('groups').update({name}).eq('id',groupId);
    if(error){say(errText(error));return;}
    setGroup(g=>Object.assign({},g,{name}));say("Nome aggiornato");
  };
  const leaveGroup=async()=>{
    await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',uid);
    setPanel(null);setGroup(null);setGroupId(null);await loadGroups();say("Sei uscito dal gruppo");
  };
  const logout=async()=>{
    try{await sb.auth.signOut();}catch(e){}
    setPanel(null);setGroup(null);setGroupId(null);setMembers([]);setGroups([]);
  };

  /* ─── migrazione dal vecchio Firebase ─── */
  const migrate=async scan=>{
    const conv=p=>{
      if(p.base)return p.base;
      if(!p.overrides)return null;
      const auto=computeStats({id:p.id,base:null},scan.matches).auto;
      const totals={};FIELDS.forEach(f=>{totals[f]=p.overrides[f]??auto[f];});
      return baseFromTotals(totals,auto);
    };
    const nuovi=scan.players.map(p=>({id:String(p.id),name:String(p.name||"?"),base:conv(p)}));
    const ok=await writeData({players:nuovi,matches:scan.matches});
    if(!ok)throw new Error("Scrittura rifiutata");
    let n=0;
    for(const p of scan.players){
      const b64=scan.photos[p.id]||p.photo;
      if(!b64)continue;
      const{error}=await sb.from('photos').upsert({group_id:groupId,player_id:String(p.id),photo:b64,rev:Date.now()+n,updated_at:nowIso()});
      if(!error)n++;
    }
    await syncPhotos();
    return{players:nuovi.length,matches:scan.matches.length,photos:n};
  };

  /* ─── schermate d'ingresso ─── */
  if(!cfg)return <ConfigScreen pendingInvite={invite} onCfg={(c,code)=>{setCfg(c);setSb(makeClient(c));if(code)setInvite(code);}}/>;
  if(!sb)return(
    <Shell><Card><div style={{fontSize:14,color:C.text,lineHeight:1.7}}>
      Non riesco a caricare la libreria di Supabase: probabilmente sei senza connessione. Riprova quando torni online.
    </div><Btn onClick={()=>location.reload()} full style={{marginTop:14}}>Riprova</Btn></Card></Shell>
  );
  if(booting)return <Shell><div style={{textAlign:"center",color:C.muted,fontSize:13}}>Un attimo…</div></Shell>;
  if(!session)return <AuthGate sb={sb} onReset={()=>{localStorage.removeItem(CFG_KEY);setCfg(null);setSb(null);}}/>;
  if(!groupId||!group)return <GroupGate sb={sb} cfg={cfg} groups={groups} say={say} onPick={id=>{setGroupId(id);loadGroups();}} onOut={logout}/>;

  /* finché non dici chi sei, il foglio resta aperto: senza identità la
     selezione squadre non saprebbe di chi è il turno */
  const devePresentarsi=!!(me&&!me.player_id);

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Sans',sans-serif",color:C.text}}>
      <header style={{position:"sticky",top:0,zIndex:100,background:"#090909EE",backdropFilter:"blur(16px)",borderBottom:`1px solid ${C.border}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{background:C.accent,borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>⚽</div>
        <div style={{minWidth:0}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,lineHeight:1.1,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:160}}>{group.name}</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:live?C.green:C.muted}}/>
            <div style={{fontSize:9,color:C.muted,letterSpacing:1}}>{live?"LIVE":"COLLEGO…"}</div>
          </div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:C.accent,lineHeight:1}}>{players.length}</div>
            <div style={{fontSize:9,color:C.muted}}>GIOC.</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:C.text,lineHeight:1}}>{matches.length}</div>
            <div style={{fontSize:9,color:C.muted}}>PART.</div>
          </div>
          <button onClick={()=>setPanel("account")} title="Account e gruppo"
            style={{background:"none",border:`1px solid ${isAdmin?C.accent:C.border}`,borderRadius:10,padding:2,cursor:"pointer",flexShrink:0}}>
            <Avatar player={playersView.find(p=>p.id===myPlayerId)||{name:email||"?"}} size={30}/>
          </button>
        </div>
      </header>

      {update&&(
        <div style={{background:C.accent,color:"#000",padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:800}}>Nuova versione disponibile</div>
            {update.note&&<div style={{fontSize:11,opacity:.75,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{update.note}</div>}
          </div>
          <button onClick={()=>location.replace(location.pathname+"?v="+encodeURIComponent(update.version))}
            style={{background:"#000",color:C.accent,border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,fontWeight:800,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",flexShrink:0}}>Aggiorna</button>
        </div>
      )}

      <nav style={{background:C.card,borderBottom:`1px solid ${C.border}`,display:"flex",overflowX:"auto",padding:"0 2px"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:"1 0 auto",border:"none",background:"none",cursor:"pointer",padding:"10px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,fontFamily:"'DM Sans',sans-serif",borderBottom:`2px solid ${tab===n.id?C.accent:"transparent"}`,transition:"border-color .2s"}}>
            <span style={{fontSize:18}}>{n.icon}</span>
            <span style={{fontSize:9,fontWeight:800,letterSpacing:.8,color:tab===n.id?C.accent:C.muted}}>{n.label}</span>
          </button>
        ))}
      </nav>

      <main style={{maxWidth:700,margin:"0 auto",padding:"22px 14px 100px"}}>
        {tab==="standings"&&<StandingsSection standings={standings} isAdmin={isAdmin} updatePlayers={updatePlayers}/>}
        {tab==="match"    &&<MatchSection players={playersView} matches={matches} isAdmin={isAdmin} saveMatches={saveMatches}/>}
        {tab==="teams"    &&<TeamsSection standings={standings} teamSel={teamSel} setSel={setSel} myPlayerId={myPlayerId} isAdmin={isAdmin}/>}
        {tab==="players"  &&<PlayersSection players={playersView} matches={matches} isAdmin={isAdmin} myPlayerId={myPlayerId}
                              updatePlayers={updatePlayers} setPhoto={setPhoto} removePlayer={removePlayer}/>}
        <div style={{textAlign:"center",fontSize:10,color:"#3A3A3A",marginTop:28,letterSpacing:1}}>v{APP_VERSION}</div>
      </main>

      {(panel==="identity"||devePresentarsi)&&(
        <IdentitySheet players={playersView} mine={myPlayerId} closable={!devePresentarsi}
          onPick={claimPlayer} onNew={claimNew} onClose={()=>setPanel(null)}/>
      )}
      {panel==="account"&&(
        <AccountPanel sb={sb} cfg={cfg} group={group} members={members} me={me} isAdmin={isAdmin}
          players={playersView} email={email} say={say}
          onClose={()=>setPanel(null)} onLogout={logout} onLeave={leaveGroup}
          setRole={setRole} removeMember={removeMember} renameGroup={renameGroup}
          openIdentity={()=>setPanel("identity")} migrate={migrate}/>
      )}

      {toast&&(
        <div style={{position:"fixed",left:"50%",transform:"translateX(-50%)",bottom:"calc(24px + env(safe-area-inset-bottom))",background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 18px",fontSize:13,color:C.text,zIndex:600,boxShadow:"0 8px 30px rgba(0,0,0,.5)",maxWidth:"90vw",textAlign:"center"}}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CialtronApp/>);
</script>
</body>
</html>
