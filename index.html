            <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:10}}>CHI GIOCA</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              {[[false,"Chi ha detto sì",disponibili.length],[true,"Tutta la rosa",standings.length]].map(([v,l,n])=>(
                <button key={String(v)} onClick={()=>setSettings({playAll:v})} disabled={disponibili.length<2&&!v}
                  style={{flex:1,padding:"10px 6px",borderRadius:10,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",
                          border:`2px solid ${(!!playAll===v||(disponibili.length<2&&v))?C.accent:C.border}`,
                          background:(!!playAll===v||(disponibili.length<2&&v))?C.accent+"15":C.card2,
                          color:(!!playAll===v||(disponibili.length<2&&v))?C.accent:C.muted,opacity:(disponibili.length<2&&!v)?.4:1}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,lineHeight:1}}>{n}</div>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:.5,marginTop:2}}>{l}</div>
                </button>
              ))}
            </div>
            <div style={{fontSize:12,color:C.text}}>
              In campo: <strong style={{color:C.accent}}>{inGioco.length}</strong>
              {extN>0&&<span style={{color:C.muted}}> · di cui {extN} esterni</span>}
              {inGioco.length%2!==0&&<span style={{color:C.red}}> · siete in numero dispari</span>}
            </div>
            {fuori.length>0&&onAggiungi&&(
              <>
                <Btn onClick={()=>setAgg(v=>!v)} variant="ghost" full small style={{marginTop:8}}>
                  {agg?"Chiudi":`＋ Aggiungi dalla rosa (${fuori.length} fuori)`}
                </Btn>
                {agg&&(
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:11,color:C.muted,marginBottom:8,lineHeight:1.5}}>Chi si è dimenticato di rispondere o si è deciso all'ultimo: toccalo e finisce dentro.</div>
                    {fuori.map(p=>(
                      <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
                        <Avatar player={p} size={28}/>
                        <span style={{flex:1,fontSize:13,color:C.text,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
                        <Btn onClick={()=>onAggiungi(p.id)} variant="dark" small>＋ gioca</Btn>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
            {BtnEsterno}
            {disponibili.length<2&&<div style={{fontSize:11,color:C.muted,marginTop:8,lineHeight:1.5}}>Nessuno ha ancora risposto alla convocazione: si gioca con tutta la rosa.</div>}
          </div>

          <div style={{fontSize:10,color:C.muted,letterSpacing:1,margin:"0 2px 8px"}}>COME SI FANNO LE SQUADRE</div>
          {[{k:"cava",t:"CAVA",d:`${picker.name} fa le due squadre, poi ${captain.name} sceglie con quale giocare.`},
            {k:"draft",t:"TRADIZIONALE",d:`Chiamata alternata: comincia ${picker.name}, uno per volta, fino a esaurimento.`}].map(m=>(
            <button key={m.k} onClick={()=>ioPicker&&avvia(m.k)} disabled={!ioPicker}
              style={{width:"100%",textAlign:"left",background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:8,cursor:ioPicker?"pointer":"default",opacity:ioPicker?1:.5,fontFamily:"'DM Sans',sans-serif"}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:19,letterSpacing:2,color:C.accent}}>METODO {m.t}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:4,lineHeight:1.5}}>{m.d}</div>
            </button>
          ))}
          {!ioPicker&&<div style={{textAlign:"center",fontSize:13,color:C.muted,lineHeight:1.6,padding:"6px 10px"}}>
            Tocca a <strong style={{color:C.red}}>{picker.name}</strong> far partire la selezione.<br/>
            <span style={{fontSize:11}}>Quando lo fa, lo vedi comparire qui da solo.</span>
          </div>}
        </>
      ):

      phase==="picking"?(
        <>
          {BarraMetodo}
          {!ioPicker&&<Attesa chi={picker} cosa="sta formando le squadre…" colore={C.red}/>}
          {ioPicker&&(
            <div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.6}}>
              {sonoFormatore
                ? <>Assegna gli altri. Tu e {captain.name} vi dividete dopo, quando sceglie il lato.</>
                : <>Stai assegnando <strong style={{color:C.text}}>al posto di {picker.name}</strong>, che è il formatore: puoi farlo perché sei admin.
                    {sonoCapitano
                      ? <> Quando invii, il lato lo scegli tu, che sei il capitano.</>
                      : <> Quando invii, il lato lo sceglie {captain.name}.</>}</>}
            </div>
          )}
          {[captain,picker].map((fixed,fi)=>(
            <div key={fixed.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,opacity:.5}}>
              <Avatar player={fixed} size={34}/><span style={{flex:1,fontWeight:600,fontSize:14,color:C.text}}>{fixed.name}</span>
              <Tag color={fi===0?C.accent:C.red}>{fi===0?"CAPITANO":"FORMATORE"}</Tag>
            </div>
          ))}
          {altri.length>0&&<div style={{height:1,background:C.border,margin:"14px 0 12px"}}/>}
          {altri.map(id=>{
            const p=byId(id), side=assign[id];
            return(
              <div key={id} style={{display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                <Avatar player={p} size={34}/>
                <span style={{flex:1,fontWeight:600,fontSize:14,color:C.text,opacity:p.ext?.7:1}}>{p.name}</span>
                <div style={{display:"flex",gap:6}}>
                  {["white","black"].map(t=>(
                    <button key={t} disabled={!ioPicker} onClick={()=>ioPicker&&toggleAssign(id,t)}
                      style={{padding:"6px 14px",borderRadius:6,cursor:ioPicker?"pointer":"default",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif",border:`2px solid ${side===t?C.accent:C.border}`,background:side===t?(t==="white"?"#ffffff18":"#33333344"):C.card2,color:side===t?C.accent:C.muted,opacity:ioPicker||side===t?1:.45}}>
                      {t==="white"?"⬜":"⬛"}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
          {ioPicker&&<>
            {BtnEsterno}
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <Btn onClick={reset} variant="ghost" style={{flex:1}}>Annulla</Btn>
              <Btn onClick={()=>setSel({phase:"captain"})} disabled={!canSend} style={{flex:2}}>
                {sonoCapitano?"Fatto: scegli il lato →":`Invia a ${captain.name} →`}
              </Btn>
            </div>
          </>}
        </>
      ):

      phase==="draft"?(
        <>
          {BarraMetodo}
          <div style={{background:(turno==="A"?C.red:C.accent)+"12",border:`1px solid ${(turno==="A"?C.red:C.accent)}30`,borderRadius:12,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
            <Avatar player={chiChiama} size={32}/>
            <div style={{flex:1,fontSize:13,color:C.text,lineHeight:1.5}}>
              {myPlayerId===chiChiama.id
                ?<><strong style={{color:turno==="A"?C.red:C.accent}}>Tocca a te</strong>: chiama un giocatore.</>
                :ioChiamo
                  ?<>Chiami <strong style={{color:turno==="A"?C.red:C.accent}}>al posto di {chiChiama.name}</strong>, perché sei admin.</>
                  :<><strong style={{color:turno==="A"?C.red:C.accent}}>{chiChiama.name}</strong> sta chiamando…</>}
              <div style={{fontSize:11,color:C.muted}}>{restanti.length} ancora da scegliere</div>
            </div>
            {picks.length>0&&(ioPicker||ioCapitano)&&<Btn onClick={annullaUltima} variant="ghost" small>↩</Btn>}
          </div>

          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <Colonna label="⬜ BIANCHI" ids={teamA} col={C.red} sub={"chiama "+picker.name}/>
            <Colonna label="⬛ NERI" ids={teamB} col={C.accent} sub={"chiama "+captain.name}/>
          </div>

          {restanti.map(id=>{
            const p=byId(id);
            return(
              <button key={id} onClick={()=>ioChiamo&&chiama(id)} disabled={!ioChiamo}
                style={{width:"100%",display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,cursor:ioChiamo?"pointer":"default",opacity:ioChiamo?1:.55,fontFamily:"'DM Sans',sans-serif"}}>
                <Avatar player={p} size={34}/>
                <span style={{flex:1,textAlign:"left",fontWeight:600,fontSize:14,color:C.text,opacity:p.ext?.7:1}}>{p.name}</span>
                {ioChiamo&&<span style={{fontSize:12,color:turno==="A"?C.red:C.accent,fontWeight:800}}>CHIAMA →</span>}
              </button>
            );
          })}
          {(ioPicker||ioCapitano)&&<>
            {BtnEsterno}
            <Btn onClick={reset} variant="ghost" full style={{marginTop:8}}>Annulla tutto</Btn>
          </>}
        </>
      ):

      phase==="captain"?(
        <>
          {BarraMetodo}
          {ioCapitano
            ?<div style={{background:C.accent+"15",border:`1px solid ${C.accent}30`,borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:13,color:C.text,lineHeight:1.5}}>
               {sonoCapitano
                 ?<><strong style={{color:C.accent}}>Tocca a te</strong>: scegli con quale squadra giocare.</>
                 :<>Scegli <strong style={{color:C.accent}}>al posto di {captain.name}</strong>, perché sei admin.</>}
               <div style={{fontSize:11,color:C.muted}}>Proposta di {picker.name}</div>
             </div>
            :<Attesa chi={captain} cosa="sta scegliendo la squadra…" colore={C.accent}/>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {["white","black"].map(t=>{
              const team=altri.filter(id=>assign[id]===t);
              return(
                <div key={t} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
                  <div style={{fontWeight:800,marginBottom:10,fontSize:14,color:C.text}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"}</div>
                  {team.map(id=>{const p=byId(id);return(
                    <div key={id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,opacity:p.ext?.65:1}}>
                      <Avatar player={p} size={22}/><span style={{fontSize:12,color:C.text}}>{p.name}</span>
                    </div>);})}
                  <div style={{borderTop:`1px solid ${C.border}`,marginTop:8,paddingTop:8}}>
                    <div style={{fontSize:11,color:C.accent,fontStyle:"italic"}}>+ {captain.name}</div>
                    <div style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>— {picker.name} dall'altra parte</div>
                  </div>
                </div>
              );
            })}
          </div>
          {ioCapitano&&(
            <div style={{display:"flex",gap:8}}>
              {["white","black"].map(t=>(
                <button key={t} onClick={()=>captainPick(t)} style={{flex:1,padding:"14px 0",border:`2px solid ${C.border}`,background:C.card2,borderRadius:10,cursor:"pointer",color:C.text,fontWeight:800,fontSize:15,fontFamily:"'DM Sans',sans-serif"}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"}</button>
              ))}
            </div>
          )}
        </>
      ):

      phase==="done"?(
        <>
          {BarraMetodo}
          <div style={{textAlign:"center",marginBottom:22}}>
            <div style={{fontSize:40,marginBottom:8}}>🎉</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:C.accent,letterSpacing:3}}>SQUADRE PRONTE!</div>
            <div style={{fontSize:11,color:C.muted}}>metodo {metodo==="cava"?"cava":"tradizionale"}</div>
          </div>
          {!modifica?(
            <>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                {[{side:"white",ids:fW,label:"⬜ BIANCHI"},{side:"black",ids:fB,label:"⬛ NERI"}].map(({side,ids,label})=>(
                  <div key={side} style={{background:captainSide===side?C.accent+"12":C.card2,border:`2px solid ${captainSide===side?C.accent:C.border}`,borderRadius:14,padding:14}}>
                    <div style={{fontWeight:800,marginBottom:12,fontSize:14,color:captainSide===side?C.accent:C.text}}>{label} <span style={{color:C.muted}}>({ids.length})</span></div>
                    {ids.map(id=>{const p=byId(id);return(
                      <div key={id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,opacity:p.ext?.65:1}}>
                        <Avatar player={p} size={30}/>
                        <span style={{fontSize:13,color:myPlayerId===id?C.accent:C.text,fontWeight:(id===capId||myPlayerId===id)?800:400}}>{p.name}{id===capId?" ★":""}</span>
                      </div>);})}
                  </div>
                ))}
              </div>
              <Btn onClick={()=>setModifica(true)} variant="ghost" full small style={{marginBottom:10}}>✏️ Sposta, togli o aggiungi giocatori</Btn>
              {isAdmin&&onUseTeams&&(
                <>
                  <Btn onClick={()=>onUseTeams(fW,fB)} disabled={!fW.length||!fB.length} full style={{marginBottom:fW.length&&fB.length?8:4}}>Registra la partita con queste squadre →</Btn>
                  {(!fW.length||!fB.length)&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginBottom:8}}>Una delle due squadre è vuota.</div>}
                </>
              )}
              {(ioPicker||ioCapitano)&&<Btn onClick={reset} variant="ghost" full>Rifai da capo la selezione</Btn>}
            </>
          ):(
            <>
              <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.6}}>
                Sistema le squadre senza rifare la chiamata: sposta con ⬜ e ⬛, togli con ✕ chi si è ritirato, e aggiungi chi arriva all'ultimo. Il metodo resta {metodo==="draft"?"tradizionale":"cava"}.
              </div>
              {fW.concat(fB).map(id=>{
                const p=byId(id), lato=fW.indexOf(id)>=0?"white":"black";
                return(
                  <div key={id} style={{display:"flex",alignItems:"center",gap:9,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 12px",marginBottom:6}}>
                    <Avatar player={p} size={30}/>
                    <span style={{flex:1,fontSize:13,fontWeight:600,color:C.text,opacity:p.ext?.7:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}{id===capId?" ★":""}</span>
                    <div style={{display:"flex",gap:5}}>
                      {["white","black"].map(t=>(
                        <button key={t} onClick={()=>spostaIn(id,t)}
                          style={{padding:"6px 11px",borderRadius:6,cursor:"pointer",fontSize:14,fontFamily:"'DM Sans',sans-serif",
                                  border:`2px solid ${lato===t?C.accent:C.border}`,background:lato===t?C.accent+"18":C.card2,opacity:lato===t?1:.5}}>
                          {t==="white"?"⬜":"⬛"}
                        </button>
                      ))}
                      <button onClick={()=>spostaIn(id,null)} title="fuori dalla partita"
                        style={{padding:"6px 10px",borderRadius:6,cursor:"pointer",fontSize:13,color:C.red,border:`1px solid ${C.red}35`,background:"transparent",fontFamily:"'DM Sans',sans-serif"}}>✕</button>
                    </div>
                  </div>
                );
              })}
              <Btn onClick={esternoInSquadra} variant="ghost" full small style={{marginTop:6}}>＋ Aggiungi un esterno</Btn>
              {fuoriPartita.length>0&&(
                <div style={{marginTop:12}}>
                  <div style={{fontSize:10,color:C.muted,letterSpacing:1,fontWeight:800,marginBottom:8}}>FUORI DALLA PARTITA ({fuoriPartita.length})</div>
                  {fuoriPartita.map(p=>(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 12px",marginBottom:6}}>
                      <Avatar player={p} size={26}/>
                      <span style={{flex:1,fontSize:13,color:C.muted,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
                      {["white","black"].map(t=>(
                        <button key={t} onClick={()=>spostaIn(p.id,t)}
                          style={{padding:"6px 11px",borderRadius:6,cursor:"pointer",fontSize:14,border:`1px solid ${C.border}`,background:C.card,fontFamily:"'DM Sans',sans-serif"}}>
                          {t==="white"?"⬜":"⬛"}
                        </button>
                      ))}
                    </div>
                  ))}
                </div>
              )}
              <Btn onClick={()=>setModifica(false)} full style={{marginTop:12}}>Fatto</Btn>
            </>
          )}
        </>
      ):null}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROSA (solo admin può modificare) + IMPORT EXCEL
═══════════════════════════════════════════════════════ */
function PlayersSection({players,matches,isAdmin,myPlayerId,updatePlayers,setPhoto,removePlayer}){
  /* ognuno cura la propria scheda: foto e nome del giocatore che ha dichiarato
     di essere; il resto della rosa resta agli admin */
  const canEdit=p=>isAdmin||p.id===myPlayerId;
  const [showAdd,setShowAdd]=useState(false), [newName,setNewName]=useState(""), [newPhoto,setNewPhoto]=useState(null);
  const [editId,setEditId]=useState(null), [editName,setEditName]=useState(""), [editVals,setEditVals]=useState({});
  const [busy,setBusy]=useState(false), [delP,setDelP]=useState(null), [delSicuro,setDelSicuro]=useState(false);
  const [imp,setImp]=useState(null), [impErr,setImpErr]=useState("");
  const [fotoId,setFotoId]=useState(null), [fotoBusy,setFotoBusy]=useState(false);
  const newPhotoRef=useRef(null), xlsRef=useRef(null);

  const submitAdd=async()=>{
    if(!newName.trim()||busy)return;
    setBusy(true);
    const id=uid();
    await updatePlayers(list=>[...list,{id,name:newName.trim(),base:null,photoRev:null}]);
    if(newPhoto) await setPhoto(id,newPhoto);
    setNewName("");setNewPhoto(null);setShowAdd(false);setBusy(false);
  };
  /* Dalla matita si sistema tutto insieme: nome e numeri. Serve per aggiornare
     al volo dopo la partita, senza ricaricare l'Excel ogni volta. */
  const apriEdit=(p,st)=>{
    setEditId(p.id);setEditName(p.name);
    setEditVals({presences:st.presences,wins:st.wins,goals:st.goals,mvps:st.mvps});
  };
  const salvaEdit=async(p,st)=>{
    const nome=(editName||"").trim()||p.name;
    const base=baseFromTotals(editVals,st.auto);
    await updatePlayers(list=>list.map(x=>x.id===p.id?{...x,name:nome,base,overrides:null}:x));
    setEditId(null);
  };

  /* ─── import Excel: Nome · Presenze · Vittorie · Gol · MVP ─── */
  const readFile=async file=>{
    setImpErr("");
    if(typeof XLSX==="undefined"){setImpErr("Libreria Excel non caricata: controlla la connessione e ricarica.");return;}
    try{
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const parsed=[]; let skipped=0;
      for(const row of rows){
        const f=readRow(row);
        const name=String(f.name??"").trim();
        if(!name){skipped++;continue;}
        if(parsed.some(r=>norm(r.name)===norm(name))){skipped++;continue;}
        const gia=(players||[]).find(p=>norm(p.name)===norm(name));
        const riga={name,
          presences:Math.max(0,Math.round(+f.presences||0)),
          wins:Math.max(0,Math.round(+f.wins||0)),
          goals:Math.max(0,Math.round(+f.goals||0)),
          mvps:Math.max(0,Math.round(+f.mvps||0)),
          exists:!!gia};
        /* la controprova: cosa c'è adesso, e quali numeri cambierebbero */
        if(gia){
          const st=computeStats(gia,matches);
          riga.cur={presences:st.presences,wins:st.wins,goals:st.goals,mvps:st.mvps};
          riga.diff=FIELDS.filter(k=>riga.cur[k]!==riga[k]);
        }else riga.diff=[];
        parsed.push(riga);
      }
      if(!parsed.length){setImpErr("Nessuna riga valida. Serve una colonna 'Nome' (poi Presenze, Vittorie, Gol, MVP).");return;}
      setImp({rows:parsed,skipped,sheet:wb.SheetNames[0]});
    }catch(e){setImpErr("File non leggibile: "+e.message);}
  };
  const applyImport=async()=>{
    setBusy(true);
    await updatePlayers(list=>{
      const out=list.map(p=>({...p}));
      for(const r of imp.rows){
        const totals={presences:r.presences,wins:r.wins,goals:r.goals,mvps:r.mvps};
        const i=out.findIndex(p=>norm(p.name)===norm(r.name));
        if(i>=0){ out[i].base=baseFromTotals(totals,computeStats(out[i],matches).auto); out[i].overrides=null; }
        else out.push({id:uid(),name:r.name,base:baseFromTotals(totals,ZERO),photoRev:null});
      }
      return out;
    });
    setBusy(false);setImp(null);
  };

  return(
    <div>
      <Banner title="ROSA" sub={isAdmin?"Gestisci l'anagrafica dei giocatori":myPlayerId?"La tua scheda la modifichi tu":"Anagrafica giocatori"}/>
      {isAdmin&&(
        <>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <Btn onClick={()=>setShowAdd(s=>!s)} style={{flex:2,padding:"12px 0",borderRadius:10}}>{showAdd?"✕ Annulla":"＋ Aggiungi giocatore"}</Btn>
            <Btn onClick={()=>xlsRef.current?.click()} variant="dark" style={{flex:1,padding:"12px 0",borderRadius:10}}>📊 Excel</Btn>
          </div>
          <input type="file" accept=".xlsx,.xls,.csv" ref={xlsRef} style={{display:"none"}}
            onChange={e=>{const f=e.target.files[0];e.target.value="";if(f)readFile(f);}}/>
          {impErr&&<div style={{background:C.red+"15",border:`1px solid ${C.red}40`,borderRadius:10,padding:12,marginBottom:12,fontSize:13,color:C.red}}>{impErr}</div>}
          {showAdd&&(
            <div style={{background:C.card,border:`1px solid ${C.accent}35`,borderRadius:14,padding:18,marginBottom:16}}>
              <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:14}}>
                <div onClick={()=>newPhotoRef.current?.click()} style={{width:64,height:64,borderRadius:"50%",background:C.card2,border:`2px dashed ${C.accent}`,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
                  {newPhoto?<img src={newPhoto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:24}}>📷</span>}
                </div>
                <input type="file" accept="image/*" ref={newPhotoRef} style={{display:"none"}} onChange={async e=>{const f=e.target.files[0];if(f){const b=await resizePhoto(f);setNewPhoto(b);}}}/>
                <input placeholder="Nome giocatore…" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submitAdd()} style={{flex:1,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:"10px 14px",fontSize:14,fontFamily:"'DM Sans',sans-serif"}}/>
              </div>
              <Btn onClick={submitAdd} disabled={busy} full style={{padding:"10px 0"}}>{busy?"Aggiungo…":"Aggiungi"}</Btn>
            </div>
          )}
        </>
      )}

      {!players||players.length===0?<Empty emoji="👥" text={isAdmin?"Nessun giocatore. Aggiungine uno!":"Nessun giocatore ancora."}/>:
        (players||[]).map(p=>{
          const s=computeStats(p,matches), isEd=editId===p.id;
          return(
            <div key={p.id} style={{background:C.card,border:`1px solid ${p.id===myPlayerId?C.accent+"40":C.border}`,borderRadius:14,padding:16,marginBottom:10}}>
              <div style={{display:"flex",gap:14,alignItems:"center"}}>
                <div style={{position:"relative",flexShrink:0}}>
                  {/* un tocco sulla foto la apre grande: cambiarla è un passo dopo,
                      dentro la scheda, non un file che si apre per sbaglio */}
                  <div onClick={()=>setFotoId(p.id)} role="button" aria-label={"Foto di "+p.name} style={{cursor:"pointer"}}>
                    <Avatar player={p} size={58}/>
                    {canEdit(p)&&<div style={{position:"absolute",bottom:-2,right:-2,background:C.accent,borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>📷</div>}
                  </div>
                  {canEdit(p)&&<input id={`ph-${p.id}`} type="file" accept="image/*" style={{display:"none"}}
                    onChange={async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;setFotoBusy(true);await setPhoto(p.id,f);setFotoBusy(false);}}/>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  {canEdit(p)&&isEd
                    ?<input value={editName} onChange={e=>setEditName(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&salvaEdit(p,s)} style={{width:"100%",background:C.card2,border:`1px solid ${C.accent}`,color:C.text,borderRadius:6,padding:"7px 10px",fontSize:15,fontFamily:"'DM Sans',sans-serif",fontWeight:700}}/>
                    :<div style={{fontWeight:800,fontSize:16,color:C.text}}>{p.name}{p.id===myPlayerId&&<span style={{fontSize:10,color:C.accent,fontWeight:800,marginLeft:6,letterSpacing:1}}>SEI TU</span>}</div>
                  }
                  <div style={{fontSize:12,color:C.muted,marginTop:3}}>Media: <span style={{color:C.accent,fontWeight:700}}>{s.avg.toFixed(2)}</span> · {s.presences} presenze</div>
                </div>
                {canEdit(p)&&(
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    {isEd?<Btn onClick={()=>salvaEdit(p,s)} small>✓</Btn>
                      :<button onClick={()=>apriEdit(p,s)} style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:14}}>✏️</button>}
                    {isAdmin&&<button onClick={()=>setDelP(p)} style={{background:"none",border:`1px solid ${C.red}30`,color:C.red,borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:14}}>🗑️</button>}
                  </div>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:2,marginTop:16,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
                {[{l:"PRESENZE",f:"presences"},{l:"VINTE",f:"wins"},{l:"GOL",f:"goals"},{l:"MVP",f:"mvps"},{l:"MEDIA",f:null}].map((st,i)=>{
                  const media=st.f===null;
                  const vivo=media?((+editVals.presences||0)>0?((+editVals.wins||0)*3/(+editVals.presences||0)).toFixed(2):"0.00"):null;
                  return(
                  <div key={i} style={{textAlign:"center",borderRight:i<4?`1px solid ${C.border}`:"none",padding:"0 2px"}}>
                    {isEd&&!media
                      ?<input type="number" min="0" value={editVals[st.f]} onChange={e=>setEditVals(v=>({...v,[st.f]:e.target.value}))}
                         style={{width:"100%",background:C.card3,border:`1px solid ${C.accent}`,color:C.text,borderRadius:6,padding:"5px 2px",fontSize:14,fontWeight:800,textAlign:"center",fontFamily:"'DM Sans',sans-serif"}}/>
                      :<div style={{fontWeight:800,fontSize:20,color:media?C.accent:C.text}}>
                         {media?(isEd?vivo:s.avg.toFixed(2)):s[st.f]}
                         {st.f&&!isEd&&s.base[st.f]!==0&&<span style={{fontSize:9,color:C.accent,verticalAlign:"super"}}>✎</span>}
                       </div>}
                    <div style={{fontSize:9,color:C.muted,letterSpacing:.6,marginTop:2}}>{st.l}</div>
                  </div>);
                })}
              </div>
              {isEd&&(
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <div style={{fontSize:11,color:C.muted,flex:1,minWidth:150,lineHeight:1.5}}>Dalle partite: {s.auto.presences}·{s.auto.wins}·{s.auto.goals}·{s.auto.mvps}. Quello che cambi resta come correzione, il resto continua ad aggiornarsi da solo.</div>
                  <Btn onClick={()=>setEditVals({presences:s.auto.presences,wins:s.auto.wins,goals:s.auto.goals,mvps:s.auto.mvps})} variant="ghost" small>↺ Ricalcola</Btn>
                  <Btn onClick={()=>setEditId(null)} variant="ghost" small>Annulla</Btn>
                </div>
              )}
            </div>
          );
        })
      }

      {/* la foto in grande: si apre da un tocco sull'avatar in rosa */}
      {(()=>{
        const p=(players||[]).find(x=>x.id===fotoId);
        if(!p)return null;
        const s=computeStats(p,matches);
        const col=["#FF6B6B","#4ECDC4","#45B7D1","#A78BFA","#F59E0B","#34D399","#F472B6","#60A5FA"][(p.name?.charCodeAt(0)||0)%8];
        return(
          <Modal onClose={()=>setFotoId(null)}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,lineHeight:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name.toUpperCase()}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:3}}>Media {s.avg.toFixed(2)} · {s.presences} presenze · {s.goals} gol</div>
              </div>
              {canEdit(p)&&(
                <label htmlFor={`ph-${p.id}`} style={{cursor:"pointer",flexShrink:0,fontSize:12,fontWeight:700,color:C.accent,
                        border:`1px solid ${C.accent}50`,borderRadius:8,padding:"7px 12px",fontFamily:"'DM Sans',sans-serif"}}>
                  {fotoBusy?"Carico…":p.photo?"Modifica":"Aggiungi foto"}
                </label>
              )}
            </div>
            {p.photo
              ?<img src={p.photo} alt={p.name} style={{width:"100%",maxHeight:"58vh",objectFit:"cover",borderRadius:14,border:`1px solid ${C.border}`,display:"block"}}/>
              :<div style={{width:"100%",aspectRatio:"1",maxHeight:"58vh",borderRadius:14,background:col+"18",border:`1px solid ${col}45`,
                            display:"flex",alignItems:"center",justifyContent:"center",fontSize:96,fontWeight:800,color:col}}>{p.name[0].toUpperCase()}</div>}
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <Btn onClick={()=>setFotoId(null)} variant="ghost" style={{flex:1}}>Chiudi</Btn>
              {canEdit(p)&&p.photo&&<Btn onClick={async()=>{setFotoBusy(true);await setPhoto(p.id,null);setFotoBusy(false);}} disabled={fotoBusy} variant="danger" style={{flex:1}}>Togli la foto</Btn>}
            </div>
            {canEdit(p)&&<div style={{fontSize:11,color:C.muted,marginTop:10,lineHeight:1.5,textAlign:"center"}}>
              Da "{p.photo?"Modifica":"Aggiungi foto"}" scegli se scattarla sul momento o prenderla dalle foto del telefono.
            </div>}
          </Modal>
        );
      })()}

      {delP&&!delSicuro&&(
        <Modal onClose={()=>setDelP(null)}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:10}}>ELIMINARE {delP.name.toUpperCase()}?</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:18,lineHeight:1.6}}>Vuoi davvero togliere <strong style={{color:C.text}}>{delP.name}</strong> dalla competizione? Sparisce dalla rosa e dalla classifica.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setDelP(null)} variant="ghost" style={{flex:1}}>No</Btn>
            <Btn onClick={()=>setDelSicuro(true)} variant="danger" style={{flex:1}}>Sì</Btn>
          </div>
        </Modal>
      )}

      {/* seconda conferma: cancellare un giocatore non si annulla */}
      {delP&&delSicuro&&(
        <Modal onClose={()=>{setDelP(null);setDelSicuro(false);}}>
          <div style={{fontSize:40,textAlign:"center",marginBottom:10}}>⚠️</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.red,marginBottom:10,textAlign:"center"}}>NON SI TORNA INDIETRO</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:18,lineHeight:1.6}}>
            Questa azione è irreversibile: statistiche e foto di <strong style={{color:C.text}}>{delP.name}</strong> vengono cancellate.
            Le partite già registrate restano, ma senza il suo nome. Sei sicuro?
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>{setDelP(null);setDelSicuro(false);}} variant="ghost" style={{flex:1}}>No, lascia stare</Btn>
            <Btn onClick={async()=>{setBusy(true);await removePlayer(delP.id);setBusy(false);setDelP(null);setDelSicuro(false);}} disabled={busy} variant="danger" style={{flex:1}}>{busy?"…":"Sì, elimina"}</Btn>
          </div>
        </Modal>
      )}

      {imp&&(
        <Modal onClose={()=>setImp(null)}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:4}}>IMPORT EXCEL</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.6}}>
            Foglio "{imp.sheet}" · <strong style={{color:C.accent}}>{imp.rows.filter(r=>!r.exists).length}</strong> nuovi,
            {" "}<strong style={{color:C.text}}>{imp.rows.filter(r=>r.exists).length}</strong> già in rosa
            {imp.skipped>0&&<> · {imp.skipped} righe ignorate</>}
            <br/>
            {imp.rows.some(r=>r.diff.length>0)
              ?<>In <strong style={{color:C.red}}>{imp.rows.filter(r=>r.diff.length>0).length}</strong> ci sono numeri diversi da quelli di adesso: li vedi qui sotto <span style={{color:C.accent}}>da → a</span>.</>
              :<>I numeri dell'Excel coincidono con quelli già in app: non cambierà niente.</>}
          </div>
          <div style={{maxHeight:230,overflowY:"auto",marginBottom:14,border:`1px solid ${C.border}`,borderRadius:8}}>
            {imp.rows.map((r,i)=>(
              <div key={i} style={{padding:"8px 10px",borderBottom:i<imp.rows.length-1?`1px solid ${C.border}`:"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{flex:1,fontSize:13,color:C.text,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
                  {!r.exists?<Tag>NUOVO</Tag>:r.diff.length>0?<Tag color={C.red}>CAMBIA</Tag>:<span style={{fontSize:10,color:C.muted}}>uguale</span>}
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}>
                  {FIELDS.map(k=>(
                    <span key={k}>{SHORT[k]}{" "}
                      {r.cur&&r.cur[k]!==r[k]
                        ?<><span style={{textDecoration:"line-through"}}>{r.cur[k]}</span> <strong style={{color:C.accent}}>→ {r[k]}</strong></>
                        :<strong style={{color:C.text}}>{r[k]}</strong>}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:C.muted,marginBottom:14}}>I numeri importati diventano la base di partenza: le partite registrate nell'app si sommano a questi valori.</div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setImp(null)} variant="ghost" style={{flex:1}}>Annulla</Btn>
            <Btn onClick={applyImport} disabled={busy} style={{flex:1}}>{busy?"Importo…":"Importa"}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════ */
const NAV=[
  {id:"standings",icon:"🏆",label:"CLASSIFICA"},
  {id:"callup",icon:"📅",label:"CI SEI?"},
  {id:"match",icon:"⚽",label:"PARTITE"},
  {id:"teams",icon:"🛡️",label:"SQUADRE"},
  {id:"players",icon:"👥",label:"ROSA"},
];
const nowIso=()=>new Date().toISOString();

/* Se l'app è stata aperta da un link d'invito, il codice sta nel cancelletto. */
function inviteFromUrl(){
  const m=(location.hash||"").match(/[#&]join=([^&]+)/);
  if(m){
    let v=m[1];
    try{v=decodeURIComponent(v);}catch(e){}
    try{localStorage.setItem(INV_KEY,v);}catch(e){}
    return v;
  }
  try{return localStorage.getItem(INV_KEY)||null;}catch(e){return null;}
}
const clearInvite=()=>{try{localStorage.removeItem(INV_KEY);}catch(e){}};

function CialtronApp(){
  const [cfg,setCfg]=useState(loadCfg);
  const [sb,setSb]=useState(()=>makeClient(loadCfg()));
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(true);
  const [groups,setGroups]=useState([]);
  const [groupId,setGroupId]=useState(()=>localStorage.getItem(GROUP_KEY)||null);
  const [group,setGroup]=useState(null);
  const [members,setMembers]=useState([]);
  const [teamSel,setTeamSel]=useState(null);
  const [board,setBoard]=useState({settings:{},callups:{}});
  const [photoCache,setPhotoCache]=useState({});
  const [tab,setTab]=useState("standings");
  const [panel,setPanel]=useState(null);
  const [prefill,setPrefill]=useState(null);   // squadre passate dalla selezione alla registrazione
  const [toast,setToast]=useState("");
  const [live,setLive]=useState(false);
  const [invite,setInvite]=useState(inviteFromUrl);
  const update=useUpdateCheck();

  const uid=session?session.user.id:null;
  const email=session?session.user.email:"";
  const groupRef=useRef(null); groupRef.current=group;
  const selRef=useRef(null);   selRef.current=teamSel;
  const boardRef=useRef(null); boardRef.current=board;
  const say=useCallback(m=>{setToast(m);setTimeout(()=>setToast(t=>t===m?"":t),2600);},[]);

  useEffect(()=>{const s=document.getElementById("splash");if(s)s.style.display="none";},[]);

  /* Un link d'invito toccato mentre l'app è già aperta cambia solo il
     cancelletto: il browser non ricarica niente, quindi l'invito va raccolto
     a mano, altrimenti non succederebbe assolutamente nulla. */
  useEffect(()=>{
    const onHash=()=>{const v=inviteFromUrl();if(v)setInvite(v);};
    window.addEventListener("hashchange",onHash);
    return()=>window.removeEventListener("hashchange",onHash);
  },[]);

  /* ─── sessione ─── */
  useEffect(()=>{
    if(!sb){setBooting(false);return;}
    let dead=false;
    sb.auth.getSession().then(({data})=>{
      if(dead)return;
      setSession(data.session||null);setBooting(false);
    }).catch(()=>setBooting(false));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>{setSession(s||null);setBooting(false);});
    return()=>{dead=true;try{sub.subscription.unsubscribe();}catch(e){}};
  },[sb]);

  /* ─── i miei gruppi (+ invito in sospeso) ─── */
  const loadGroups=useCallback(async()=>{
    if(!sb||!uid)return[];
    const{data,error}=await sb.from('groups').select('*').order('created_at');
    if(error){say(errText(error));return[];}
    setGroups(data||[]);
    return data||[];
  },[sb,uid,say]);

  useEffect(()=>{
    if(!sb||!uid)return;
    let dead=false;
    (async()=>{
      let list=await loadGroups();
      if(dead)return;
      if(invite){
        const{code}=unpackInvite(invite);
        const{data,error}=await sb.rpc('join_group',{p_code:code});
        if(dead)return;
        /* L'invito si scorda solo quando la risposta è definitiva: entrato,
           oppure codice davvero sbagliato. Se è caduta la rete lo si tiene da
           parte, altrimenti chi ha aperto il link dovrebbe farselo rimandare. */
        const definitiva=!error||/codice non valido/i.test(error.message||"");
        if(definitiva){
          setInvite(null);clearInvite();
          try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
        }
        if(error)say(/codice non valido/i.test(error.message)?"Codice invito non valido":"Non sono riuscito a entrare nel gruppo: riprovo alla prossima apertura");
        else{list=await loadGroups();setGroupId(data);say("Sei dentro il gruppo");return;}
      }
      const saved=localStorage.getItem(GROUP_KEY);
      if(saved&&list.some(g=>g.id===saved))setGroupId(saved);
      else if(list.length===1)setGroupId(list[0].id);
      else if(saved)setGroupId(null);
    })();
    return()=>{dead=true;};
  },[sb,uid,invite,loadGroups,say]);

  useEffect(()=>{
    if(groupId)localStorage.setItem(GROUP_KEY,groupId);else localStorage.removeItem(GROUP_KEY);
  },[groupId]);

  /* ─── il gruppo scelto ─── */
  const loadGroup=useCallback(async()=>{
    if(!sb||!groupId)return;
    const[g,m,s,b]=await Promise.all([
      sb.from('groups').select('*').eq('id',groupId).maybeSingle(),
      sb.from('group_members').select('*').eq('group_id',groupId),
      sb.from('selections').select('*').eq('group_id',groupId).maybeSingle(),
      sb.from('board').select('*').eq('group_id',groupId).maybeSingle(),
    ]);
    if(g.error||!g.data){setGroup(null);setGroupId(null);return;}
    setGroup(g.data);
    setMembers(m.data||[]);
    if(s.data)setTeamSel(s.data.state||{phase:"idle",assign:{}});
    else{
      const{data:ins}=await sb.from('selections').insert({group_id:groupId}).select().maybeSingle();
      setTeamSel((ins&&ins.state)||{phase:"idle",assign:{}});
    }
    /* la bacheca può mancare nei gruppi nati prima che esistesse */
    if(b.data)setBoard({settings:b.data.settings||{},callups:b.data.callups||{}});
    else{
      const{data:ins}=await sb.from('board').insert({group_id:groupId}).select().maybeSingle();
      setBoard({settings:(ins&&ins.settings)||{},callups:(ins&&ins.callups)||{}});
    }
  },[sb,groupId]);

  useEffect(()=>{
    if(!sb||!groupId||!uid)return;
    setPhotoCache(readPhotoCache(groupId));
    loadGroup();
    const ch=sb.channel('grp-'+groupId)
      .on('postgres_changes',{event:'*',schema:'public',table:'groups',filter:'id=eq.'+groupId},
          p=>{if(p.new&&p.new.id)setGroup(g=>Object.assign({},g,p.new));})
      .on('postgres_changes',{event:'*',schema:'public',table:'selections',filter:'group_id=eq.'+groupId},
          p=>{if(p.new&&p.new.state)setTeamSel(p.new.state);})
      .on('postgres_changes',{event:'*',schema:'public',table:'board',filter:'group_id=eq.'+groupId},
          p=>{if(p.new)setBoard({settings:p.new.settings||{},callups:p.new.callups||{}});})
      .on('postgres_changes',{event:'*',schema:'public',table:'group_members',filter:'group_id=eq.'+groupId},
          ()=>{sb.from('group_members').select('*').eq('group_id',groupId).then(({data})=>setMembers(data||[]));})
      .subscribe(st=>setLive(st==="SUBSCRIBED"));
    /* Rete di sicurezza: se il tempo reale non è attivo sul progetto, o cade,
       si continua comunque a vedere le novità — solo un po' più tardi. */
    const poll=setInterval(loadGroup,20000);
    const onVis=()=>{if(document.visibilityState==="visible")loadGroup();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(poll);document.removeEventListener("visibilitychange",onVis);try{sb.removeChannel(ch);}catch(e){}};
  },[sb,groupId,uid,loadGroup]);

  /* ─── dati derivati ─── */
  const data=(group&&group.data)||{};
  const players=useMemo(()=>Array.isArray(data.players)?data.players.filter(Boolean):[],[data.players]);
  const matches=useMemo(()=>Array.isArray(data.matches)?data.matches.filter(Boolean):[],[data.matches]);
  const playersRef=useRef([]); playersRef.current=players;
  const me=useMemo(()=>members.find(m=>m.user_id===uid)||null,[members,uid]);
  const isAdmin=!!(me&&me.role==="admin")||!!(group&&group.owner===uid);
  const myPlayerId=(me&&me.player_id)||null;
  const playersView=useMemo(()=>players.map(p=>({...p,photo:photoCache[p.id]||null})),[players,photoCache]);
  const standings=useMemo(()=>
    playersView.map(p=>({...p,stats:computeStats(p,matches)}))
      .sort((a,b)=>b.stats.avg-a.stats.avg||b.stats.points-a.stats.points),
    [playersView,matches]);

  /* ─── scritture ─── */
  const writeData=useCallback(async patch=>{
    const cur=(groupRef.current&&groupRef.current.data)||{};
    const next=Object.assign({players:[],matches:[]},cur,patch);
    setGroup(g=>Object.assign({},g,{data:next}));
    const{error}=await sb.from('groups').update({data:next,updated_at:nowIso(),updated_by:uid}).eq('id',groupId);
    if(error){say(errText(error));loadGroup();return false;}
    return true;
  },[sb,groupId,uid,say,loadGroup]);

  const updatePlayers=useCallback(fn=>writeData({players:fn(playersRef.current.map(p=>({...p})))}),[writeData]);
  const saveMatches=useCallback(next=>writeData({matches:next}),[writeData]);

  const setSel=useCallback(async patch=>{
    const next=Object.assign({},selRef.current||{phase:"idle",assign:{}},patch);
    setTeamSel(next);
    const{error}=await sb.from('selections').upsert({group_id:groupId,state:next,updated_at:nowIso(),updated_by:uid});
    if(error)say(errText(error));
  },[sb,groupId,uid,say]);

  /* ─── bacheca: convocazioni e ruoli scelti a mano, ci scrivono tutti ─── */
  const setSettings=useCallback(async patch=>{
    const next=Object.assign({},(boardRef.current&&boardRef.current.settings)||{},patch);
    Object.keys(next).forEach(k=>{if(next[k]===null)delete next[k];});
    setBoard(b=>Object.assign({},b,{settings:next}));
    const{error}=await sb.from('board').update({settings:next,updated_at:nowIso(),updated_by:uid}).eq('group_id',groupId);
    if(error){say(errText(error));loadGroup();}
  },[sb,groupId,uid,say,loadGroup]);

  /* La risposta passa dal database e non da un aggiornamento nostro: due
     persone che rispondono insieme non si cancellano a vicenda. */
  const setCallup=useCallback(async(playerId,value,iso)=>{
    const{data,error}=await sb.rpc('set_callup',{p_group:groupId,p_date:iso,p_player:playerId,p_value:value||""});
    if(error){say(errText(error));return;}
    setBoard(b=>Object.assign({},b,{callups:data||{}}));
  },[sb,groupId,say]);

  /* ─── foto: tabella a parte, scaricate solo quando cambia il rev ─── */
  const syncPhotos=useCallback(async()=>{
    if(!sb||!groupId)return;
    const{data:revs}=await sb.from('photos').select('player_id,rev').eq('group_id',groupId);
    for(const r of revs||[]){
      if(localStorage.getItem(PH_REV(groupId,r.player_id))===String(r.rev))continue;
      const{data:one}=await sb.from('photos').select('photo').eq('group_id',groupId).eq('player_id',r.player_id).maybeSingle();
      const b64=(one&&one.photo)||null;
      writePhotoCache(groupId,r.player_id,b64,r.rev);
      setPhotoCache(c=>Object.assign({},c,{[r.player_id]:b64||undefined}));
    }
  },[sb,groupId]);

  useEffect(()=>{
    if(!sb||!groupId)return;
    syncPhotos();
    const t=setInterval(syncPhotos,30000);
    return()=>clearInterval(t);
  },[sb,groupId,syncPhotos,players.length]);

  const setPhoto=useCallback(async(playerId,src)=>{
    const b64=!src?null:(typeof src==="string"?src:await resizePhoto(src));
    if(src&&!b64){say("Foto non caricata");return false;}
    const rev=Date.now();
    const{error}=await sb.from('photos').upsert({group_id:groupId,player_id:playerId,photo:b64,rev,updated_at:nowIso()});
    if(error){say(errText(error));return false;}
    writePhotoCache(groupId,playerId,b64,rev);
    setPhotoCache(c=>Object.assign({},c,{[playerId]:b64||undefined}));
    return true;
  },[sb,groupId,say]);

  const removePlayer=useCallback(async id=>{
    try{await sb.from('photos').delete().eq('group_id',groupId).eq('player_id',id);}catch(e){}
    dropPhotoCache(groupId,id);
    setPhotoCache(c=>{const n=Object.assign({},c);delete n[id];return n;});
    return updatePlayers(list=>list.filter(p=>p.id!==id));
  },[sb,groupId,updatePlayers]);

  /* ─── account e gruppo ─── */
  const claimPlayer=async pid=>{
    const p=playersRef.current.find(x=>x.id===pid);
    const{error}=await sb.from('group_members').update({player_id:pid,member_name:p?p.name:null}).eq('group_id',groupId).eq('user_id',uid);
    if(error)throw error;
    setMembers(ms=>ms.map(m=>m.user_id===uid?Object.assign({},m,{player_id:pid,member_name:p?p.name:null}):m));
    setPanel(null);say("Bentrovato"+(p?", "+p.name:""));
  };
  const claimNew=async name=>{
    const{error}=await sb.rpc('claim_new_player',{p_group:groupId,p_name:name});
    if(error)throw new Error(/esiste già/i.test(error.message)?"C'è già un giocatore con questo nome: scegli quello dalla lista":errText(error));
    await loadGroup();setPanel(null);say("Bentrovato, "+name);
  };
  const setRole=async(userId,role)=>{
    const{error}=await sb.from('group_members').update({role}).eq('group_id',groupId).eq('user_id',userId);
    if(error){say(errText(error));return;}
    setMembers(ms=>ms.map(m=>m.user_id===userId?Object.assign({},m,{role}):m));
    say(role==="admin"?"Ora è admin":"Ora è un giocatore");
  };
  const removeMember=async userId=>{
    const{error}=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',userId);
    if(error){say(errText(error));return;}
    setMembers(ms=>ms.filter(m=>m.user_id!==userId));say("Rimosso dal gruppo");
  };
  const renameGroup=async name=>{
    const{error}=await sb.from('groups').update({name}).eq('id',groupId);
    if(error){say(errText(error));return;}
    setGroup(g=>Object.assign({},g,{name}));say("Nome aggiornato");
  };
  const leaveGroup=async()=>{
    await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',uid);
    setPanel(null);setGroup(null);setGroupId(null);await loadGroups();say("Sei uscito dal gruppo");
  };
  const logout=async()=>{
    try{await sb.auth.signOut();}catch(e){}
    setPanel(null);setGroup(null);setGroupId(null);setMembers([]);setGroups([]);
  };

  /* ─── migrazione dal vecchio Firebase ─── */
  const migrate=async scan=>{
    const conv=p=>{
      if(p.base)return p.base;
      if(!p.overrides)return null;
      const auto=computeStats({id:p.id,base:null},scan.matches).auto;
      const totals={};FIELDS.forEach(f=>{totals[f]=p.overrides[f]??auto[f];});
      return baseFromTotals(totals,auto);
    };
    const nuovi=scan.players.map(p=>({id:String(p.id),name:String(p.name||"?"),base:conv(p)}));
    const ok=await writeData({players:nuovi,matches:scan.matches});
    if(!ok)throw new Error("Scrittura rifiutata");
    let n=0;
    for(const p of scan.players){
      const b64=scan.photos[p.id]||p.photo;
      if(!b64)continue;
      const{error}=await sb.from('photos').upsert({group_id:groupId,player_id:String(p.id),photo:b64,rev:Date.now()+n,updated_at:nowIso()});
      if(!error)n++;
    }
    await syncPhotos();
    return{players:nuovi.length,matches:scan.matches.length,photos:n};
  };

  /* ─── schermate d'ingresso ─── */
  const matchDate=useMemo(()=>nextMatch(board.settings),[board.settings]);
  const matchIso=isoDate(matchDate);
  /* chi ha detto che c'è: è da qui che si pesca per fare le squadre */
  const availableIds=useMemo(()=>{
    const g=board.callups[matchIso]||{};
    return Object.keys(g).filter(id=>g[id]&&g[id].v==="si");
  },[board.callups,matchIso]);
  /* chi scende in campo: i disponibili della convocazione, salvo diverso
     accordo del gruppo (playAll). Su questi si calcolano capitano e formatore. */
  /* Chi ha detto NO non gioca, e quindi non può nemmeno fare il capitano o il
     formatore: il ruolo passa al successivo in classifica. Vale anche quando il
     gruppo ha scelto di pescare da tutta la rosa — lì la convocazione non
     decide chi gioca, ma un "non ci sono" resta un'assenza dichiarata. */
  const assentiIds=useMemo(()=>{
    const g=board.callups[matchIso]||{};
    return Object.keys(g).filter(id=>g[id]&&g[id].v==="no");
  },[board.callups,matchIso]);
  const eligible=useMemo(()=>{
    const disp=standings.filter(p=>availableIds.indexOf(p.id)>=0);
    if(!board.settings.playAll&&disp.length>=2)return disp;
    const senzaAssenti=standings.filter(p=>assentiIds.indexOf(p.id)<0);
    return senzaAssenti.length>=2?senzaAssenti:standings;
  },[standings,availableIds,assentiIds,board.settings.playAll]);
  const ruoliVivi=useMemo(()=>rolesOf(eligible,board.settings),[eligible,board.settings]);
  /* Ruolo scelto a mano e poi decaduto perché quel giocatore non c'è: va detto,
     se no sembra che l'app abbia ignorato la scelta del gruppo. */
  const ruoliDecaduti=useMemo(()=>{
    const s=board.settings||{};
    return [["captainId","capitano"],["pickerId","formatore"]].map(([k,ruolo])=>{
      const id=s[k];
      if(!id||eligible.some(p=>p.id===id))return null;
      const p=standings.find(x=>x.id===id);
      return p?{ruolo,name:p.name}:null;
    }).filter(Boolean);
  },[board.settings,eligible,standings]);
  /* A selezione avviata i ruoli restano quelli di quando è partita: se uno
     cambia risposta a metà chiamata, capitano e formatore non devono cambiare
     sotto le mani di chi sta scegliendo. */
  const selAvviata=!!(teamSel&&teamSel.phase&&teamSel.phase!=="idle"&&teamSel.capId&&teamSel.pickId);
  const capId=selAvviata?teamSel.capId:ruoliVivi.capId;
  const pickId=selAvviata?teamSel.pickId:ruoliVivi.pickId;
  const {capManual,pickManual}=ruoliVivi;
  const rispostaMia=myPlayerId?((board.callups[matchIso]||{})[myPlayerId]||{}).v:null;
  /* di chi è il turno adesso, per la barra in cima */
  const selPicks=(teamSel&&teamSel.picks)||[];
  const selFase=teamSel&&teamSel.phase;
  const mioTurnoChiamata=selFase==="draft"&&!!myPlayerId&&
    ((selPicks.length%2===0&&myPlayerId===pickId)||(selPicks.length%2===1&&myPlayerId===capId));
  const mioTurnoLato=selFase==="captain"&&!!myPlayerId&&myPlayerId===capId;
  const restantiN=selFase==="draft"?((teamSel.pool||[]).length-selPicks.length-2):0;
  const chiedeCiSei=!!myPlayerId&&!rispostaMia&&players.length>0&&avvisoAperto(board.settings);

  const usaSquadre=useCallback((w,b)=>{setPrefill({white:w,black:b});setTab("match");say("Squadre portate nella registrazione");},[say]);
  const prefillUsato=useCallback(()=>setPrefill(null),[]);

  if(!cfg)return <ConfigScreen pendingInvite={invite} onCfg={(c,code)=>{setCfg(c);setSb(makeClient(c));if(code)setInvite(code);}}/>;
  if(!sb)return(
    <Shell><Card><div style={{fontSize:14,color:C.text,lineHeight:1.7}}>
      Non riesco a caricare la libreria di Supabase: probabilmente sei senza connessione. Riprova quando torni online.
    </div><Btn onClick={()=>location.reload()} full style={{marginTop:14}}>Riprova</Btn></Card></Shell>
  );
  if(booting)return <Shell><div style={{textAlign:"center",color:C.muted,fontSize:13}}>Un attimo…</div></Shell>;
  if(!session)return <AuthGate sb={sb} onReset={isBaked()?null:()=>{localStorage.removeItem(CFG_KEY);setCfg(null);setSb(null);}}/>;
  if(!groupId||!group)return <GroupGate sb={sb} cfg={cfg} groups={groups} say={say} onPick={id=>{setGroupId(id);loadGroups();}} onOut={logout}/>;

  /* finché non dici chi sei, il foglio resta aperto: senza identità la
     selezione squadre non saprebbe di chi è il turno */
  const devePresentarsi=!!(me&&!me.player_id);

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Sans',sans-serif",color:C.text}}>
      <header style={{position:"sticky",top:0,zIndex:100,background:"#090909EE",backdropFilter:"blur(16px)",borderBottom:`1px solid ${C.border}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{background:C.accent,borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>⚽</div>
        <div style={{minWidth:0}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,lineHeight:1.1,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:160}}>{group.name}</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:live?C.green:C.muted}}/>
            <div style={{fontSize:9,color:C.muted,letterSpacing:1}}>{live?"LIVE":"COLLEGO…"}</div>
          </div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:C.accent,lineHeight:1}}>{players.length}</div>
            <div style={{fontSize:9,color:C.muted}}>GIOC.</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:18,color:C.text,lineHeight:1}}>{matches.length}</div>
            <div style={{fontSize:9,color:C.muted}}>PART.</div>
          </div>
          <button onClick={()=>setPanel("account")} title="Account e gruppo"
            style={{background:"none",border:`1px solid ${isAdmin?C.accent:C.border}`,borderRadius:10,padding:2,cursor:"pointer",flexShrink:0}}>
            <Avatar player={playersView.find(p=>p.id===myPlayerId)||{name:email||"?"}} size={30}/>
          </button>
        </div>
      </header>

      {update&&(
        <div style={{background:C.accent,color:"#000",padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:800}}>Nuova versione disponibile</div>
            {update.note&&<div style={{fontSize:11,opacity:.75,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{update.note}</div>}
          </div>
          <button onClick={()=>location.replace(location.pathname+"?v="+encodeURIComponent(update.version))}
            style={{background:"#000",color:C.accent,border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,fontWeight:800,fontFamily:"'DM Sans',sans-serif",cursor:"pointer",flexShrink:0}}>Aggiorna</button>
        </div>
      )}

      {/* Al posto delle notifiche, che un'app così non può mandare: quello che
          aspetta te sta in cima a ogni schermata finché non lo risolvi.
          Uno alla volta, il più urgente. */}
      {mioTurnoChiamata?(
        <div style={{background:C.red+"1A",borderBottom:`1px solid ${C.red}45`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:C.text,fontWeight:800}}>Tocca a te chiamare</div>
            <div style={{fontSize:11,color:C.muted}}>{restantiN} ancora da scegliere</div>
          </div>
          <button onClick={()=>setTab("teams")} style={{padding:"9px 14px",borderRadius:9,border:"none",background:C.red,color:"#fff",fontWeight:800,fontSize:13,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>Scegli →</button>
        </div>
      ):mioTurnoLato?(
        <div style={{background:C.accent+"1A",borderBottom:`1px solid ${C.accent}45`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:C.text,fontWeight:800}}>Le squadre sono pronte</div>
            <div style={{fontSize:11,color:C.muted}}>Scegli con quale giocare</div>
          </div>
          <button onClick={()=>setTab("teams")} style={{padding:"9px 14px",borderRadius:9,border:"none",background:C.accent,color:"#000",fontWeight:800,fontSize:13,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>Scegli →</button>
        </div>
      ):chiedeCiSei?(
        <div style={{background:C.card2,borderBottom:`1px solid ${C.accent}35`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:C.text,fontWeight:700}}>{dataLunga(matchDate)}: ci sei?</div>
            <button onClick={()=>setTab("callup")} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontSize:11,color:C.muted,fontFamily:"'DM Sans',sans-serif"}}>vedi chi ha risposto →</button>
          </div>
          <button onClick={()=>setCallup(myPlayerId,"si",matchIso)} style={{padding:"9px 14px",borderRadius:9,border:"none",background:C.green,color:"#04210F",fontWeight:800,fontSize:13,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>✓ Sì</button>
          <button onClick={()=>setCallup(myPlayerId,"no",matchIso)} style={{padding:"9px 14px",borderRadius:9,border:`2px solid ${C.red}40`,background:"transparent",color:C.red,fontWeight:800,fontSize:13,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}}>✕ No</button>
        </div>
      ):null}

      <nav style={{background:C.card,borderBottom:`1px solid ${C.border}`,display:"flex",overflowX:"auto",padding:"0 2px"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:"1 0 auto",border:"none",background:"none",cursor:"pointer",padding:"10px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,fontFamily:"'DM Sans',sans-serif",borderBottom:`2px solid ${tab===n.id?C.accent:"transparent"}`,transition:"border-color .2s"}}>
            <span style={{fontSize:18}}>{n.icon}</span>
            <span style={{fontSize:9,fontWeight:800,letterSpacing:.8,color:tab===n.id?C.accent:C.muted}}>{n.label}</span>
          </button>
        ))}
      </nav>

      <main style={{maxWidth:700,margin:"0 auto",padding:"22px 14px 100px"}}>
        {tab==="standings"&&<StandingsSection standings={standings} matches={matches} gruppo={group.name} say={say}
                              isAdmin={isAdmin} updatePlayers={updatePlayers} capId={capId} pickId={pickId}/>}
        {tab==="callup"   &&<CallupSection players={playersView} board={board} matchDate={matchDate} members={members} myPlayerId={myPlayerId} say={say}
                              setCallup={(pid,v)=>setCallup(pid,v,matchIso)} setSettings={setSettings}/>}
        {tab==="match"    &&<MatchSection players={playersView} matches={matches} isAdmin={isAdmin} saveMatches={saveMatches}
                              prefill={prefill} onPrefillUsed={prefillUsato}/>}
        {tab==="teams"    &&<TeamsSection standings={standings} teamSel={teamSel} setSel={setSel} myPlayerId={myPlayerId} isAdmin={isAdmin}
                              capId={capId} pickId={pickId} capManual={capManual} pickManual={pickManual} setSettings={setSettings}
                              availableIds={availableIds} eligible={eligible} playAll={!!board.settings.playAll}
                              decaduti={ruoliDecaduti}
                              onUseTeams={isAdmin?usaSquadre:null}
                              onAggiungi={pid=>setCallup(pid,"si",matchIso)}/>}
        {tab==="players"  &&<PlayersSection players={playersView} matches={matches} isAdmin={isAdmin} myPlayerId={myPlayerId}
                              updatePlayers={updatePlayers} setPhoto={setPhoto} removePlayer={removePlayer}/>}
        <div style={{textAlign:"center",fontSize:10,color:"#3A3A3A",marginTop:28,letterSpacing:1}}>v{APP_VERSION}</div>
      </main>

      {(panel==="identity"||devePresentarsi)&&(
        <IdentitySheet players={playersView} mine={myPlayerId} closable={!devePresentarsi}
          onPick={claimPlayer} onNew={claimNew} onClose={()=>setPanel(null)}/>
      )}
      {panel==="account"&&(
        <AccountPanel sb={sb} cfg={cfg} group={group} members={members} me={me} isAdmin={isAdmin}
          players={playersView} email={email} say={say}
          onClose={()=>setPanel(null)} onLogout={logout} onLeave={leaveGroup}
          setRole={setRole} removeMember={removeMember} renameGroup={renameGroup}
          openIdentity={()=>setPanel("identity")} migrate={migrate}/>
      )}

      {toast&&(
        <div style={{position:"fixed",left:"50%",transform:"translateX(-50%)",bottom:"calc(24px + env(safe-area-inset-bottom))",background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 18px",fontSize:13,color:C.text,zIndex:600,boxShadow:"0 8px 30px rgba(0,0,0,.5)",maxWidth:"90vw",textAlign:"center"}}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CialtronApp/>);
</script>
</body>
</html>
