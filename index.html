const {useState,useEffect,useRef,useMemo,useCallback} = React;

const C={accent:"#B8FF00",bg:"#090909",card:"#111",card2:"#1A1A1A",card3:"#222",

/* Versione pubblicata: confrontata con version.json per avvisare che c'è
   un aggiornamento. Sul telefono la pagina resta in cache, senza questo
   controllo le modifiche non arriverebbero finché non si svuota la cache. */
const APP_VERSION="2026-09-15.12";

function useUpdateCheck(){
  const [next,setNext]=useState(null);
  useEffect(()=>{
    let dead=false;
    const check=async()=>{
      try{
        const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});
        if(!r.ok)return;
        const d=await r.json();
        if(!dead&&d&&d.version&&d.version!==APP_VERSION)setNext(d);
      }catch(e){/* offline o aperto come file locale: nessun avviso */}
    };
    check();
    const id=setInterval(check,5*60*1000);
    const onVis=()=>{if(document.visibilityState==="visible")check();};
    document.addEventListener("visibilitychange",onVis);
    return()=>{dead=true;clearInterval(id);document.removeEventListener("visibilitychange",onVis);};
  },[]);
  return next;
}
/* ═══════════════════════════════════════════════════════
   SUPABASE — configurazione del progetto, client, invito
═══════════════════════════════════════════════════════ */
const CFG_KEY="cialtron_cfg", GROUP_KEY="cialtron_group", INV_KEY="cialtron_invite";

/* ─── Il progetto Supabase del gruppo ───
   Sono scritti qui apposta: chi riceve il link apre e si fa l'account, senza
   incollare indirizzi né chiavi. La chiave anon è nata per stare dentro il
   browser — da sola non apre niente, sono le policy del database a decidere
   chi vede cosa. La service_role non va MAI messa qui.
   Se restano vuoti, l'app torna a chiederli al primo avvio. */
const BAKED_CFG={
  url:"https://ctyfnvamilfrpxmhhuft.supabase.co",
  key:"sb_publishable_n5hKvbGGqO_VjUHg0C9yDQ_G2emAe10",
};
const isBaked=()=>!!(BAKED_CFG.url&&BAKED_CFG.key);

const loadCfg=()=>{
  /* Il progetto scritto nell'app vince sempre: quello eventualmente digitato a
     mano in passato è un residuo, e senza questa precedenza chi avesse
     sbagliato a incollarlo resterebbe bloccato senza un modo per rimediare. */
  if(isBaked())return{url:BAKED_CFG.url,key:BAKED_CFG.key};
  try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");if(c&&c.url&&c.key)return c;}catch(e){}
  return null;
};
const saveCfg=c=>{try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}};

function makeClient(cfg){
  if(!cfg||!cfg.url||!cfg.key||typeof supabase==="undefined")return null;
  try{
    return supabase.createClient(cfg.url,cfg.key,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
  }catch(e){return null;}
}

/* Il codice invito si porta dietro l'indirizzo del progetto: chi lo riceve non
   deve configurare niente a mano, gli basta il codice (o il link). */
/* Quando il progetto è già scritto nell'app il codice basta da solo, e il link
   resta corto. L'aggancio in coda serve solo se l'app non sa a quale database
   collegarsi: chi lo riceve se lo porta dietro dall'invito. */
const packInvite=(code,cfg)=>{
  if(isBaked())return code;
  try{return code+"~"+btoa(cfg.url+"|"+cfg.key);}catch(e){return code;}
};
function unpackInvite(raw){
  const s=String(raw||"").trim();
  const i=s.indexOf("~");
  if(i<0)return{code:s.toLowerCase(),cfg:null};
  let cfg=null;
  try{const p=atob(s.slice(i+1)).split("|");if(p[0]&&p[1])cfg={url:p[0],key:p[1]};}catch(e){}
  return{code:s.slice(0,i).toLowerCase(),cfg};
}
const inviteLink=(code,cfg)=>location.origin+location.pathname+"#join="+encodeURIComponent(packInvite(code,cfg));

/* Lettura del vecchio database Firebase: serve solo alla migrazione una tantum. */
const fbFetch=async(dbUrl,path="")=>{
  try{
    const r=await fetch(`${String(dbUrl).replace(/\/+$/,"")}${path?"/"+path:""}.json`,{cache:"no-store"});
    return r.ok?{ok:true,data:await r.json()}:{ok:false,data:null};
  }catch(e){return{ok:false,data:null};}
};

const errText=e=>{
  const m=(e&&(e.message||e.error_description||e.error))||"";
  if(/Invalid login credentials/i.test(m))return "Email o password sbagliate";
  if(/Email not confirmed/i.test(m))return "Devi confermare l'email, oppure disattiva la conferma in Supabase";
  if(/User already registered/i.test(m))return "Esiste già un account con questa email: usa Entra";
  if(/Password should be at least/i.test(m))return "La password deve avere almeno 6 caratteri";
  if(/rate limit|too many/i.test(m))return "Troppi tentativi ravvicinati, aspetta un minuto";
  if(/row-level security/i.test(m))return "Il database ha rifiutato l'operazione: non hai i permessi per farla";
  if(/relation .* does not exist|schema cache/i.test(m))return "Le tabelle non ci sono: incolla supabase.sql nel SQL Editor di Supabase e premi Run";
  return m||"Errore imprevisto";
};

const uid = () => Math.random().toString(36).slice(2,11);
const norm = s => String(s??"").trim().toLowerCase();
function resizePhoto(file, maxPx=160){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>maxPx){h=h*maxPx/w;w=maxPx;} if(h>maxPx){w=w*maxPx/h;h=maxPx;}
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.65));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);}; img.src=url;
  });
}

/* Le statistiche non sono memorizzate: si ricalcolano dalle partite.
   `base` è la parte manuale — storico importato da Excel o correzione con ✏️ —
   e si SOMMA al calcolo, così le partite registrate dopo continuano a contare. */
const FIELDS=["presences","wins","goals","mvps"];
const ZERO={presences:0,wins:0,goals:0,mvps:0};

function computeStats(player, matches){
  let aP=0,aW=0,aG=0,aM=0,aN=0;
  for(const m of(matches||[])){
    const iW=(m.white||[]).includes(player.id), iB=(m.black||[]).includes(player.id);
    if(iW||iB){
      aP++;
      if((m.winner==="white"&&iW)||(m.winner==="black"&&iB))aW++;
      else if(m.winner==="draw")aN++;   // vecchie registrazioni: ora il pari non si può più salvare
    }
    if(m.mvp===player.id)aM++; aG+=m.goals?.[player.id]||0;
  }
  const auto={presences:aP,wins:aW,goals:aG,mvps:aM};
  const b=player.base||{}, base={}, tot={};
  for(const f of FIELDS){base[f]=+b[f]||0; tot[f]=Math.max(0,auto[f]+base[f]);}
  /* 3 a chi vince, e basta: qui il pareggio non esiste, si gioca finché non
     vince qualcuno. Se in archivio è rimasta una partita chiusa in pari conta
     come presenza e nient'altro — la schermata Partite la segnala. */
  const points=tot.wins*3;
  return{...tot,draws:aN,points,avg:tot.presences>0?points/tot.presences:0,auto,base};
}

/* dai totali mostrati a schermo alla base da salvare (null = tutto automatico) */
/* Tre classifiche dagli stessi numeri: generale a media punti, marcatori a
   gol, MVP a premi. A parità si scende di criterio e in fondo c'è il nome, se
   no l'ordine balla da solo a ogni ricalcolo. */
const VISTE=[{k:"generale", lab:"GENERALE", campo:"avg",   etichetta:"media",
              sub:"3 punti per vittoria · media = punti ÷ presenze", vuoto:null},
             {k:"marcatori",lab:"MARCATORI",campo:"goals", etichetta:"gol",
              sub:"Chi ha segnato di più", vuoto:"Nessun gol registrato per ora."},
             {k:"mvp",      lab:"MVP",      campo:"mvps",  etichetta:"mvp",
              sub:"Chi è stato eletto migliore più volte", vuoto:"Nessun MVP assegnato per ora."}];
const vistaDi=k=>VISTE.find(v=>v.k===k)||VISTE[0];
function ordinaPer(standings,vista){
  const l=(standings||[]).slice();
  const nome=(a,b)=>String(a.name||"").localeCompare(String(b.name||""));
  if(vista==="marcatori")l.sort((a,b)=>b.stats.goals-a.stats.goals||b.stats.avg-a.stats.avg||nome(a,b));
  else if(vista==="mvp") l.sort((a,b)=>b.stats.mvps -a.stats.mvps ||b.stats.avg-a.stats.avg||nome(a,b));
  else                   l.sort((a,b)=>b.stats.avg  -a.stats.avg  ||b.stats.points-a.stats.points||nome(a,b));
  return l;
}

function baseFromTotals(totals, auto){
  const base={}; let manual=false;
  for(const f of FIELDS){
    const d=Math.max(0,Math.round(+totals[f]||0))-auto[f];
    if(d!==0){base[f]=d; manual=true;}
  }
  return manual?base:null;
}

/* ─── foto: tabella a parte, con cache locale ───
   Nel database stanno in photos(group_id,player_id): non entrano nel documento
   del gruppo, così ogni aggiornamento della classifica non se le trascina dietro.
   Qui restano in cache e si riscaricano solo quando cambia il loro rev. */
const PH_DATA=(g,id)=>"cia-photo-"+g+"-"+id, PH_REV=(g,id)=>"cia-photorev-"+g+"-"+id;

function readPhotoCache(g){
  const m={};if(!g)return m;
  const pre="cia-photo-"+g+"-";
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith(pre))m[k.slice(pre.length)]=localStorage.getItem(k);
    }
  }catch(e){}
  return m;
}
function writePhotoCache(g,id,b64,rev){
  try{
    if(b64)localStorage.setItem(PH_DATA(g,id),b64);else localStorage.removeItem(PH_DATA(g,id));
    localStorage.setItem(PH_REV(g,id),String(rev||""));
  }catch(e){}
}
function dropPhotoCache(g,id){
  try{localStorage.removeItem(PH_DATA(g,id));localStorage.removeItem(PH_REV(g,id));}catch(e){}
}

/* ─── import Excel: intestazioni accettate per ogni colonna ─── */
const COLS={
  name:["nome","giocatore","player","cognome"],
  presences:["presenze","presenza","partite","p"],
  wins:["vittorie","vinte","vittoria","win","wins","v"],
  goals:["gol","gols","goal","goals","reti"],
  mvps:["mvp","mvps","migliore","best"],
};
function readRow(row){
  const out={};
  for(const k of Object.keys(row)){
    const kk=norm(k);
    for(const f of Object.keys(COLS)) if(COLS[f].includes(kk)) out[f]=row[k];
  }
  return out;
}

function ConfigScreen({onCfg,pendingInvite}){
  const [mode,setMode]=useState(pendingInvite?"code":null);
  const [url,setUrl]=useState(""), [key,setKey]=useState(""), [code,setCode]=useState(pendingInvite||"");
  const [err,setErr]=useState("");

  const fromCode=()=>{
    const {cfg}=unpackInvite(code);
    if(!cfg){setErr("Questo codice non contiene l'indirizzo del gruppo. Fattene mandare uno nuovo, o configura il progetto a mano.");return;}
    saveCfg(cfg);onCfg(cfg,unpackInvite(code).code);
  };
  const manual=()=>{
    const u=url.trim().replace(/\/+$/,""), k=key.trim();
    if(!/^https:\/\/.+\.supabase\.co$/.test(u)){setErr("L'indirizzo deve essere tipo https://xxxxx.supabase.co");return;}
    if(k.length<30){setErr("La chiave anon sembra incompleta");return;}
    const cfg={url:u,key:k};saveCfg(cfg);onCfg(cfg,null);
  };

  if(!mode)return(
    <Shell>
      <Card>
        <div style={{fontSize:14,color:C.text,lineHeight:1.6,marginBottom:16}}>
          Ogni giocatore ha il suo account. Il primo che arriva crea il gruppo, gli altri entrano con un codice invito.

      </Card>
    </Shell>
  );

  if(mode==="code")return(
    <Shell>
      <Card title="IL CODICE CHE TI HANNO MANDATO">
        <div style={{fontSize:13,color:C.muted,marginBottom:12,lineHeight:1.6}}>
          Incolla il codice ricevuto. Contiene già tutto: non devi configurare niente.
        </div>
        <Input label="CODICE INVITO" value={code} onChange={v=>{setCode(v);setErr("");}} placeholder="a1b2c3d4~…"/>
        <Err>{err}</Err>
        <Btn onClick={fromCode} disabled={!code.trim()} full style={{padding:"14px 0",fontSize:15,borderRadius:12}}>Continua</Btn>
        <Btn onClick={()=>{setMode(null);setErr("");}} variant="ghost" full style={{marginTop:8}}>Indietro</Btn>
      </Card>
    </Shell>
  );

  return(
    <Shell>
      <Card title="IL DATABASE DEL GRUPPO">
        <div style={{fontSize:13,color:C.muted,lineHeight:1.8,marginBottom:14}}>
          1. Vai su <strong style={{color:C.text}}>supabase.com</strong> → accedi → <strong style={{color:C.text}}>New project</strong><br/>
          2. Aperto il progetto: <strong style={{color:C.text}}>SQL Editor</strong> → incolla il contenuto di <code style={{color:C.accent}}>supabase.sql</code> → <strong style={{color:C.text}}>Run</strong><br/>
          3. <strong style={{color:C.text}}>Authentication → Sign In / Providers → Email</strong>: togli <em>Confirm email</em>, così si entra subito<br/>
          4. <strong style={{color:C.text}}>Project Settings → API</strong>: copia qui sotto i due valori
        </div>
        <Input label="PROJECT URL" value={url} onChange={v=>{setUrl(v);setErr("");}} placeholder="https://xxxxx.supabase.co"/>
        <Input label="CHIAVE ANON (publishable)" value={key} onChange={v=>{setKey(v);setErr("");}} placeholder="eyJhbGciOi…"/>
        <Err>{err}</Err>

        </div>

    </Shell>
  );
}

/* ═══════════════════════════════════════════════════════
   SCHERMATA 2 — il tuo account
═══════════════════════════════════════════════════════ */
function AuthGate({sb,onReset}){
  const [email,setEmail]=useState(""), [pass,setPass]=useState("");
  const [busy,setBusy]=useState(false), [err,setErr]=useState(""), [msg,setMsg]=useState("");

  const run=async fn=>{setBusy(true);setErr("");setMsg("");try{await fn();}catch(e){setErr(errText(e));}setBusy(false);};
  const entra=()=>run(async()=>{
    const{error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error)throw error;
  });
  const crea=()=>run(async()=>{
    if(pass.length<6)throw new Error("Password should be at least 6");
    const{data,error}=await sb.auth.signUp({email:email.trim(),password:pass});
    if(error)throw error;
    if(!data.session)setMsg("Account creato. Se non entri subito, in Supabase → Authentication → Email togli \"Confirm email\", poi riprova con Entra.");
  });
  const scordata=()=>run(async()=>{
    if(!email.trim())throw new Error("Scrivi prima la tua email qui sopra");
    const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
    if(error)throw error;
    setMsg("Ti ho mandato un'email per rifare la password.");
  });

  return(
    <Shell>
      <Card title="ENTRA CON IL TUO ACCOUNT">
        <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>
          Serve per sapere chi sei nel gruppo: le tue partite, la tua foto, e per la selezione squadre.
        </div>
        <Input label="EMAIL" value={email} onChange={v=>{setEmail(v);setErr("");}} placeholder="tu@esempio.it"/>
        <Input label="PASSWORD" type="password" value={pass} onChange={v=>{setPass(v);setErr("");}} placeholder="••••••"/>
        <Err>{err}</Err>
        {msg&&<div style={{background:C.green+"15",border:`1px solid ${C.green}40`,borderRadius:10,padding:12,marginBottom:12,fontSize:13,color:C.green,lineHeight:1.5}}>{msg}</div>}
        <div style={{display:"flex",gap:8}}>
          <Btn onClick={crea} variant="ghost" disabled={busy||!email||!pass} style={{flex:1}}>Crea account</Btn>
          <Btn onClick={entra} disabled={busy||!email||!pass} style={{flex:1}}>{busy?"…":"Entra"}</Btn>
        </div>
        <button onClick={scordata} disabled={busy} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:12,marginTop:14,width:"100%",fontFamily:"'DM Sans',sans-serif"}}>Password dimenticata?</button>
      </Card>
      {onReset&&<button onClick={onReset} style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontSize:11,width:"100%",fontFamily:"'DM Sans',sans-serif"}}>Cambia database</button>}
    </Shell>
  );
}

/* ═══════════════════════════════════════════════════════
   SCHERMATA 3 — quale gruppo
═══════════════════════════════════════════════════════ */
function GroupGate({sb,groups,onPick,onOut,cfg,say}){
  const [name,setName]=useState(""), [code,setCode]=useState(""), [busy,setBusy]=useState(false), [err,setErr]=useState("");

  const crea=async()=>{
    if(!name.trim())return;
    setBusy(true);setErr("");
    const{data:u}=await sb.auth.getUser();
    const{data,error}=await sb.from('groups').insert({owner:u.user.id,name:name.trim()}).select().single();
    setBusy(false);
    if(error){setErr(errText(error));return;}
    onPick(data.id);
  };
  const entra=async()=>{
    const {code:c,cfg:c2}=unpackInvite(code);
    if(!c){setErr("Incolla il codice");return;}
    if(c2&&cfg&&c2.url!==cfg.url){setErr("Questo codice è di un altro database. Tocca 'Cambia database' e riparti da lì.");return;}
    setBusy(true);setErr("");
    const{data,error}=await sb.rpc('join_group',{p_code:c});
    setBusy(false);
    if(error){setErr(/codice non valido/i.test(error.message)?"Codice non valido":errText(error));return;}
    say("Sei dentro");onPick(data);
  };

  return(
    <Shell>
      {groups.length>0&&(
        <Card title="I TUOI GRUPPI">
          {groups.map(g=>(
            <button key={g.id} onClick={()=>onPick(g.id)} style={{width:"100%",textAlign:"left",background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"13px 15px",marginBottom:8,cursor:"pointer",color:C.text,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:15}}>{g.name}</button>
          ))}
        </Card>
      )}
      <Card title="CREA UN GRUPPO">
        <Input label="COME SI CHIAMA" value={name} onChange={v=>{setName(v);setErr("");}} placeholder="Calcetto del giovedì"/>
        <Btn onClick={crea} disabled={busy||!name.trim()} full>Crea</Btn>
      </Card>
      <Card title="OPPURE ENTRA CON UN CODICE">
        <Input label="CODICE INVITO" value={code} onChange={v=>{setCode(v);setErr("");}} placeholder="a1b2c3d4"/>
        <Btn onClick={entra} variant="dark" disabled={busy||!code.trim()} full>Entra nel gruppo</Btn>
      </Card>
      <Err>{err}</Err>
      <button onClick={onOut} style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:11,width:"100%",fontFamily:"'DM Sans',sans-serif"}}>Esci dall'account</button>
    </Shell>
  );
}

/* ═══════════════════════════════════════════════════════
   MIGRAZIONE — porta dentro rosa, partite e foto da Firebase
═══════════════════════════════════════════════════════ */
function MigratePanel({onClose,migrate,players}){
  const [url,setUrl]=useState(()=>localStorage.getItem("cia-db-url")||"");
  const [scan,setScan]=useState(null), [busy,setBusy]=useState(false), [err,setErr]=useState(""), [done,setDone]=useState(null);

  const guarda=async()=>{
    setBusy(true);setErr("");setScan(null);
    const u=url.trim().replace(/\/+$/,"");
    const [pl,mt,ph]=await Promise.all([fbFetch(u,"players"),fbFetch(u,"matches"),fbFetch(u,"photos")]);
    setBusy(false);
    if(!pl.ok){setErr("Non riesco a leggere quel database. Controlla l'indirizzo e che le regole permettano la lettura.");return;}
    const P=(Array.isArray(pl.data)?pl.data:[]).filter(Boolean);
    const M=(Array.isArray(mt.data)?mt.data:[]).filter(Boolean);
    const F=ph.data||{};
    const conFoto=P.filter(p=>F[p.id]||p.photo).length;
    if(!P.length&&!M.length){setErr("Quel database è vuoto: non c'è niente da importare.");return;}
    setScan({url:u,players:P,matches:M,photos:F,conFoto});
  };

  const vai=async()=>{
    setBusy(true);setErr("");
    try{ const r=await migrate(scan); setDone(r); }
    catch(e){ setErr(errText(e)); }
    setBusy(false);
  };

  if(done)return(
    <Panel title="IMPORTATO" onClose={onClose}>
      <div style={{textAlign:"center",padding:"20px 0"}}>
        <div style={{fontSize:44,marginBottom:12}}>✅</div>
        <div style={{fontSize:14,color:C.text,lineHeight:1.7}}>
          <strong style={{color:C.accent}}>{done.players}</strong> giocatori, <strong style={{color:C.accent}}>{done.matches}</strong> partite
          {done.photos>0&&<> e <strong style={{color:C.accent}}>{done.photos}</strong> foto</> } sono nel gruppo.
        </div>
      </div>
      <Btn onClick={onClose} full>Chiudi</Btn>
    </Panel>
  );

  return(
    <Panel title="IMPORTA DA FIREBASE" onClose={onClose}>
      <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>
        Legge rosa, partite e foto dal database che l'app usava prima e li porta dentro questo gruppo. Il vecchio database non viene toccato.
      </div>
      <Input label="INDIRIZZO DEL VECCHIO DATABASE" value={url} onChange={v=>{setUrl(v);setScan(null);setErr("");}} placeholder="https://xxx-default-rtdb.firebaseio.com"/>
      <Err>{err}</Err>
      {!scan
        ?<Btn onClick={guarda} disabled={busy||!url.trim()} full>{busy?"Leggo…":"Guarda cosa c'è dentro"}</Btn>
        :<>
          <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:14,marginBottom:12}}>
            <div style={{fontSize:13,color:C.text,lineHeight:1.8}}>
              Trovati <strong style={{color:C.accent}}>{scan.players.length}</strong> giocatori,
              {" "}<strong style={{color:C.accent}}>{scan.matches.length}</strong> partite,
              {" "}<strong style={{color:C.accent}}>{scan.conFoto}</strong> foto.
            </div>
            {players.length>0&&<div style={{fontSize:12,color:C.red,marginTop:8,lineHeight:1.5}}>Attenzione: la rosa di questo gruppo verrà sostituita da quella importata.</div>}
          </div>
          <Btn onClick={vai} disabled={busy} full>{busy?"Importo…":"Importa"}</Btn>
        </>
      }
      <Btn onClick={onClose} variant="ghost" full style={{marginTop:8}}>Annulla</Btn>
    </Panel>
  );
}

/* Sotto i 460px le colonne fisse non lascerebbero spazio al nome:
   sul telefono le statistiche vanno su una riga sotto il nome. */
function useNarrow(bp=460){
  const [n,setN]=useState(()=>typeof window!=="undefined"&&window.innerWidth<bp);
  useEffect(()=>{
    const h=()=>setN(window.innerWidth<bp);
    window.addEventListener("resize",h); window.addEventListener("orientationchange",h);
    return()=>{window.removeEventListener("resize",h);window.removeEventListener("orientationchange",h);};
  },[bp]);
  return n;
}

const SHORT={presences:"P",wins:"V",goals:"GOL",mvps:"MVP"};

/* ═══════════════════════════════════════════════════════
   CLASSIFICA IN PDF — un foglio da mandare nel gruppo
   La libreria si scarica solo quando si preme il tasto: è pesante e
   serve una volta ogni tanto, non ha senso farla pagare a ogni apertura.
═══════════════════════════════════════════════════════ */
const JSPDF_SRC="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
let jspdfPromise=null;
function loadJsPDF(){
  const pronto=()=>window.jspdf&&window.jspdf.jsPDF;
  if(pronto())return Promise.resolve(pronto());
  if(!jspdfPromise)jspdfPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=JSPDF_SRC; s.async=true;
    s.onload=()=>pronto()?res(pronto()):rej(new Error("libreria"));
    s.onerror=()=>{jspdfPromise=null;rej(new Error("rete"));};
    document.head.appendChild(s);
  });
  return jspdfPromise;
}

const rgb=h=>{const n=parseInt(String(h).replace("#",""),16);return[(n>>16)&255,(n>>8)&255,n&255];};
/* niente trasparenze nel PDF: i veli dell'app si rifanno mescolando i colori */
const velo=(sopra,sotto,a)=>{const A=rgb(sopra),B=rgb(sotto);return A.map((v,i)=>Math.round(v*a+B[i]*(1-a)));};
const P_BG="#090909",P_CARD="#111111",P_CARD2="#1A1A1A",P_BORD="#242424",
      P_TXT="#F2F2F2",P_MUT="#7A7A7A",P_ACC="#B8FF00",P_RED="#FF4444";
const COLS_AV=["#FF6B6B","#4ECDC4","#45B7D1","#A78BFA","#F59E0B","#34D399","#F472B6","#60A5FA"];
const colorePer=nome=>COLS_AV[(String(nome||"?").charCodeAt(0)||0)%COLS_AV.length];

/* la foto ritagliata tonda: il PDF non sa fare le maschere, la facciamo qui */
function fotoTonda(src,px){
  return new Promise(res=>{
    if(!src)return res(null);
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement("canvas");c.width=c.height=px||220;
        const x=c.getContext("2d"),d=c.width;
        x.beginPath();x.arc(d/2,d/2,d/2,0,Math.PI*2);x.closePath();x.clip();
        const r=Math.max(d/img.width,d/img.height),w=img.width*r,h=img.height*r;
        x.drawImage(img,(d-w)/2,(d-h)/2,w,h);
        res(c.toDataURL("image/png"));
      }catch(e){res(null);}
    };
    img.onerror=()=>res(null);
    img.src=src;
  });
}

function pdfClassifica(jsPDF,{standings:rosa,matches,gruppo,foto}){
  const standings=ordinaPer(rosa,"generale");
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const M=14,R=196,W=210,H=297;
  const set=(f,c)=>{doc.setFont("helvetica",f);doc.setTextColor.apply(doc,rgb(c));};
  const fill=c=>doc.setFillColor.apply(doc,Array.isArray(c)?c:rgb(c));
  const draw=c=>doc.setDrawColor.apply(doc,Array.isArray(c)?c:rgb(c));
  const taglia=(t,max)=>{let s=String(t||"");if(doc.getTextWidth(s)<=max)return s;
    while(s.length>1&&doc.getTextWidth(s+"…")>max)s=s.slice(0,-1);return s+"…";};
  const sfondo=()=>{fill(P_BG);doc.rect(0,0,W,H,"F");};

  /* il tondo con l'iniziale, per chi non ha messo la foto */
  const tondo=(cx,cy,r,p)=>{
    const f=foto[p.id];
    if(f){doc.addImage(f,"PNG",cx-r,cy-r,r*2,r*2);return;}
    const col=colorePer(p.name);
    fill(velo(col,P_CARD,.16));draw(velo(col,P_CARD,.42));doc.setLineWidth(.4);
    doc.circle(cx,cy,r,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(r*2.6);
    doc.setTextColor.apply(doc,rgb(col));
    doc.text(String(p.name||"?")[0].toUpperCase(),cx,cy+r*.52,{align:"center"});
  };

  const oggi=new Date();
  const dataLunga=oggi.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  const piede=()=>{
    draw(P_BORD);doc.setLineWidth(.2);doc.line(M,283,R,283);
    set("normal",P_MUT);doc.setFontSize(7);
    doc.text("CialtronApp · "+taglia(gruppo,90)+" · "+dataLunga,M,288);
  };
  const nuovaPagina=()=>{piede();doc.addPage();sfondo();
    set("bold",P_TXT);doc.setFontSize(11);doc.setCharSpace(1.5);
    doc.text("CLASSIFICA",M,22);doc.setCharSpace(0);
    set("normal",P_MUT);doc.setFontSize(8);
    doc.text(taglia(String(gruppo||"").toUpperCase(),80),R,22,{align:"right"});
    draw(P_BORD);doc.setLineWidth(.2);doc.line(M,26,R,26);
    return 34;
  };

  /* ── testata ── */
  sfondo();
  fill(P_ACC);doc.roundedRect(M,15,3,15,1.4,1.4,"F");
  set("normal",P_MUT);doc.setFontSize(8);doc.setCharSpace(.7);
  doc.text(taglia(String(gruppo||"IL GRUPPO").toUpperCase(),110),M+7,19.5);
  doc.setCharSpace(2);set("bold",P_TXT);doc.setFontSize(23);
  doc.text("CLASSIFICA",M+7,29.5);doc.setCharSpace(0);
  set("normal",P_MUT);doc.setFontSize(8);
  doc.text(dataLunga,R,19.5,{align:"right"});
  const plur=(n,uno,tanti)=>n+" "+(n===1?uno:tanti);
  doc.text(plur(standings.length,"giocatore","giocatori")+" · "+plur((matches||[]).length,"partita","partite"),R,25,{align:"right"});
  draw(P_BORD);doc.setLineWidth(.2);doc.line(M,35,R,35);

  /* ── il podio ── */
  let y=43;
  if(standings.length>=3){
    const w=(R-M-12)/3,h=52;
    standings.slice(0,3).forEach((p,i)=>{
      const x=M+i*(w+6),primo=i===0;
      fill(primo?velo(P_ACC,P_CARD,.07):P_CARD);
      draw(primo?velo(P_ACC,P_BG,.35):P_BORD);doc.setLineWidth(.4);
      doc.roundedRect(x,y,w,h,3,3,"FD");
      set("bold",primo?P_ACC:P_MUT);doc.setFontSize(9);
      doc.text(["1°","2°","3°"][i],x+5,y+8);
      tondo(x+w/2,y+19,11,p);
      set("bold",P_TXT);doc.setFontSize(10.5);
      doc.text(taglia(p.name,w-8),x+w/2,y+37,{align:"center"});
      set("bold",primo?P_ACC:P_TXT);doc.setFontSize(17);
      doc.text(p.stats.avg.toFixed(2),x+w/2,y+46,{align:"center"});
      set("normal",P_MUT);doc.setFontSize(6.5);doc.setCharSpace(.6);
      doc.text("MEDIA",x+w/2,y+50,{align:"center"});doc.setCharSpace(0);
    });
    y+=h+10;
  }

  /* ── la tabella ── */
  const CX={P:133,V:145,GOL:157,MVP:170,MEDIA:187};
  const testata=yy=>{
    set("bold",P_MUT);doc.setFontSize(7);doc.setCharSpace(.5);
    doc.text("#",20,yy,{align:"center"});
    doc.text("GIOCATORE",37,yy);
    Object.keys(CX).forEach(k=>doc.text(k,CX[k],yy,{align:"center"}));
    doc.setCharSpace(0);
  };
  testata(y);y+=4;

  const manuale=standings.some(p=>FIELDS.some(f=>p.stats.base[f]!==0));
  standings.forEach((p,i)=>{
    if(y>272){y=nuovaPagina();testata(y);y+=4;}
    const s=p.stats,primo=i===0,ultimo=i===standings.length-1&&standings.length>1;
    fill(primo?velo(P_ACC,P_CARD,.08):ultimo?velo(P_RED,P_CARD,.06):P_CARD);
    draw(primo?velo(P_ACC,P_BG,.3):P_BORD);doc.setLineWidth(.3);
    doc.roundedRect(M,y,R-M,10,2.5,2.5,"FD");
    set("bold",primo?P_ACC:P_MUT);doc.setFontSize(9);
    doc.text(String(i+1),20,y+6.6,{align:"center"});
    tondo(30,y+5,3.6,p);
    set("bold",P_TXT);doc.setFontSize(10);
    doc.text(taglia(p.name,88),37,y+6.6);
    set("normal",P_TXT);doc.setFontSize(9.5);
    [["P","presences"],["V","wins"],["GOL","goals"],["MVP","mvps"]].forEach(([k,f])=>{
      doc.text(String(s[f])+(s.base[f]!==0?"*":""),CX[k],y+6.6,{align:"center"});
    });
    set("bold",P_ACC);doc.setFontSize(11);
    doc.text(s.avg.toFixed(2),CX.MEDIA,y+6.6,{align:"center"});
    y+=11;
  });

  /* ── i numeri della stagione ── */
  const golTot=standings.reduce((n,p)=>n+p.stats.goals,0);
  const meglio=f=>standings.slice().sort((a,b)=>b.stats[f]-a.stats[f])[0];
  const bomber=meglio("goals"),stella=meglio("mvps");
  if(y>232){y=nuovaPagina();}
  y+=6;
  set("bold",P_MUT);doc.setFontSize(7);doc.setCharSpace(.8);
  doc.text("IN NUMERI",M,y);doc.setCharSpace(0);
  y+=3;
  const bw=(R-M-15)/4;
  [["PARTITE",String((matches||[]).length),"registrate"],
   ["GOL",String(golTot),"segnati in tutto"],
   ["MIGLIOR MARCATORE",bomber&&bomber.stats.goals>0?String(bomber.stats.goals):"—",bomber&&bomber.stats.goals>0?bomber.name:"nessun gol ancora"],
   ["PIÙ MVP",stella&&stella.stats.mvps>0?String(stella.stats.mvps):"—",stella&&stella.stats.mvps>0?stella.name:"nessun MVP ancora"]
  ].forEach(([lab,val,sub],i)=>{
    const x=M+i*(bw+5);
    fill(P_CARD2);draw(P_BORD);doc.setLineWidth(.3);
    doc.roundedRect(x,y,bw,23,2.5,2.5,"FD");
    set("normal",P_MUT);doc.setFontSize(6.2);
    doc.text(taglia(lab,bw-6),x+4,y+6);
    set("bold",P_ACC);doc.setFontSize(15);
    doc.text(val,x+4,y+15);
    set("normal",P_MUT);doc.setFontSize(6.8);
    doc.text(taglia(sub,bw-6),x+4,y+20);
  });
  y+=30;

  set("normal",P_MUT);doc.setFontSize(7.5);
  doc.text("3 punti per vittoria · media = punti ÷ presenze · il pareggio non esiste",W/2,y,{align:"center"});
  if(manuale)doc.text("* valore corretto a mano sopra il calcolo delle partite",W/2,y+4.5,{align:"center"});

  /* ── le altre due classifiche, una per colonna ── */
  const classifichina=(x,y0,w,titolo,sub,campo,righe)=>{
    set("bold",P_ACC);doc.setFontSize(11);doc.setCharSpace(1.4);
    doc.text(titolo,x,y0);doc.setCharSpace(0);
    set("normal",P_MUT);doc.setFontSize(7);
    doc.text(sub,x,y0+4.6);
    let yy=y0+9;
    if(!righe.length){
      fill(P_CARD);draw(P_BORD);doc.setLineWidth(.3);
      doc.roundedRect(x,yy,w,13,2.5,2.5,"FD");
      set("normal",P_MUT);doc.setFontSize(8);
      doc.text("Ancora nessuno",x+w/2,yy+7.8,{align:"center"});
      return;
    }
    righe.forEach((p,i)=>{
      const primo=i===0;
      fill(primo?velo(P_ACC,P_CARD,.08):P_CARD);
      draw(primo?velo(P_ACC,P_BG,.3):P_BORD);doc.setLineWidth(.3);
      doc.roundedRect(x,yy,w,9.5,2.2,2.2,"FD");
      set("bold",primo?P_ACC:P_MUT);doc.setFontSize(8);
      doc.text(String(i+1),x+5,yy+6.3,{align:"center"});
      tondo(x+14,yy+4.75,3.2,p);
      set("bold",P_TXT);doc.setFontSize(9.5);
      doc.text(taglia(p.name,w-40),x+19.5,yy+6.3);
      set("bold",primo?P_ACC:P_TXT);doc.setFontSize(12);
      doc.text(String(p.stats[campo]),x+w-5,yy+6.3,{align:"right"});
      yy+=10.5;
    });
  };
  const top=(vista,campo)=>ordinaPer(standings,vista).filter(p=>p.stats[campo]>0).slice(0,15);
  const gol=top("marcatori","goals"),mvp=top("mvp","mvps");
  /* se il foglio ha ancora spazio restano qui: un gruppo piccolo merita una
     pagina sola, non due mezze vuote */
  const serve=13+Math.max(gol.length,mvp.length,1)*10.5;
  const y3=(y+14+serve<276)?(y+10):nuovaPagina();
  const cw=(R-M-10)/2;
  classifichina(M,      y3+4,cw,"MARCATORI","Chi ha segnato di più","goals",top("marcatori","goals"));
  classifichina(M+cw+10,y3+4,cw,"MVP","Chi è stato eletto migliore più volte","mvps",top("mvp","mvps"));
  piede();

  /* numerazione: quante pagine sono si sa solo alla fine */
  const n=doc.getNumberOfPages();
  if(n>1)for(let i=1;i<=n;i++){
    doc.setPage(i);
    set("normal",P_MUT);doc.setFontSize(7);
    doc.text("pagina "+i+" di "+n,R,288,{align:"right"});
  }
  return doc;
}

async function esportaClassifica(standings,matches,gruppo){
  const jsPDF=await loadJsPDF();
  const foto={};
  for(const p of standings){const t=await fotoTonda(p.photo,220);if(t)foto[p.id]=t;}
  const doc=pdfClassifica(jsPDF,{standings,matches,gruppo,foto});
  const slug=String(gruppo||"gruppo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"gruppo";
  const nome="classifica-"+slug+"-"+isoDate(new Date())+".pdf";
  const blob=doc.output("blob");
  /* sul telefono la cosa utile è mandarla nel gruppo, non salvarla nei file */
  try{
    const file=new File([blob],nome,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Classifica "+gruppo});
      return "condivisa";
    }
  }catch(e){ if(e&&e.name==="AbortError")return "annullata"; }
  doc.save(nome);
  return "salvata";
}

function StandingsSection({standings,matches,gruppo,isAdmin,updatePlayers,capId,pickId,say}){

  const [vista,setVista]=useState("generale");

  const lista=useMemo(()=>ordinaPer(standings,vista),[standings,vista]);
  const tuttiZero=vista!=="generale"&&lista.every(p=>p.stats[V.campo]===0);
  const narrow=useNarrow();

  /* salva solo lo scarto rispetto al calcolo: i campi lasciati com'erano
     continuano ad aggiornarsi da soli con le partite successive */
  const saveEdit=async row=>{
    setBusy(true);
    const base=baseFromTotals(ev,row.stats.auto);
    await updatePlayers(list=>list.map(p=>p.id===row.id?{...p,base,overrides:null}:p));
    setBusy(false);setEditId(null);

  const esporta=async()=>{
    if(pdf)return;
    setPdf(true);
    try{
      const esito=await esportaClassifica(standings,matches,gruppo);
      if(esito==="salvata")say("Classifica scaricata");

      say(String(e&&e.message)==="rete"?"Serve la rete per preparare il PDF la prima volta":"PDF non riuscito");

  return(
    <div>
      <Banner title="CLASSIFICA" sub={V.sub}/>
      {standings.length===0?<Empty emoji="🏆" text="Nessun giocatore. Aggiungili dalla sezione Rosa (admin)!"/>:(
        <>
          <div style={{display:"flex",gap:6,marginBottom:16}}>
            {VISTE.map(v=>(
              <button key={v.k} onClick={()=>setVista(v.k)}
                style={{flex:1,padding:"11px 4px",borderRadius:10,cursor:"pointer",fontFamily:"'Bebas Neue',sans-serif",fontSize:16,letterSpacing:1.5,
                        border:`2px solid ${vista===v.k?C.accent:C.border}`,background:vista===v.k?C.accent+"15":C.card2,
                        color:vista===v.k?C.accent:C.muted,transition:"all .15s"}}>{v.lab}</button>
            ))}
          </div>
          {tuttiZero&&<div style={{fontSize:12,color:C.muted,textAlign:"center",marginBottom:14}}>{V.vuoto}</div>}
          {!narrow&&(
            <div style={{display:"grid",gridTemplateColumns:cols,gap:4,padding:"0 10px 8px"}}>
              {["#","Giocatore","P","V","GOL","MVP",V.etichetta.toUpperCase(),...(isAdmin?[""]:[])].map((h,i)=>(
                <div key={i} style={{fontSize:9,color:C.muted,fontWeight:700,letterSpacing:.8,textAlign:i===1?"left":"center"}}>{h}</div>
              ))}
            </div>

          {lista.map((p,i)=>{
            /* la maglia nera ha senso solo nella generale: nei gol l'ultimo è

            const isFirst=i===0, isLast=vista==="generale"&&i===lista.length-1&&lista.length>1, isEd=editId===p.id, s=p.stats;
            const isCap=p.id===capId, isPick=p.id===pickId;

                    ))}
                    {avg}{editBtn}
                  </div>
                )}

                {isEd&&(
                  <div style={{borderTop:`1px solid ${C.border}`,padding:"10px"}}>
                    {narrow&&(
                      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
                        {FIELDS.map(f=>(
                          <div key={f}>
                            <div style={{fontSize:9,color:C.muted,fontWeight:700,letterSpacing:.8,textAlign:"center",marginBottom:4}}>{SHORT[f]}</div>
                            {numInput(f)}
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <div style={{fontSize:11,color:C.muted,flex:1,minWidth:150}}>Dalle partite: {s.auto.presences}·{s.auto.wins}·{s.auto.goals}·{s.auto.mvps}. Quello che cambi resta come correzione fissa, il resto continua ad aggiornarsi.</div>
                      <Btn onClick={()=>toAuto(p)} variant="ghost" small>↺ Ricalcola</Btn>
                      <Btn onClick={()=>setEditId(null)} variant="ghost" small>Annulla</Btn>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {manual&&<div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:12}}>✎ = valore con una correzione manuale sopra il calcolo delle partite</div>}
          <Btn onClick={esporta} disabled={pdf} variant="ghost" full
               style={{marginTop:16,padding:"13px 0",borderRadius:10,fontSize:14,color:C.accent,border:`1px solid ${C.accent}40`}}>
            {pdf?"Preparo il foglio…":"⬇︎ Esporta la classifica in PDF"}
          </Btn>
          <div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:8,lineHeight:1.5}}>
            Un foglio con foto, podio e statistiche, pronto da mandare nel gruppo.
          </div>
        </>
      )}
    </div>
  );
}

function MatchSection({players,matches,isAdmin,saveMatches,prefill,onPrefillUsed}){
  const [extra,setExtra]=useState([]);   // esterni aggiunti al volo per questa partita
  const [phase,setPhase]=useState("list"), [white,setWhite]=useState([]), [black,setBlack]=useState([]);
  const [sw,setSw]=useState(""), [sb,setSb]=useState("");   // risultato: bianchi - neri
  const [mvp,setMvp]=useState(""), [goals,setGoals]=useState({});
  /* il vincitore non si chiede: si legge dal punteggio. Pari non è un
     risultato: si gioca finché non vince qualcuno, quindi non si salva. */
  const esito=(sw===""||sb==="")?"":(+sw>+sb?"white":+sb>+sw?"black":"pari");
  const winner=esito==="white"||esito==="black"?esito:"";
  const [busy,setBusy]=useState(false), [delId,setDelId]=useState(null);
  const [modId,setModId]=useState(null), [conferma,setConferma]=useState(false);
  const getP=id=>players.find(p=>p.id===id)||(isExt(id)?extPlayer(id):null);
  const inCampo=players.concat(extra.map(extPlayer));
  const assign=(id,team)=>{
    if(team==="white"){setWhite(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setBlack(p=>p.filter(x=>x!==id));}
    else{setBlack(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);setWhite(p=>p.filter(x=>x!==id));}
  };
  const reset=()=>{setPhase("list");setWhite([]);setBlack([]);setSw("");setSb("");setMvp("");setGoals({});setExtra([]);
                   setModId(null);setConferma(false);};

  /* Una partita registrata si può riaprire: capita di scoprire dopo che un gol
     non era stato contato, e allora cambia anche il risultato. Si rientra dallo
     stesso percorso a 3 passi, con dentro già tutto quello che c'era. */
  const apriModifica=m=>{
    const tutti=(m.white||[]).concat(m.black||[]);
    setExtra(tutti.filter(isExt));
    setWhite(m.white||[]);setBlack(m.black||[]);
    setSw(m.scoreWhite==null?"":String(m.scoreWhite));
    setSb(m.scoreBlack==null?"":String(m.scoreBlack));
    setMvp(m.mvp||"");
    const g={};Object.entries(m.goals||{}).forEach(([id,v])=>{g[id]=String(v);});
    setGoals(g);setModId(m.id);setConferma(false);setPhase("winner");
  };

  /* Arrivando da "registra la partita con queste squadre" si salta l'assegnazione:
     è già stata fatta nella selezione, riscriverla a mano sarebbe un doppione. */
  useEffect(()=>{
    if(!prefill)return;
    const tutti=(prefill.white||[]).concat(prefill.black||[]);
    setExtra(tutti.filter(isExt));
    setWhite(prefill.white||[]);setBlack(prefill.black||[]);
    setSw("");setSb("");setMvp("");setGoals({});setPhase("winner");
    onPrefillUsed&&onPrefillUsed();
  },[prefill,onPrefillUsed]);
  const submit=async()=>{
    if(!winner||busy)return;
    setBusy(true);
    const g={};Object.entries(goals).forEach(([id,v])=>{if(+v>0)g[id]=+v;});
    const dati={white,black,winner,scoreWhite:+sw,scoreBlack:+sb,mvp:mvp||null,goals:g};
    const lista=matches||[];
    await saveMatches(modId
      ?lista.map(m=>m.id===modId?Object.assign({},m,dati):m)
      :lista.concat([Object.assign({id:uid(),date:new Date().toISOString()},dati)]));
    setBusy(false);reset();
  };
  const deleteMatch=async id=>{
    await saveMatches((matches||[]).filter(m=>m.id!==id));
    setDelId(null);
  };
  const all=[...white,...black];
  const somma=ids=>ids.reduce((n,id)=>n+(+goals[id]||0),0);
  const inModifica=modId?(
    <div style={{display:"flex",alignItems:"center",gap:8,background:C.accent+"12",border:`1px solid ${C.accent}35`,
                 borderRadius:10,padding:"10px 12px",marginBottom:12}}>
      <div style={{flex:1,fontSize:12,color:C.text,lineHeight:1.5}}>Stai correggendo una partita già in storico: quando salvi, statistiche e classifica si rifanno da sole.</div>
      <Btn onClick={reset} variant="ghost" small>Annulla</Btn>
    </div>
  ):null;

  const TeamCard=({t,ids,onClick,selected})=>(
    <div onClick={onClick} style={{flex:1,background:selected?C.accent+"12":C.card2,border:`2px solid ${selected?C.accent:C.border}`,borderRadius:12,padding:14,cursor:onClick?"pointer":"default",transition:"all .15s"}}>
      <div style={{fontWeight:800,fontSize:14,color:selected?C.accent:C.text,marginBottom:10}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"} {selected?"🏆":""}</div>
      {ids.length===0&&<div style={{fontSize:12,color:C.muted}}>Nessuno</div>}
      {ids.map(id=>{const p=getP(id);return p?<div key={id} style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}><Avatar player={p} size={24}/><span style={{fontSize:13,color:C.text}}>{p.name}</span></div>:null;})}
    </div>
  );

  return(
    <div>
      <Banner title="PARTITE" sub={isAdmin?"Registra i match per aggiornare la classifica":"Storico partite"}/>

      {phase==="list"&&(
        <>
          {isAdmin&&<Btn onClick={()=>setPhase("teams")} disabled={(players||[]).length<2} full style={{padding:"13px 0",fontSize:15,borderRadius:10,marginBottom:18}}>＋ Nuova partita</Btn>}
          {!matches||matches.length===0?<Empty emoji="⚽" text="Nessuna partita ancora."/>:
            [...(matches||[])].reverse().map(m=>(
              <div key={m.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                    {["white","black"].map(t=><span key={t} style={{padding:"3px 12px",borderRadius:6,fontSize:12,fontWeight:700,background:m.winner===t?C.accent+"22":C.card2,color:m.winner===t?C.accent:C.muted,border:`1px solid ${m.winner===t?C.accent+"50":C.border}`}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"} {m.winner===t?"🏆":""}</span>)}
                    {m.scoreWhite!=null&&<span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:1,color:C.text}}>{m.scoreWhite} – {m.scoreBlack}</span>}
                    {m.winner==="draw"&&<Tag color={C.red}>PARI · NESSUN PUNTO</Tag>}
                  </div>
                  {isAdmin&&(
                    <div style={{display:"flex",gap:4,flexShrink:0}}>
                      <button onClick={()=>apriModifica(m)} title="Correggi risultato, gol o MVP"
                        style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:"4px 9px",cursor:"pointer",fontSize:13}}>✏️</button>
                      <button onClick={()=>setDelId(m.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16,padding:"0 2px"}}>✕</button>
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:16}}>
                  {["white","black"].map(t=><div key={t} style={{flex:1}}><div style={{fontSize:10,color:C.muted,marginBottom:4}}>{t==="white"?"BIANCHI":"NERI"}</div>{(m[t]||[]).map(id=><div key={id} style={{fontSize:12,color:isExt(id)?C.muted:C.text,marginBottom:2}}>{getP(id)?.name||id}{m.goals?.[id]?<span style={{color:C.muted}}> · {m.goals[id]}⚽</span>:null}</div>)}</div>)}
                  {m.mvp&&<div><div style={{fontSize:10,color:C.muted,marginBottom:4}}>MVP</div><div style={{fontSize:12,color:C.accent}}>⭐ {getP(m.mvp)?.name}</div></div>}
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:8}}>{new Date(m.date).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"})}</div>
              </div>
            ))
          }
          {isAdmin&&(matches||[]).length>0&&(
            <div style={{fontSize:11,color:C.muted,textAlign:"center",marginTop:6,lineHeight:1.5}}>
              Con ✏️ riapri una partita e correggi risultato, gol o MVP: le statistiche si rifanno da sole.
            </div>
          )}

          {delId&&(
            <Modal onClose={()=>setDelId(null)}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:10}}>ELIMINARE LA PARTITA?</div>
              <div style={{fontSize:13,color:C.muted,marginBottom:18}}>Le statistiche dei giocatori coinvolti tornano indietro da sole: sono calcolate dalle partite.</div>
              <div style={{display:"flex",gap:8}}>
                <Btn onClick={()=>setDelId(null)} variant="ghost" style={{flex:1}}>Annulla</Btn>
                <Btn onClick={()=>deleteMatch(delId)} variant="danger" style={{flex:1}}>Elimina</Btn>
              </div>
            </Modal>
          )}
        </>
      )}

      {conferma&&(()=>{
        const marcatori=all.filter(id=>+goals[id]>0);
        const gb=somma(white),gn=somma(black);
        const torna=(+sw||0)===gb&&(+sb||0)===gn;
        return(
          <Modal onClose={()=>setConferma(false)}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:24,letterSpacing:2,color:C.text,marginBottom:12}}>{modId?"AGGIORNO LA PARTITA?":"SEI SICURO?"}</div>
            <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:14}}>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:1,color:C.accent,textAlign:"center",lineHeight:1.1}}>
                {sw||0} – {sb||0}
              </div>
              <div style={{fontSize:12,color:C.text,textAlign:"center",fontWeight:700,marginTop:2}}>
                {winner==="white"?"⬜ Vincono i bianchi":"⬛ Vincono i neri"}
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:10,lineHeight:1.6}}>
                {marcatori.length>0
                  ?<>Gol: {marcatori.map(id=>(getP(id)||{}).name+" "+(+goals[id])).join(" · ")}</>
                  :<>Nessun marcatore segnato.</>}
                {mvp&&<div>MVP: {(getP(mvp)||{}).name}</div>}
              </div>
            </div>
            {!torna&&<div style={{fontSize:11,color:C.red,marginBottom:12,lineHeight:1.5}}>
              Attenzione: i gol assegnati ({gb} – {gn}) non tornano col risultato scritto ({sw||0} – {sb||0}). Puoi salvare lo stesso e correggere dopo.
            </div>}
            <div style={{fontSize:11,color:C.muted,marginBottom:14,lineHeight:1.5}}>
              {modId?"Le statistiche si rifanno da sole sui valori nuovi."
                    :"Finisce in storico e aggiorna classifica, gol e MVP. Se sbagli puoi riaprirla dallo storico con la matita."}
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>setConferma(false)} variant="ghost" style={{flex:1}}>No, torno indietro</Btn>
              <Btn onClick={submit} disabled={busy} style={{flex:1}}>{busy?"Salvo…":(modId?"Sì, aggiorna":"Sì, salva")}</Btn>
            </div>
          </Modal>
        );
      })()}

      {phase==="teams"&&(
        <>
          <StepBar phase={phase}/>
          <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Assegna ogni giocatore a una squadra · <strong style={{color:C.text}}>{white.length}</strong> vs <strong style={{color:C.text}}>{black.length}</strong></div>
          {inCampo.map(p=>{
            const iW=white.includes(p.id),iB=black.includes(p.id);
            return(
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${iW||iB?C.accent+"35":C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                <Avatar player={p} size={36}/><span style={{flex:1,fontWeight:600,fontSize:14,color:C.text}}>{p.name}</span>
                <div style={{display:"flex",gap:6}}>
                  {["white","black"].map(t=>{const active=t==="white"?iW:iB;return<button key={t} onClick={()=>assign(p.id,t)} style={{padding:"6px 14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"'DM Sans',sans-serif",border:`2px solid ${active?C.accent:C.border}`,background:active?(t==="white"?"#ffffff18":"#33333344"):C.card2,color:active?C.accent:C.muted,transition:"all .15s"}}>{t==="white"?"⬜":"⬛"}</button>;})}
                </div>
              </div>
            );
          })}
          <Btn onClick={()=>setExtra(e=>e.concat("ext"+(e.length+1)))} variant="ghost" full small style={{marginTop:4}}>＋ Aggiungi un esterno</Btn>
          <div style={{fontSize:11,color:C.muted,marginTop:8,lineHeight:1.5}}>Gli esterni riempiono i buchi per giocare: non entrano in classifica e non prendono statistiche.</div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <Btn onClick={reset} variant="ghost" style={{flex:1}}>Annulla</Btn>
            <Btn onClick={()=>setPhase("winner")} disabled={!white.length||!black.length} style={{flex:2}}>Avanti →</Btn>
          </div>
        </>
      )}

      {phase==="winner"&&(
        <>
          <StepBar phase={phase}/>
          {inModifica}
          <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.5}}>
            Scrivi com'è finita: il vincitore lo ricavo dal punteggio.
            <span style={{color:C.muted}}> Da qui si torna indietro quando vuoi, e anche dopo aver salvato la partita si può correggere dallo storico.</span>
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {[["white",sw,setSw,"⬜ BIANCHI"],["black",sb,setSb,"⬛ NERI"]].map(([t,val,set,lab],i)=>(
                <React.Fragment key={t}>
                  {i===1&&<span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color:C.muted}}>–</span>}
                  <div style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:6}}>{lab}</div>
                    <input type="number" min="0" inputMode="numeric" value={val} onChange={e=>set(e.target.value)} placeholder="0"
                      style={{width:"100%",background:C.card2,border:`2px solid ${esito===t?C.accent:C.border}`,color:C.text,borderRadius:10,
                              padding:"12px 4px",fontSize:30,fontFamily:"'Bebas Neue',sans-serif",textAlign:"center"}}/>
                  </div>
                </React.Fragment>
              ))}
            </div>
            <div style={{textAlign:"center",marginTop:12,fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:2,
                         color:esito==="pari"?C.red:esito?C.accent:C.border}}>
              {esito==="pari"?"NON PUÒ FINIRE PARI":esito==="white"?"VINCONO I BIANCHI":esito==="black"?"VINCONO I NERI":"— — —"}
            </div>
            {esito==="pari"&&<div style={{textAlign:"center",fontSize:11,color:C.red,marginTop:4,lineHeight:1.5}}>Il pareggio da noi non esiste: si va avanti finché non vince qualcuno. Sistema il punteggio.</div>}
          </div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            {["white","black"].map(t=><TeamCard key={t} t={t} ids={t==="white"?white:black} selected={winner===t}/>)}
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setPhase("teams")} variant="ghost" style={{flex:1,padding:"14px 0",fontSize:14,borderRadius:10}}>← Indietro</Btn>
            <Btn onClick={()=>setPhase("extra")} disabled={!winner} style={{flex:2,padding:"14px 0",fontSize:15,borderRadius:10}}>Avanti →</Btn>
          </div>
        </>
      )}

      {phase==="extra"&&(
        <>
          <StepBar phase={phase}/>
          {inModifica}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:12}}>
            <div style={{fontWeight:700,marginBottom:10,color:C.text,fontSize:14}}>⭐ MVP (opzionale)</div>
            <select value={mvp} onChange={e=>setMvp(e.target.value)} style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:"9px 12px",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>
              <option value="">— Nessun MVP —</option>
              {all.filter(id=>!isExt(id)).map(id=>{const p=getP(id);return p?<option key={id} value={id}>{p.name}</option>:null;})}
            </select>
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{fontWeight:700,marginBottom:4,color:C.text,fontSize:14}}>⚽ Chi ha segnato</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:12,lineHeight:1.5}}>Squadra per squadra, quanti gol ha fatto ognuno. Da qui si aggiornano i gol nel profilo e la classifica marcatori.</div>
            {["white","black"].map(t=>{
              const ids=t==="white"?white:black;
              const fatti=ids.reduce((n,id)=>n+(+goals[id]||0),0);
              const atteso=+(t==="white"?sw:sb)||0;
              return(
                <div key={t} style={{marginBottom:t==="white"?14:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                    <span style={{fontSize:11,color:C.muted,fontWeight:800,letterSpacing:.8}}>{t==="white"?"⬜ BIANCHI":"⬛ NERI"}</span>
                    <div style={{flex:1,height:1,background:C.border}}/>
                    <span style={{fontSize:11,color:fatti===atteso?C.green:C.muted}}>{fatti} di {atteso}</span>
                  </div>
                  {ids.map(id=>{const p=getP(id);return p?(
                    <div key={id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                      <Avatar player={p} size={28}/>
                      <span style={{flex:1,fontSize:13,color:isExt(id)?C.muted:C.text}}>{p.name}</span>
                      <input type="number" min="0" max="20" placeholder="0" value={goals[id]||""} onChange={e=>setGoals(g=>({...g,[id]:e.target.value}))} style={{width:52,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:6,padding:"6px 8px",fontSize:14,textAlign:"center",fontFamily:"'DM Sans',sans-serif"}}/>
                    </div>):null;})}
                </div>
              );
            })}
          </div>
          {(()=>{
            const gb=somma(white), gn=somma(black);
            const manca=(+sw||0)-gb, mancaN=(+sb||0)-gn;
            if(manca===0&&mancaN===0)return null;
            /* Non blocca: capita di non sapere chi ha segnato, o di contare
               un'autorete. Serve solo a non accorgersene dopo. */
            return(
              <div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:14,fontSize:12,color:C.muted,lineHeight:1.6}}>
                Risultato scritto: <strong style={{color:C.text}}>{sw||0} – {sb||0}</strong>. Gol assegnati: <strong style={{color:C.text}}>{gb} – {gn}</strong>.
                {manca>0&&<> Mancano <strong style={{color:C.accent}}>{manca}</strong> gol dei bianchi.</>}
                {mancaN>0&&<> Mancano <strong style={{color:C.accent}}>{mancaN}</strong> gol dei neri.</>}
                {(manca<0||mancaN<0)&&<> Ne hai assegnati più di quanti ne dice il risultato.</>}
                <div style={{fontSize:11,marginTop:4}}>Puoi salvare lo stesso: il punteggio è quello che conta per la classifica.</div>
              </div>
            );
          })()}
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setPhase("winner")} variant="ghost" style={{flex:1,padding:"14px 0",fontSize:14,borderRadius:10}}>← Indietro</Btn>
            <Btn onClick={()=>setConferma(true)} disabled={!winner||busy} style={{flex:2,padding:"14px 0",fontSize:15,borderRadius:10}}>{modId?"Aggiorna la partita ✓":"Salva partita ✓"}</Btn>
          </div>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   CONVOCAZIONE — chi c'è alla prossima partita
   Ci mette mano chiunque: capita che uno lo dica sul gruppo e lo segni
   un altro. Resta cambiabile fino all'ultimo, perché all'ultimo si cambia.
═══════════════════════════════════════════════════════ */
const GIORNI=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const GIORNI_BREVI=["DOM","LUN","MAR","MER","GIO","VEN","SAB"];
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const GIORNO_PARTITA=4;   // giovedì
const GIORNO_AVVISO=0;    // domenica: da qui in poi si chiede "ci sei?"

/* La prossima partita: il primo giorno buono da oggi in avanti. Se oggi è il
   giorno ma l'ora è passata da un pezzo, si guarda già alla settimana dopo:
   una convocazione per una partita già giocata non serve a nessuno. */
function nextMatch(settings){
  const s=settings||{};
  const day=Number.isInteger(s.matchDay)?s.matchDay:GIORNO_PARTITA;
  const now=new Date();
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let diff=(day-d.getDay()+7)%7;
  if(diff===0&&s.matchTime){
    const[h,m]=String(s.matchTime).split(":").map(Number);
    const fine=new Date(d);fine.setHours((h||0)+3,m||0,0,0);
    if(now>fine)diff=7;
  }
  d.setDate(d.getDate()+diff);
  return d;
}
const dataLunga=d=>`${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;

/* Quando comincia a girare la domanda "ci sei?": dal giorno d'avviso della
   settimana che porta alla partita. Prima di quello la partita è ancora
   lontana e chiederlo servirebbe solo a farsi rispondere "boh". */
function avvisoAperto(settings,adesso){
  const s=settings||{};
  const giorno=Number.isInteger(s.openDay)?s.openDay:GIORNO_AVVISO;
  const m=nextMatch(s);
  const apertura=new Date(m);
  const indietro=((m.getDay()-giorno+7)%7)||7;
  apertura.setDate(m.getDate()-indietro);
  apertura.setHours(0,0,0,0);
  return (adesso||new Date())>=apertura;
}

function CallupSection({players,board,matchDate,setCallup,setSettings,myPlayerId,members,say}){
  const [conf,setConf]=useState(false);
  const iso=isoDate(matchDate);
  const risposte=(board&&board.callups&&board.callups[iso])||{};
  const s=(board&&board.settings)||{};
  const [ora,setOra]=useState(s.matchTime||"");

  const stato=id=>(risposte[id]&&risposte[id].v)||null;
  const si=players.filter(p=>stato(p.id)==="si");
  const no=players.filter(p=>stato(p.id)==="no");
  const muti=players.filter(p=>!stato(p.id));
  const io=players.find(p=>p.id===myPlayerId);

  /* "segnato da Marco": solo se l'ha fatto qualcun altro */
  const chiHaSegnato=id=>{
    const r=risposte[id];if(!r||!r.by)return null;
    const m=(members||[]).find(x=>x.user_id===r.by);
    if(!m||m.player_id===id)return null;
    const p=players.find(x=>x.id===m.player_id);
    return (p&&p.name)||m.member_name||null;
  };

  const Riga=({p})=>{
    const v=stato(p.id), segnato=chiHaSegnato(p.id);
    return(
      <div style={{display:"flex",alignItems:"center",gap:10,background:C.card,border:`1px solid ${p.id===myPlayerId?C.accent+"40":C.border}`,borderRadius:10,padding:"9px 12px",marginBottom:6}}>
        <Avatar player={p} size={32}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:14,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {p.name}{p.id===myPlayerId&&<span style={{fontSize:9,color:C.accent,fontWeight:800,marginLeft:6,letterSpacing:1}}>TU</span>}
          </div>
          {segnato&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>segnato da {segnato}</div>}
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          {[["si","✓",C.green],["no","✕",C.red]].map(([val,segno,col])=>(
            <button key={val} onClick={()=>setCallup(p.id,v===val?"":val)}
              style={{width:38,height:34,borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:15,fontFamily:"'DM Sans',sans-serif",
                      border:`2px solid ${v===val?col:C.border}`,background:v===val?col+"22":C.card2,color:v===val?col:C.muted,transition:"all .15s"}}>
              {segno}
            </button>
          ))}
        </div>
      </div>
    );
  };

  return(
    <div>
      <Banner title="CI SEI?" sub="La convocazione la può sistemare chiunque, fino all'ultimo"/>

      <div style={{background:C.card,border:`1px solid ${C.accent}30`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:3}}>PROSSIMA PARTITA</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:1,color:C.accent,lineHeight:1.1}}>
              {dataLunga(matchDate).toUpperCase()}
            </div>
            {s.matchTime&&<div style={{fontSize:12,color:C.muted,marginTop:2}}>ore {s.matchTime}</div>}
          </div>
          <Btn onClick={()=>setConf(c=>!c)} variant="ghost" small>{conf?"Chiudi":"Modifica"}</Btn>
        </div>

        {conf&&(
          <div style={{borderTop:`1px solid ${C.border}`,marginTop:14,paddingTop:14}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:8}}>Che giorno si gioca</div>
            <div style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap"}}>
              {GIORNI_BREVI.map((g,i)=>{
                const sel=(Number.isInteger(s.matchDay)?s.matchDay:GIORNO_PARTITA)===i;
                return <button key={i} onClick={()=>setSettings({matchDay:i})}
                  style={{flex:"1 0 44px",padding:"9px 0",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:11,fontFamily:"'DM Sans',sans-serif",
                          border:`2px solid ${sel?C.accent:C.border}`,background:sel?C.accent+"18":C.card2,color:sel?C.accent:C.muted}}>{g}</button>;
              })}
            </div>
            <div style={{fontSize:11,color:C.muted,marginBottom:8}}>Da che giorno parte l'avviso "ci sei?"</div>
            <div style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap"}}>
              {GIORNI_BREVI.map((g,i)=>{
                const sel=(Number.isInteger(s.openDay)?s.openDay:GIORNO_AVVISO)===i;
                return <button key={i} onClick={()=>setSettings({openDay:i})}
                  style={{flex:"1 0 44px",padding:"9px 0",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:11,fontFamily:"'DM Sans',sans-serif",
                          border:`2px solid ${sel?C.blue||C.accent:C.border}`,background:sel?(C.blue||C.accent)+"18":C.card2,color:sel?(C.blue||C.accent):C.muted}}>{g}</button>;
              })}
            </div>
            <div style={{fontSize:11,color:C.muted,marginBottom:8}}>A che ora</div>
            <div style={{display:"flex",gap:8}}>
              <input value={ora} onChange={e=>setOra(e.target.value)} placeholder="20:30" inputMode="numeric"
                style={{flex:1,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:"10px 14px",fontSize:14,fontFamily:"'DM Sans',sans-serif"}}/>
              <Btn onClick={()=>{setSettings({matchTime:ora.trim()});say("Orario aggiornato");}} variant="dark">Salva</Btn>
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:10,lineHeight:1.5}}>Vale per tutti: lo può cambiare chiunque nel gruppo.</div>
          </div>
        )}
      </div>

      {io&&!stato(io.id)&&(
        <div style={{background:C.accent+"12",border:`1px solid ${C.accent}35`,borderRadius:14,padding:16,marginBottom:16,textAlign:"center"}}>
          <div style={{fontSize:14,color:C.text,fontWeight:700,marginBottom:12}}>Allora {io.name}, ci sei?</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setCallup(io.id,"si")} style={{flex:1,padding:"14px 0",borderRadius:10,cursor:"pointer",border:"none",background:C.green,color:"#04210F",fontWeight:800,fontSize:15,fontFamily:"'DM Sans',sans-serif"}}>✓ CI SONO</button>
            <button onClick={()=>setCallup(io.id,"no")} style={{flex:1,padding:"14px 0",borderRadius:10,cursor:"pointer",border:`2px solid ${C.red}40`,background:"transparent",color:C.red,fontWeight:800,fontSize:15,fontFamily:"'DM Sans',sans-serif"}}>✕ NON CI SONO</button>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[["CI SONO",si.length,C.green],["NO",no.length,C.red],["NON RISPONDE",muti.length,C.muted]].map(([l,n,col])=>(
          <div key={l} style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 6px",textAlign:"center"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,lineHeight:1,color:col}}>{n}</div>
            <div style={{fontSize:9,color:C.muted,letterSpacing:.6,marginTop:3}}>{l}</div>
          </div>
        ))}
      </div>

      {players.length===0&&<Empty emoji="👥" text="Non c'è ancora nessuno in rosa."/>}

      {si.length>0&&<><div style={{fontSize:10,color:C.green,fontWeight:800,letterSpacing:1,margin:"4px 2px 8px"}}>CI SONO ({si.length})</div>{si.map(p=><Riga key={p.id} p={p}/>)}</>}
      {muti.length>0&&<><div style={{fontSize:10,color:C.muted,fontWeight:800,letterSpacing:1,margin:"18px 2px 8px"}}>ANCORA NIENTE ({muti.length})</div>{muti.map(p=><Riga key={p.id} p={p}/>)}</>}
      {no.length>0&&<><div style={{fontSize:10,color:C.red,fontWeight:800,letterSpacing:1,margin:"18px 2px 8px"}}>NON CI SONO ({no.length})</div>{no.map(p=><Riga key={p.id} p={p}/>)}</>}
    </div>
  );
}

/* Capitano e picker: di norma il primo e l'ultimo della classifica, ma il
   gruppo può sceglierli a mano — uno manca, uno ha già fatto il capitano
   tre volte di fila, si decide diversamente. La scelta vale finché non la
   si toglie. */
function rolesOf(standings,settings){
  const s=settings||{};
  const has=id=>!!id&&standings.some(p=>p.id===id);
  const auto1=standings.length?standings[0].id:null;
  const autoLast=standings.length>=2?standings[standings.length-1].id:null;
  const capId=has(s.captainId)?s.captainId:auto1;
  let pickId=has(s.pickerId)?s.pickerId:autoLast;
  if(pickId===capId){                     // stessa persona in tutti e due i ruoli: non si può
    const alt=standings.find(p=>p.id!==capId);
    pickId=alt?alt.id:null;
  }
  return{capId,pickId,capManual:has(s.captainId),pickManual:has(s.pickerId)};
}

/* ═══════════════════════════════════════════════════════
   SELEZIONE SQUADRE — due metodi, in tempo reale
   · cava: il formatore fa le due squadre, il capitano sceglie il lato
   · tradizionale: chiamata alternata, uno per volta, comincia il formatore
   Si pesca fra chi ha detto che c'è; gli esterni riempiono i buchi.
═══════════════════════════════════════════════════════ */
const isExt=id=>/^ext\d+$/.test(String(id||""));
const extName=id=>"Esterno "+String(id).slice(3);
const extPlayer=id=>({id,name:extName(id),ext:true});

function TeamsSection({standings,eligible,teamSel,setSel,myPlayerId,isAdmin,capId,pickId,capManual,pickManual,decaduti,setSettings,availableIds,playAll,onUseTeams,onAggiungi}){
  const [scegli,setScegli]=useState(false);
  const [agg,setAgg]=useState(false);
  const [modifica,setModifica]=useState(false);

  const hasCap=standings.length>=2&&capId&&pickId;
  const captain=hasCap?standings.find(p=>p.id===capId):null;
  const picker=hasCap?standings.find(p=>p.id===pickId):null;
  const byId=id=>standings.find(p=>p.id===id)||(isExt(id)?extPlayer(id):{id,name:"?"});

  const phase=teamSel?.phase||"idle";
  const metodo=teamSel?.method||"cava";
  const assign=teamSel?.assign||{};
  const captainSide=teamSel?.captainSide||null;
  const pool=teamSel?.pool||[];
  const picks=teamSel?.picks||[];
  const extN=teamSel?.ext||0;

  /* Due cose diverse che prima erano una sola: chi SEI e cosa PUOI FARE.
     L'admin può agire al posto di chiunque — serve quando uno ha il telefono
     scarico o non è ancora entrato — ma allora i testi non devono dargli del
     "tu": si ritrovava "invia a Mera" essendo Mera. */
  const sonoFormatore=!!picker&&myPlayerId===picker.id;
  const sonoCapitano=!!captain&&myPlayerId===captain.id;
  const ioPicker=sonoFormatore||(!!picker&&isAdmin);
  const ioCapitano=sonoCapitano||(!!captain&&isAdmin);
  const perContoDelFormatore=ioPicker&&!sonoFormatore;
  const perContoDelCapitano=ioCapitano&&!sonoCapitano;

  /* ─── chi gioca ───
     La scelta sta nella bacheca, non in questa schermata: capitano e formatore
     si calcolano su chi scende davvero in campo, e devono venire uguali per
     tutti. Prendere il primo e l'ultimo della rosa intera vorrebbe dire far
     chiamare le squadre a qualcuno che magari nemmeno gioca. */
  const disponibili=standings.filter(p=>(availableIds||[]).indexOf(p.id)>=0);
  const baseIds=(eligible||standings).map(p=>p.id);
  const fuori=standings.filter(p=>baseIds.indexOf(p.id)<0);   // chi non è ancora in campo
  const inGioco=baseIds.concat(Array.from({length:extN},(_,i)=>"ext"+(i+1)));

  const nomina=(ruolo,id)=>{
    if(ruolo==="cap")setSettings({captainId:id,pickerId:pickId===id?null:(pickManual?pickId:null)});
    else setSettings({pickerId:id,captainId:capId===id?null:(capManual?capId:null)});
  };
  const automatico=()=>setSettings({captainId:null,pickerId:null});

  const avvia=m=>{
    const p=inGioco.slice();
    if(p.indexOf(capId)<0)p.push(capId);
    if(p.indexOf(pickId)<0)p.push(pickId);
    setSel({phase:m==="cava"?"picking":"draft",method:m,pool:p,ext:extN,
            capId,pickId,   // congelati: da qui in poi non si muovono più
            assign:{},picks:[],captainSide:null,finalWhite:null,finalBlack:null});
  };
  const reset=()=>setSel({phase:"idle",method:metodo,assign:{},picks:[],pool:[],ext:0,
                          capId:null,pickId:null,
                          captainSide:null,finalWhite:null,finalBlack:null});
  const aggiungiEsterno=()=>{
    const n=extN+1;
    if(phase==="idle")setSel({ext:n});
    else setSel({ext:n,pool:(pool||[]).concat("ext"+n)});
  };

  /* ─── cava ─── */
  const altri=pool.filter(id=>id!==capId&&id!==pickId);
  const canSend=altri.every(id=>assign[id]==="white"||assign[id]==="black");
  const toggleAssign=(id,side)=>setSel({assign:Object.assign({},assign,{[id]:assign[id]===side?null:side})});
  const captainPick=side=>{
    const base_=side==="white"?[captain.id]:[picker.id];
    const other=side==="white"?[picker.id]:[captain.id];
    setSel({phase:"done",captainSide:side,
      finalWhite:(side==="white"?base_:other).concat(altri.filter(id=>assign[id]==="white")),
      finalBlack:(side==="black"?base_:other).concat(altri.filter(id=>assign[id]==="black"))});
  };

  /* ─── tradizionale: chiama prima il formatore, poi si alterna ─── */
  const teamA=[pickId].concat(picks.filter(x=>x.t==="A").map(x=>x.id));
  const teamB=[capId].concat(picks.filter(x=>x.t==="B").map(x=>x.id));
  const presi=teamA.concat(teamB);
  const restanti=pool.filter(id=>presi.indexOf(id)<0);
  const turno=picks.length%2===0?"A":"B";
  const chiChiama=turno==="A"?picker:captain;
  const ioChiamo=turno==="A"?ioPicker:ioCapitano;
  const chiama=id=>{
    const nuovi=picks.concat({t:turno,id});
    const rimasti=pool.filter(x=>teamA.concat(teamB,[id]).indexOf(x)<0);
    if(rimasti.length===0){
      const A=[pickId].concat(nuovi.filter(x=>x.t==="A").map(x=>x.id));
      const B=[capId].concat(nuovi.filter(x=>x.t==="B").map(x=>x.id));
      setSel({picks:nuovi,phase:"done",captainSide:null,finalWhite:A,finalBlack:B});
    }else setSel({picks:nuovi});
  };
  const annullaUltima=()=>setSel({picks:picks.slice(0,-1)});

  /* Squadre già fatte ma ancora aggiustabili: il giorno della partita uno si
     ritira, ne arriva un altro, due si scambiano. Rifare tutta la chiamata per
     questo sarebbe assurdo, quindi qui si sposta senza toccare il metodo. */
  const fW=(teamSel&&teamSel.finalWhite)||[], fB=(teamSel&&teamSel.finalBlack)||[];
  const spostaIn=(id,lato)=>{
    const w=fW.filter(x=>x!==id), b=fB.filter(x=>x!==id);
    if(lato==="white")w.push(id); else if(lato==="black")b.push(id);
    setSel({finalWhite:w,finalBlack:b});
  };
  const esternoInSquadra=()=>{
    const n=extN+1, id="ext"+n;
    const w=fW.slice(), b=fB.slice();
    (w.length<=b.length?w:b).push(id);
    setSel({ext:n,pool:(pool||[]).concat(id),finalWhite:w,finalBlack:b});
  };
  const fuoriPartita=standings.filter(p=>fW.indexOf(p.id)<0&&fB.indexOf(p.id)<0);

  const Attesa=({chi,cosa,colore})=>(
    <div style={{background:colore+"12",border:`1px solid ${colore}30`,borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
      <Avatar player={chi} size={32}/>
      <div style={{fontSize:13,color:C.text,lineHeight:1.5}}>
        <strong style={{color:colore}}>{chi.name}</strong> {cosa}
        <div style={{fontSize:11,color:C.muted}}>Lo vedi aggiornarsi qui, in diretta</div>
      </div>
    </div>
  );
  const Colonna=({label,ids,col,sub})=>(
    <div style={{flex:1,background:C.card2,border:`1px solid ${col}30`,borderRadius:12,padding:12}}>
      <div style={{fontWeight:800,fontSize:13,color:C.text}}>{label} <span style={{color:C.muted}}>({ids.length})</span></div>
      {sub&&<div style={{fontSize:10,color:col,marginBottom:10,fontWeight:700}}>{sub}</div>}
      {ids.map(id=>{const p=byId(id);return(
        <div key={id} style={{display:"flex",alignItems:"center",gap:7,marginBottom:6,opacity:p.ext?.65:1}}>
          <Avatar player={p} size={24}/>
          <span style={{fontSize:12,color:myPlayerId===id?C.accent:C.text,fontWeight:myPlayerId===id?800:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
        </div>);})}
    </div>
  );
  const BtnEsterno=<Btn onClick={aggiungiEsterno} variant="ghost" full small style={{marginTop:8}}>＋ Aggiungi un esterno</Btn>;

  /* Il bivio fra i due metodi sta nella schermata di preparazione: con una
     selezione già avviata non lo si vedeva più, e chi voleva cambiare non
     sapeva da dove passare. Questa barra lo dice sempre, e riporta indietro. */
  const BarraMetodo=phase!=="idle"?(
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
      <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:15,letterSpacing:2,color:C.muted}}>
        METODO {metodo==="draft"?"TRADIZIONALE":"CAVA"}
      </span>
      <div style={{flex:1}}/>
      {(ioPicker||ioCapitano)&&<Btn onClick={reset} variant="ghost" small>↺ Cambia metodo</Btn>}
    </div>
  ):null;

  return(
    <div>
      <Banner title="SELEZIONE SQUADRE" sub="Aggiornamento in tempo reale per tutti"/>
      {!hasCap?<Empty emoji="🛡️" text="Servono almeno 2 giocatori in classifica."/>:

      phase==="idle"?(
        <>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[{player:captain,role:"🏆 CAPITANO",desc:metodo==="cava"?"Sceglie la squadra":"Chiama per secondo",color:C.accent,man:capManual},
              {player:picker,role:"🛡️ FORMATORE",desc:metodo==="cava"?"Fa le due squadre":"Chiama per primo",color:C.red,man:pickManual}].map(({player,role,desc,color,man})=>(
              <div key={player.id} style={{background:color+"0D",border:`1px solid ${color}25`,borderRadius:14,padding:16,textAlign:"center"}}>
                <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:10}}>{role}</div>
                <Avatar player={player} size={56}/>
                <div style={{fontWeight:800,color,marginTop:10,fontSize:15}}>{player.name}{myPlayerId===player.id?" (tu)":""}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:4}}>{desc}</div>
                {man&&<div style={{fontSize:10,color:C.muted,fontStyle:"italic"}}>scelto a mano</div>}
              </div>
            ))}
          </div>

          {(decaduti||[]).length>0&&(
            <div style={{background:C.red+"10",border:`1px solid ${C.red}30`,borderRadius:12,padding:"10px 12px",marginBottom:10,fontSize:11,color:C.text,lineHeight:1.5}}>
              {(decaduti||[]).map(d=>(
                <div key={d.ruolo}>{d.name} era {d.ruolo} per scelta vostra, ma ha detto che non c'è: il ruolo passa alla classifica.</div>
              ))}
            </div>
          )}

          <Btn onClick={()=>setScegli(v=>!v)} variant="ghost" full small>
            {scegli?"Chiudi":(capManual||pickManual||(decaduti||[]).length>0)?"Capitano e formatore scelti a mano · cambia":"Scegli capitano e formatore a mano"}
          </Btn>
          {scegli&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:12,marginTop:8}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:10,lineHeight:1.5}}>Senza scelte è il primo e l'ultimo della classifica. Lo può cambiare chiunque.</div>
              {standings.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
                  <Avatar player={p} size={28}/>
                  <span style={{flex:1,fontSize:13,color:C.text,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
                  {[["cap","🏆",capId,C.accent],["pick","🛡️",pickId,C.red]].map(([r,ico,attuale,col])=>(
                    <button key={r} onClick={()=>nomina(r,p.id)}
                      style={{width:40,height:32,borderRadius:8,cursor:"pointer",fontSize:14,
                              border:`2px solid ${attuale===p.id?col:C.border}`,
                              background:attuale===p.id?col+"22":C.card2,opacity:attuale===p.id?1:.55}}>{ico}</button>
                  ))}
                </div>
              ))}
              {(capManual||pickManual||(decaduti||[]).length>0)&&<Btn onClick={automatico} variant="ghost" full small style={{marginTop:10}}>↺ Torna alla classifica</Btn>}
            </div>
          )}

          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,margin:"16px 0"}}>
