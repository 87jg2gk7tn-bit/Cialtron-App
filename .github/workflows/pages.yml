name: Pubblica su GitHub Pages

# Ogni push al branch di sviluppo ripubblica il sito: l'app sul telefono
# si aggiorna da sola (con l'avviso "Nuova versione disponibile").
on:
  push:
    branches:
      - main
      - claude/cialtronapp-project-status-vm42ul
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true          # attiva Pages se non è ancora attivo
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
